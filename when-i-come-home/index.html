/* Build the two words lazily, once fonts are ready, then drive the shot. */
function deskWords(){
  if(!DESK.ready) return null;
  if(!DESK.words){
    DESK.words={
      worries: DESK.makeWord("Worries", -9,  0xf7f2e8),
      sadness: DESK.makeWord("Sadness", -24, 0xf7f2e8)
    };
  }
  // the glyph outlines need the handwriting font, which loads asynchronously
  for(const key of Object.keys(DESK.words)){
    const g=DESK.words[key];
    if(g.userData.pending) DESK.buildWordMeshes(g);
  }
  return DESK.words;
}

/* Render scene 3. tt is the film clock. */
function renderDesk(tt, rnd){
  if(!DESK.ready) return;
  const W=deskWords();
  const cam=DESK.cam, world=DESK.world;

  // size the shared canvas for this scene too (the portal path does its own)
  const cv=rnd.domElement;
  if(cv.width!==cv.clientWidth || cv.height!==cv.clientHeight){
    rnd.setPixelRatio(Math.min(devicePixelRatio||1,2));
    rnd.setSize(cv.clientWidth, cv.clientHeight, false);
    cam.aspect=cv.clientWidth/Math.max(1,cv.clientHeight);
    cam.updateProjectionMatrix();
  }

  // --- the spheres roll down the incline, accelerating ---
  const t0=7.45;
  const u=Math.max(0, tt-t0);
  const z = -2.0 - 0.55*u*u*u - 1.9*u;          // travels down the desk (-z)
  DESK.ballM.position.set(-1.05, DESK.R, z);
  DESK.ballF.position.set( 1.05, DESK.R, z+0.5);
  // Rolling without slip: angle = distance travelled / radius. Travel is in
  // -z, and a sphere moving that way spins its top away from camera, which is
  // a POSITIVE rotation about +x.
  const dist=Math.max(0, -(z) - 2.0);
  // Right-hand rule about +x: a positive angle carries the ball's top toward
  // +z (toward camera). We travel toward -z, so the roll is NEGATIVE.
  const roll=-dist/DESK.R;
  DESK.ballM.rotation.set(roll,0,0);
  DESK.ballF.rotation.set(roll,0,0);
  // kick on impact: they bounce and wobble as they smash through each word
  const bump = (at)=>{ const b=inv(tt,at,at+0.42); return b>0&&b<1 ? Math.sin(b*Math.PI)*0.42 : 0; };
  const lift = bump(8.50)+bump(10.46);
  DESK.ballM.position.y = DESK.R + lift;
  DESK.ballF.position.y = DESK.R + lift*0.82;
  DESK.ballM.rotation.z = lift*0.5;
  DESK.ballF.rotation.z = -lift*0.45;

  // --- camera ---
  // Starts low and close behind them for speed, then eases back and higher so
  // each word is read before impact, with a slight lateral drift for life.
  const settle=easeOut(clamp(u/2.2,0,1));
  // settle EARLY and then hold: previously it kept descending and clipped the
  // desk surface near the end, which is where the black frame came from
  const camH   = lerp(3.6, 4.6, settle);
  const camBack= lerp(7.0, 9.2, settle);
  const sway   = Math.sin(u*0.55)*0.45*settle;
  // ease downward as each word is destroyed, so the debris flies past us
  const kick = inv(tt,8.50,8.70)*(1-inv(tt,8.70,9.30))
             + inv(tt,10.46,10.66)*(1-inv(tt,10.66,11.30));
  // The INCLINE tilts the whole world, so the desk surface rises as z falls.
  // The camera must ride that slope with the balls — a fixed world height ends
  // up BELOW the desk (which is what produced the black frames at the end).
  // Place the camera inside `world` so it inherits the tilt automatically.
  const camZ=z+camBack, lookZ=z-7.5-settle*2.0;
  cam.position.set(sway, camH + kick*0.55, camZ);
  cam.lookAt(sway*0.4, 1.0 + kick*0.3, lookZ);

  // --- destruction: each word explodes when the balls reach it ---
  const hits=[{g:W.worries, z:-9,  at:8.50},
              {g:W.sadness, z:-24, at:10.46}];
  for(const hit of hits){
    const k=inv(tt, hit.at, hit.at+0.9);
    hit.g.children.forEach((L)=>{
      const sd=L.userData.seed||0;
      const home=L.userData.home;
      if(!home) return;
      if(k<=0){
        L.position.copy(home);
        L.rotation.set(0,0,0);
        L.scale.setScalar(1);
        // fade in as the camera approaches, so it arrives rather than waiting
        L.visible = tt > hit.at-2.4;
        return;
      }
      // struck: knocked outward, up, tumbling, then shrinking away
      const dir=(home.x>=0?1:-1);
      const e=easeOut(k);
      L.position.set(
        home.x + dir*e*(2.4+sd*3.2),
        home.y + e*(2.8+sd*2.4) - k*k*6.0,
        home.z + e*(1.2+sd*2.8)
      );
      L.rotation.set(k*(4+sd*6), k*(3+sd*5), k*(5+sd*4));
      const sc=Math.max(0,1-k*1.05);
      L.scale.setScalar(sc);
      L.visible=sc>0.02;
    });
  }
  // --- fade the desk down to ink so scene 4 can open from the same value ---
  {
    const fade=inv(tt, 10.75, 11.55);
    const k2=easeIO(fade);
    // (lerping from the cached base every frame also restores on scrub-back)
    DESK.scene.traverse(o=>{
      if(!o.isMesh || !o.material) return;
      const mats=Array.isArray(o.material)?o.material:[o.material];
      for(const mm of mats){
        if(!mm.color) continue;
        if(mm.userData.__base===undefined) mm.userData.__base=mm.color.clone();
        mm.color.copy(mm.userData.__base).lerp(new THREE.Color(0x07080c), k2);
      }
    });
    if(DESK.scene.fog)
      DESK.scene.fog.color.copy(new THREE.Color(0xe8dcc6)).lerp(new THREE.Color(0x07080c), k2);
  }
  rnd.render(DESK.scene, cam);
}



/* ---------- scene 4: bouncing the line (full 3D) ---------- */
/* The two balls take alternating words. Each hop is solved from the GAP
   between the two sung timestamps: with launch and landing at the same
   height, gravity fixes the launch velocity exactly (v0 = g*T/2), so every
   bounce lands on its word on the beat without hand-tuning. */
const HOP={ready:false};
(function initHop(){
  if(typeof THREE==="undefined") return;
  const cv=document.getElementById("gl");
  if(!cv) return;

  const scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0xcfe4f2, 55, 150);
  const cam=new THREE.PerspectiveCamera(44, 16/9, 0.1, 200);

  const world=new THREE.Group();
  scene.add(world);

  const flat=(hex)=>new THREE.MeshLambertMaterial({color:hex, flatShading:true});

  // ground the words stand on
  // --- horizon: sky, clouds and a distant pasture ---
  function skyTexture(){
    const c=document.createElement("canvas"); c.width=1024; c.height=1024;
    const x=c.getContext("2d");
    // sky gradient
    const g2=x.createLinearGradient(0,0,0,640);
    g2.addColorStop(0,"#7db7e8");
    g2.addColorStop(0.55,"#b9dcf2");
    g2.addColorStop(1,"#e4f1f8");
    x.fillStyle=g2; x.fillRect(0,0,1024,660);
    // soft clouds: overlapping blobs, wrapped so the edges match
    const cloud=(cx,cy,sc,al)=>{
      for(let dx of [-1024,0,1024]){
        x.save(); x.globalAlpha=al; x.fillStyle="#ffffff";
        x.translate(cx+dx,cy); x.scale(sc,sc*0.55);
        for(const [ox,oy,r] of [[-60,0,46],[-18,-16,54],[28,-6,48],[68,6,38],[14,14,44]]){
          x.beginPath(); x.arc(ox,oy,r,0,7); x.fill();
        }
        x.restore();
      }
    };
    // large, prominent clouds gathered just above the horizon
    for(let i=0;i<7;i++){
      cloud(Math.random()*1024, 340+Math.random()*210,
            1.5+Math.random()*1.5, 0.78+Math.random()*0.22);
    }
    // a few smaller ones higher up for depth
    for(let i=0;i<5;i++){
      cloud(Math.random()*1024, 140+Math.random()*180,
            0.8+Math.random()*0.8, 0.45+Math.random()*0.35);
    }
    // the pasture below the horizon
    const g3=x.createLinearGradient(0,648,0,1024);
    g3.addColorStop(0,"#9ec46f");
    g3.addColorStop(0.4,"#86b45e");
    g3.addColorStop(1,"#6d9c4c");
    x.fillStyle=g3; x.fillRect(0,648,1024,376);
    // a few field bands for depth
    for(let i=0;i<16;i++){
      x.globalAlpha=0.05+Math.random()*0.07;
      x.fillStyle=Math.random()>0.5?"#ffffff":"#4e7a35";
      const y=660+Math.random()*350;
      x.fillRect(0,y,1024,2+Math.random()*10);
    }
    x.globalAlpha=1;
    const t=new THREE.CanvasTexture(c);
    t.wrapS=THREE.RepeatWrapping; t.repeat.set(2.2,1);
    if(THREE.SRGBColorSpace) t.colorSpace=THREE.SRGBColorSpace;
    return t;
  }
  // A tall cylinder for the horizon band, PLUS a ground plane far below, so
  // there is no open rim to see past when the camera tilts during the launch.
  const skyTex=skyTexture();
  // The cylinder is tall so no rim is ever visible, but the texture is mapped
  // to a band around EYE LEVEL — stretching it over the full height pushed the
  // horizon and clouds far above where the camera looks.
  // Solved so the texture's horizon line (row 660 of 1024) lands at world
  // y = 6, i.e. eye level, with the clouds sitting just above at y ~= 26.
  skyTex.repeat.set(2.2, 420/88);
  skyTex.offset.y = -1.8718;
  const sky=new THREE.Mesh(
    new THREE.CylinderGeometry(150,150,420,48,1,true),
    new THREE.MeshBasicMaterial({map:skyTex, side:THREE.BackSide, fog:false}));
  sky.position.y=20;
  world.add(sky);
  // caps the view downward with pasture green
  const grass=new THREE.Mesh(
    new THREE.CircleGeometry(150,48),
    new THREE.MeshBasicMaterial({color:0x7fae57, fog:false}));
  grass.rotation.x=-Math.PI/2;
  grass.position.y=-188;
  world.add(grass);
  // and upward with sky, in case the launch carries the camera very high
  const lid=new THREE.Mesh(
    new THREE.CircleGeometry(150,48),
    new THREE.MeshBasicMaterial({color:0x7db7e8, fog:false}));
  lid.rotation.x=Math.PI/2;
  lid.position.y=228;
  world.add(lid);

  scene.add(new THREE.AmbientLight(0xffffff,0.80));
  const key=new THREE.DirectionalLight(0xfff6e8,0.58);
  key.position.set(4,9,6); scene.add(key);
  const fill=new THREE.DirectionalLight(0xcfe0ff,0.22);
  fill.position.set(-5,4,-4); scene.add(fill);

  // the two balls (same look as scene 3)
  const R=0.62;
  function ballTex(hex,bow){
    const c=document.createElement("canvas"); c.width=c.height=512;
    const x=c.getContext("2d");
    x.fillStyle=hex; x.fillRect(0,0,512,512);
    x.fillStyle="#17120c";
    x.beginPath(); x.arc(226,210,22,0,7); x.fill();
    x.beginPath(); x.arc(286,210,22,0,7); x.fill();
    x.lineWidth=18; x.strokeStyle="#17120c"; x.lineCap="round";
    x.beginPath(); x.arc(256,236,74,0.22*Math.PI,0.78*Math.PI); x.stroke();
    if(bow){
      const RR=150, bs=RR*0.34;
      x.fillStyle="#e8703f"; x.strokeStyle="rgba(26,12,4,.75)"; x.lineWidth=8;
      const lobe=(dx,rot)=>{ x.beginPath();
        x.ellipse(256+dx,96,bs*0.78,bs*0.50,rot,0,7); x.fill(); x.stroke(); };
      lobe(-bs*1.15,-0.5); lobe(bs*1.15,0.5);
      x.beginPath(); x.arc(256,92,bs*0.34,0,7); x.fill(); x.stroke();
    }
    const t=new THREE.CanvasTexture(c);
    if(THREE.SRGBColorSpace) t.colorSpace=THREE.SRGBColorSpace;
    t.anisotropy=8; return t;
  }
  const mkBall=(hex,bow)=>new THREE.Mesh(
    new THREE.SphereGeometry(R,18,14),
    new THREE.MeshLambertMaterial({map:ballTex(hex,bow), flatShading:true}));
  const ballA=mkBall("#7fc9a3",false), ballB=mkBall("#ffb563",true);
  world.add(ballA,ballB);

  HOP.scene=scene; HOP.cam=cam; HOP.world=world;
  HOP.ballA=ballA; HOP.ballB=ballB; HOP.R=R;
  HOP.flat=flat;
  HOP.ready=true;
  window.HOP=HOP;                    // exposed to verify the bounce timing
})();

/* Scene 4 geometry: the words are solid blocks forming a real staircase,
   seen from the front. Each step is a cuboid with the word on its face; the
   balls bounce down them and nothing breaks. */
function hopWords(){
  if(!HOP.ready || !BLOCK.ready) return null;
  if(HOP.words) return HOP.words;
  const list=W.filter(q=>q.l===5);
  const font=BLOCK.font, SIZE=100;

  const STEP_X=2.45, STEP_Y=0.95, DEPTH=3.0;
  HOP.words=list.map((wd,i)=>{
    const g=new THREE.Group();
    const topY = 7.2 - i*STEP_Y;              // the surface the ball lands on
    const cx   = -10.6 + i*STEP_X;

    // --- the pillar IS the stacked word: solid letters, open counters ---
    // Each glyph is its own mesh: the outer contour is solid, the inner
    // contours (the hole in an O, e, a, d) become real openings you can see
    // the landscape through. No slab, so nothing to z-fight.
    const capH=(SIZE)*0.74;
    const k=(STEP_X*0.88)/capH;

    const glyph={};
    for(const ch of wd.w){
      if(ch===" "||glyph[ch]) continue;
      const p=font.getPath(ch,0,0,SIZE);
      const contours=[]; let cur=null, lx=0, ly=0;
      const push=(x,y)=>{ if(cur) cur.push([x,-y]); };
      for(const c of p.commands){
        if(c.type==="M"){ if(cur&&cur.length>2) contours.push(cur); cur=[]; push(c.x,c.y); lx=c.x; ly=c.y; }
        else if(c.type==="L"){ push(c.x,c.y); lx=c.x; ly=c.y; }
        else if(c.type==="Q"){ for(let q=1;q<=6;q++){ const u=q/6,v=1-u;
          push(v*v*lx+2*v*u*c.x1+u*u*c.x, v*v*ly+2*v*u*c.y1+u*u*c.y);} lx=c.x; ly=c.y; }
        else if(c.type==="C"){ for(let q=1;q<=8;q++){ const u=q/8,v=1-u;
          push(v*v*v*lx+3*v*v*u*c.x1+3*v*u*u*c.x2+u*u*u*c.x,
               v*v*v*ly+3*v*v*u*c.y1+3*v*u*u*c.y2+u*u*u*c.y);} lx=c.x; ly=c.y; }
        else if(c.type==="Z"){ if(cur&&cur.length>2) contours.push(cur); cur=null; }
      }
      if(cur&&cur.length>2) contours.push(cur);
      if(!contours.length) continue;

      // quarter turn so the word reads downward: (x,y) -> (y,-x)
      const rot=contours.map(c2=>c2.map(([x,y])=>[ y*k, -x*k ]));
      let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
      for(const c2 of rot) for(const [x,y] of c2){
        if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
      const cxOff=(minX+maxX)/2;
      const norm=rot.map(c2=>c2.map(([x,y])=>[x-cxOff, y-maxY]));

      // largest contour is the letterform; the rest are its counters
      const area=c2=>{ let s2=0; for(let q=0;q<c2.length;q++){
        const n2=c2[(q+1)%c2.length]; s2+=(c2[q][0]*n2[1]-n2[0]*c2[q][1]); }
        return Math.abs(s2/2); };
      norm.sort((m,n)=>area(n)-area(m));

      const shape=new THREE.Shape();
      norm[0].forEach(([x,y],idx)=> idx===0?shape.moveTo(x,y):shape.lineTo(x,y));
      shape.closePath();
      for(let q=1;q<norm.length;q++){
        const hp=new THREE.Path();
        norm[q].forEach(([x,y],idx)=> idx===0?hp.moveTo(x,y):hp.lineTo(x,y));
        hp.closePath();
        shape.holes.push(hp);              // the counter: open to the landscape
      }
      const geo=new THREE.ExtrudeGeometry([shape],
        {depth:DEPTH, bevelEnabled:false, curveSegments:4});
      geo.translate(0,0,-DEPTH/2);
      glyph[ch]={geo, adv: font.getAdvanceWidth(ch,SIZE)*k};
    }

    const letters=[...wd.w].filter(ch=>ch!==" ");
    const TIGHT=0.86;
    let wordSpan=0;
    for(const ch of letters){ const e=glyph[ch]; if(e) wordSpan+=e.adv*TIGHT; }

    // top copy warm (the surface the ball lands on), the rest white, repeating
    // far enough down to leave frame
    // A deeper burnt orange: a slight darkening would pass through the
    // pasture's own luminance (1.06:1, nearly invisible); this sits well
    // below it at ~1.7:1 so the top word reads against the green.
    const topMat  = HOP.flat(0xb85f1e);
    const deepMat = HOP.flat(0xf6f1e6);
    const sideMat = HOP.flat(0xd8cdb8);
    const PILLAR_H=92;
    let rep=0, cursorY=topY;
    while(topY-cursorY < PILLAR_H){
      for(const ch of letters){
        const e=glyph[ch];
        if(!e) continue;
        const m=new THREE.Mesh(e.geo, rep===0 ? [topMat,sideMat] : [deepMat,sideMat]);
        m.position.set(cx, cursorY, 0);
        g.add(m);
        cursorY -= e.adv*TIGHT;
      }
      rep++;
    }

    HOP.world.add(g);
    return {g, word:wd, idx:i, topY, cx};
  });
  return HOP.words;
}

/* Solve each ball's trajectory from the word timings.
   Launch and landing are at DIFFERENT heights now (it is a staircase), so
   the vertical solve uses:  dy = v0*T - g*T^2/2  =>  v0 = (dy + g*T^2/2)/T */
function hopPlan(){
  if(HOP.plan) return HOP.plan;
  const words=hopWords();
  if(!words) return null;
  const G=26.0;
  const build=(seq)=>{
    const arcs=[];
    for(let i=0;i<seq.length-1;i++){
      const A=seq[i], B=seq[i+1];
      const T=B.word.s-A.word.s;
      const dy=B.topY-A.topY;
      arcs.push({
        t0:A.word.s, t1:B.word.s, T,
        x0:A.cx, x1:B.cx,
        y0:A.topY, y1:B.topY,
        v0:(dy + 0.5*G*T*T)/T        // exact: lands on B.topY at t1
      });
    }
    return arcs;
  };
  const A=words.filter((_,i)=>i%2===0);
  const B=words.filter((_,i)=>i%2===1);
  HOP.plan={G, A:build(A), B:build(B), first:{A:A[0],B:B[0]}, seqA:A, seqB:B};
  return HOP.plan;
}

function renderHop(tt, rnd){
  if(!HOP.ready) return;
  const plan=hopPlan();
  if(!plan) return;
  const cam=HOP.cam;

  const cv=rnd.domElement;
  if(cv.width!==cv.clientWidth || cv.height!==cv.clientHeight){
    rnd.setPixelRatio(Math.min(devicePixelRatio||1,2));
    rnd.setSize(cv.clientWidth, cv.clientHeight, false);
    cam.aspect=cv.clientWidth/Math.max(1,cv.clientHeight);
    cam.updateProjectionMatrix();
  }

  const G=plan.G, R=HOP.R;
  function place(ball, arcs, firstStep){
    if(!arcs.length) return;
    const t0=arcs[0].t0;
    if(tt<t0){
      // free-fall from rest so it lands on the first step exactly at t0
      const rem=Math.max(0, t0-tt);
      ball.position.set(firstStep.cx, firstStep.topY + R + 0.5*G*rem*rem, 0);
      ball.visible = rem < 0.9;
      ball.rotation.set(0, 0, 0);
      return;
    }
    ball.visible=true;
    let a=null;
    for(const arc of arcs){ if(tt>=arc.t0 && tt<arc.t1){ a=arc; break; } }
    if(!a){
      // --- the launch on "go!" ---
      // Instead of trickling off the last step, they are flung into the air
      // on two separate arcs, echoing the ski-jump exit of the 2D scene.
      const last=arcs[arcs.length-1];
      const u=tt-last.t1;
      const LAUNCH_V = ball===HOP.ballA ? 15.5 : 13.4;   // different heights
      const LAUNCH_X = ball===HOP.ballA ?  5.2 :  8.6;   // different distances
      const LAUNCH_Z = ball===HOP.ballA ? -1.1 :  1.6;   // splay apart in depth
      ball.position.set(
        last.x1 + LAUNCH_X*u,
        last.y1 + R + LAUNCH_V*u - 0.5*G*u*u,
        LAUNCH_Z*u
      );
      // tumble as they fly
      // tumbling away after the launch, still dominated by the travel spin
      const spun=-(last.x1 - arcs[0].x0)/R;
      ball.rotation.set((ball===HOP.ballA ? 1 : -1)*u*2.2,
                        0,
                        spun - u*7.5);
      return;
    }
    const u=tt-a.t0, f=clamp(u/a.T,0,1);
    const px=lerp(a.x0,a.x1,f);
    ball.position.set(px, a.y0 + R + a.v0*u - 0.5*G*u*u, 0);
    // Absolute roll from total distance travelled: rolling right (+x) spins
    // about -z at angle = distance / radius. Setting it (not accumulating)
    // keeps x and y at zero, so no stale axis survives from the fall-in.
    ball.rotation.set(0, 0, -(px - arcs[0].x0)/R);
  }
  place(HOP.ballA, plan.A, plan.first.A);
  place(HOP.ballB, plan.B, plan.first.B);

  // --- fade IN from ink at the start, so the cut from scene 3 is seamless ---
  // (the fade-out to scene 5 is handled just below)
  // --- fade the whole 3D world down to scene 5's ink background ---
  // Scene 5 opens on near-black, so the pasture must darken to that same value
  // before the cut, or the transition is a hard flash.
  {
    // 0 at the scene's start (opening from ink), 0 mid-scene, 1 at the end
    const fadeIn = 1-inv(tt, 11.60, 12.30);
    const fade   = Math.max(fadeIn, inv(tt, 14.60, 15.45));
    if(fade>0){
      const k2=easeIO(fade);
      HOP.scene.traverse(o=>{
        if(!o.isMesh || !o.material) return;
        const mats=Array.isArray(o.material)?o.material:[o.material];
        for(const mm of mats){
          if(!mm.color) continue;
          if(mm.userData.__base===undefined) mm.userData.__base=mm.color.clone();
          mm.color.copy(mm.userData.__base).lerp(new THREE.Color(0x07080c), k2);
        }
      });
      if(HOP.scene.fog) HOP.scene.fog.color.setHex(0x07080c);
    } else {
      // restore when scrubbing back, so a loop does not stay dark
      HOP.scene.traverse(o=>{
        if(!o.isMesh || !o.material) return;
        const mats=Array.isArray(o.material)?o.material:[o.material];
        for(const mm of mats){
          if(mm.color && mm.userData.__base) mm.color.copy(mm.userData.__base);
        }
      });
      if(HOP.scene.fog) HOP.scene.fog.color.setHex(0xcfe4f2);
    }
  }

  // --- camera: front-on, tracking the descent ---
  const midY=(HOP.ballA.position.y+HOP.ballB.position.y)/2;
  const midX=(HOP.ballA.position.x+HOP.ballB.position.x)/2;
  // pull back and tilt up through the launch so the arc stays in frame
  const fly=inv(tt,14.10,15.10);
  const back=lerp(19.5, 30.0, easeOut(fly));
  cam.position.set(midX*0.55, midY+1.2+fly*2.4, back);
  cam.lookAt(midX*0.55, midY-0.6+fly*2.0, 0);

  rnd.render(HOP.scene, cam);
}

/* ---------- typographic helpers for scene 6 ---------- */
/* Real glyph outlines from opentype.js, measured and placed freely, so a
   letter can be rotated, stacked or stretched to fit an exact box. */

/* draw one glyph as a filled path, with arbitrary transform */
function glyphFill(ch, font, px, x, y, o={}){
  if(!font) return 0;
  const p=font.getPath(ch, 0, 0, px);
  const d=p.toPathData(2);
  ctx.save();
  ctx.translate(x,y);
  if(o.rot) ctx.rotate(o.rot);
  if(o.sx||o.sy) ctx.scale(o.sx||1, o.sy||1);
  ctx.globalAlpha=o.alpha??1;
  ctx.fillStyle=o.color||P.paper;
  if(o.glow){ shadow(o.glow, o.glowSize||18); }
  ctx.fill(new Path2D(d));
  noShadow();
  ctx.restore();
  return font.getAdvanceWidth(ch, px);
}

/* the ink bounds of a string at a given size (not the advance box) */
function inkBounds(txt, font, px){
  const p=font.getPath(txt,0,0,px);
  const b=p.getBoundingBox();
  return {x1:b.x1,y1:b.y1,x2:b.x2,y2:b.y2,
          w:b.x2-b.x1, h:b.y2-b.y1,
          adv:font.getAdvanceWidth(txt,px)};
}

/* solve the size that makes a string span exactly `targetW` of ink */
function sizeForWidth(txt, font, targetW){
  const probe=100;
  const b=inkBounds(txt,font,probe);
  return b.w>0 ? probe*targetW/b.w : probe;
}

/* draw a string edge-to-edge across a given span, returning its ink box */
function fitLine(txt, font, x0, x1, baselineY, o={}){
  const px=sizeForWidth(txt,font,x1-x0);
  const b=inkBounds(txt,font,px);
  ctx.save();
  ctx.globalAlpha=o.alpha??1;
  ctx.fillStyle=o.color||P.paper;
  if(o.glow){ shadow(o.glow,o.glowSize||16); }
  const p=font.getPath(txt, x0-b.x1, baselineY, px);
  ctx.fill(new Path2D(p.toPathData(2)));
  noShadow();
  ctx.restore();
  return {px, box:b};
}

/* Stretch a string to EXACTLY fill a box, distorting the glyphs.
   Scales x and y independently, so the ink spans the box edge to edge with
   no letterboxing. */
function stretchInto(txt, font, x0, y0, x1, y1, o={}){
  if(!font) return;
  const probe=100;
  const p0=font.getPath(txt,0,0,probe);
  const b=p0.getBoundingBox();
  const bw=b.x2-b.x1, bh=b.y2-b.y1;
  if(bw<=0||bh<=0) return;
  const sx=(x1-x0)/bw, sy=(y1-y0)/bh;
  ctx.save();
  ctx.globalAlpha=o.alpha??1;
  ctx.fillStyle=o.color||P.paper;
  if(o.glow) shadow(o.glow,o.glowSize||16);
  ctx.translate(x0,y0);
  ctx.scale(sx,sy);
  ctx.translate(-b.x1,-b.y1);
  ctx.fill(new Path2D(p0.toPathData(2)));
  noShadow();
  ctx.restore();
}

/* Same, but per-character so each glyph can carry its own colour while the
   whole run still fills the box exactly. */
function stretchRun(parts, font, x0, y0, x1, y1, o={}){
  if(!font) return;
  const txt=parts.map(p=>p.text).join("");
  const probe=100;
  const whole=font.getPath(txt,0,0,probe);
  const b=whole.getBoundingBox();
  const bw=b.x2-b.x1, bh=b.y2-b.y1;
  if(bw<=0||bh<=0) return;
  const sx=(x1-x0)/bw, sy=(y1-y0)/bh;
  ctx.save();
  ctx.translate(x0,y0);
  ctx.scale(sx,sy);
  ctx.translate(-b.x1,-b.y1);
  let cursor=0;
  for(const part of parts){
    if(part.alpha>0){
      ctx.save();
      ctx.globalAlpha=part.alpha;
      ctx.fillStyle=part.color||P.paper;
      const pp=font.getPath(part.text,cursor,0,probe);
      ctx.fill(new Path2D(pp.toPathData(2)));
      ctx.restore();
    }
    cursor+=font.getAdvanceWidth(part.text,probe);
  }
  ctx.restore();
}

/* Where does a given character sit inside a stretched run?
   Returns the on-screen box of that glyph after the same non-uniform scale
   that stretchInto applies, so overlays can be placed exactly on it. */
function stretchedCharBox(txt, idx, font, x0, y0, x1, y1){
  if(!font) return null;
  const probe=100;
  const whole=font.getPath(txt,0,0,probe);
  const b=whole.getBoundingBox();
  const bw=b.x2-b.x1, bh=b.y2-b.y1;
  if(bw<=0||bh<=0) return null;
  const sx=(x1-x0)/bw, sy=(y1-y0)/bh;
  // advance to the glyph, then measure its own ink
  let cursor=0;
  for(let i=0;i<idx;i++) cursor+=font.getAdvanceWidth(txt[i],probe);
  const gp=font.getPath(txt[idx],cursor,0,probe);
  const gb=gp.getBoundingBox();
  return {
    x0: x0+(gb.x1-b.x1)*sx,
    x1: x0+(gb.x2-b.x1)*sx,
    y0: y0+(gb.y1-b.y1)*sy,
    y1: y0+(gb.y2-b.y1)*sy,
    get cx(){ return (this.x0+this.x1)/2; },
    get cy(){ return (this.y0+this.y1)/2; },
    get w(){ return this.x1-this.x0; },
    get h(){ return this.y1-this.y0; }
  };
}

/* Eyes and mouth only, drawn to sit inside a letterform's counter.
   gaze: -1 looking up, +1 looking down. */
function faceInCounter(box, o={}){
  const R=Math.min(box.w,box.h)*0.5;
  const cx=box.cx, cy=box.cy;
  const gaze=clamp(o.gaze??0,-1,1);
  ctx.save();
  ctx.globalAlpha=o.alpha??1;
  ctx.fillStyle=o.color||P.ink;
  // eyes: pupils ride the gaze
  // asymmetric travel: looking UP needed more lift to read, looking DOWN
  // already landed, so only the upward end is pushed further
  const lift = gaze<0 ? gaze*R*0.42 : gaze*R*0.22;
  const ex=R*0.34, ey=-R*0.12 + lift;
  const er=Math.max(1.2, R*0.14);
  ctx.beginPath(); ctx.arc(cx-ex, cy+ey, er, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+ex, cy+ey, er, 0, 7); ctx.fill();
  // mouth: a soft arc that follows the mood of the gaze
  ctx.beginPath();
  ctx.lineWidth=Math.max(1.4, R*0.10);
  ctx.strokeStyle=o.color||P.ink;
  ctx.lineCap="round";
  const my=cy+R*0.34+gaze*R*0.10;
  const smile = gaze<0 ? 1 : 0.55;           // brighter when looking up
  ctx.arc(cx, my-R*0.12, R*0.34, (0.5-0.22*smile)*Math.PI, (0.5+0.22*smile)*Math.PI);
  ctx.stroke();
  ctx.restore();
}

/* ---------- sweat drips, drawn INSIDE a clipped shape ---------- */
/* A deterministic set of drops per band, so the pattern is stable across
   frames and scrubs. `prog` 0..1 drives how far each drop has run. */
const DRIP_SEED=[];
(function(){
  let x=12345;
  for(let i=0;i<260;i++){
    x=(x*1103515245+12345)&0x7fffffff;
    DRIP_SEED.push((x>>8)/0x7fffff);
  }
})();

/* Draw drips within the current clip region.
   x0..x1, y0..y1 is the band; prog is how far the sweat has travelled. */
function sweatDrips(x0,y0,x1,y1,prog,o={}){
  if(prog<=0) return;
  const bw=x1-x0, bh=y1-y0;
  const N=o.n??14;
  const base=o.seedOffset??0;
  ctx.save();
  ctx.globalAlpha=(o.alpha??1)*0.55;
  ctx.fillStyle=o.color||"rgba(150,200,235,.85)";
  for(let i=0;i<N;i++){
    const s1=DRIP_SEED[(base+i*3)%DRIP_SEED.length];
    const s2=DRIP_SEED[(base+i*3+1)%DRIP_SEED.length];
    const s3=DRIP_SEED[(base+i*3+2)%DRIP_SEED.length];
    const px=x0+s1*bw;
    const delay=s2*0.45;                       // staggered starts
    const p=clamp((prog-delay)/(1-delay),0,1);
    if(p<=0) continue;
    const runY=y0 + p*(bh*(0.55+s3*0.75));
    const wdt=bw*0.004*(0.6+s3*1.1);
    // the trail
    ctx.globalAlpha=(o.alpha??1)*0.30;
    ctx.fillRect(px-wdt/2, y0, wdt, runY-y0);
    // the bead at its head
    ctx.globalAlpha=(o.alpha??1)*0.75;
    const r=wdt*(1.6+s2*1.4);
    ctx.beginPath();
    ctx.ellipse(px, runY, r, r*1.45, 0, 0, 7);
    ctx.fill();
  }
  ctx.restore();
}

/* Fill a stretched word, then run drips inside its letterforms only. */
function drippingWord(txt, font, x0, y0, x1, y1, o={}){
  if(!font) return;
  const probe=100;
  const p0=font.getPath(txt,0,0,probe);
  const b=p0.getBoundingBox();
  const bw=b.x2-b.x1, bh=b.y2-b.y1;
  if(bw<=0||bh<=0) return;
  const sx=(x1-x0)/bw, sy=(y1-y0)/bh;

  ctx.save();
  ctx.globalAlpha=o.alpha??1;
  // build the glyph path in screen space so it can serve as a clip
  ctx.translate(x0,y0); ctx.scale(sx,sy); ctx.translate(-b.x1,-b.y1);
  const path=new Path2D(p0.toPathData(2));
  ctx.fillStyle=o.color||P.paper;
  ctx.fill(path);
  ctx.restore();

  // drips, clipped to the letterforms
  if((o.drip??0)>0){
    ctx.save();
    // clip in glyph space, then draw the drips in that same space so the
    // trails run vertically through the letters
    ctx.translate(x0,y0); ctx.scale(sx,sy); ctx.translate(-b.x1,-b.y1);
    ctx.clip(path);
    sweatDrips(b.x1, b.y1, b.x2, b.y2, o.drip,
      {alpha:o.alpha??1, seedOffset:o.seedOffset??0, n:o.dripN??16});
    ctx.restore();
  }
}

/* Draw a stretched word whose BOTTOM edge bows upward into a brow while the
   TOP stays perfectly flat. Rather than slicing the raster (which stair-steps),
   this rebuilds the glyph outline and moves each point by an amount that
   depends on how far down the letterform it sits — so the cap line is
   untouched and only the baseline arcs. */
/* Fit a word into an arbitrary band: `topAt(u)` and `botAt(u)` give the band's
   upper and lower edge at fraction u across its width, so a word can be bent
   into a roof, a wedge, or any other silhouette. The glyph is stretched to
   span x0..x1 and each point is mapped from its own place in the word's ink
   box into the band -- the top of the letterform follows the top edge, the
   bottom follows the bottom edge, and everything between is interpolated. */
function bandWord(txt, font, x0, x1, topAt, botAt, o={}){
  if(!font) return;
  const probe=100;
  const p0=font.getPath(txt,0,0,probe);
  const b=p0.getBoundingBox();
  const bw=b.x2-b.x1, bh=b.y2-b.y1;
  if(bw<=0||bh<=0) return;
  const map=(x,y)=>{
    const u=clamp((x-b.x1)/bw,0,1);
    const v=clamp((y-b.y1)/bh,0,1);        // 0 at the cap line, 1 at the baseline
    const X=x0+(x1-x0)*u;
    const T=topAt(u), B=botAt(u);
    return [X, T+(B-T)*v];
  };
  const path=new Path2D();
  let lx=0, ly=0;
  const seg=(n,fn)=>{ for(let i=1;i<=n;i++){ const [X,Y]=map(...fn(i/n)); path.lineTo(X,Y); } };
  for(const c of p0.commands){
    if(c.type==="M"){ const [X,Y]=map(c.x,c.y); path.moveTo(X,Y); lx=c.x; ly=c.y; }
    else if(c.type==="L"){ const [X,Y]=map(c.x,c.y); path.lineTo(X,Y); lx=c.x; ly=c.y; }
    else if(c.type==="Q"){
      const ax=lx, ay=ly;
      seg(10,(t2)=>{ const v2=1-t2;
        return [v2*v2*ax+2*v2*t2*c.x1+t2*t2*c.x, v2*v2*ay+2*v2*t2*c.y1+t2*t2*c.y]; });
      lx=c.x; ly=c.y;
    }
    else if(c.type==="C"){
      const ax=lx, ay=ly;
      seg(12,(t2)=>{ const v2=1-t2;
        return [v2*v2*v2*ax+3*v2*v2*t2*c.x1+3*v2*t2*t2*c.x2+t2*t2*t2*c.x,
                v2*v2*v2*ay+3*v2*v2*t2*c.y1+3*v2*t2*t2*c.y2+t2*t2*t2*c.y]; });
      lx=c.x; ly=c.y;
    }
    else if(c.type==="Z"){ path.closePath(); }
  }
  ctx.save();
  ctx.globalAlpha=o.alpha??1;
  ctx.fillStyle=o.color||P.paper;
  if(o.glow) shadow(o.color||P.warm, o.glow);
  ctx.fill(path);
  noShadow();
  ctx.restore();
  return path;
}

function browWord(txt, font, x0, y0, x1, y1, bow, o={}){
  if(!font) return;
  const probe=100;
  const p0=font.getPath(txt,0,0,probe);
  const b=p0.getBoundingBox();
  const bw=b.x2-b.x1, bh=b.y2-b.y1;
  if(bw<=0||bh<=0) return;

  const path=new Path2D();
  // how much a point lifts: full at the baseline, none at the cap line,
  // and shaped across the width as a cosine arch
  const lift=(x,y)=>{
    const u=(x-b.x1)/bw;                       // 0..1 across the word
    const v=(y-b.y1)/bh;                       // 0 at top, 1 at bottom
    return -Math.sin(u*Math.PI)*bow*bh*v;      // vertical only
  };
  const warp=(x,y)=>[x, y+lift(x,y)];

  let lx=0, ly=0, sx0=0, sy0=0;
  for(const c of p0.commands){
    if(c.type==="M"){ const [X,Y]=warp(c.x,c.y); path.moveTo(X,Y); lx=c.x; ly=c.y; sx0=c.x; sy0=c.y; }
    else if(c.type==="L"){ const [X,Y]=warp(c.x,c.y); path.lineTo(X,Y); lx=c.x; ly=c.y; }
    else if(c.type==="Q"){
      // subdivide so the warp follows the curve rather than just its ends
      for(let i=1;i<=8;i++){
        const t2=i/8, v2=1-t2;
        const qx=v2*v2*lx+2*v2*t2*c.x1+t2*t2*c.x;
        const qy=v2*v2*ly+2*v2*t2*c.y1+t2*t2*c.y;
        const [X,Y]=warp(qx,qy); path.lineTo(X,Y);
      }
      lx=c.x; ly=c.y;
    }
    else if(c.type==="C"){
      for(let i=1;i<=10;i++){
        const t2=i/10, v2=1-t2;
        const qx=v2*v2*v2*lx+3*v2*v2*t2*c.x1+3*v2*t2*t2*c.x2+t2*t2*t2*c.x;
        const qy=v2*v2*v2*ly+3*v2*v2*t2*c.y1+3*v2*t2*t2*c.y2+t2*t2*t2*c.y;
        const [X,Y]=warp(qx,qy); path.lineTo(X,Y);
      }
      lx=c.x; ly=c.y;
    }
    else if(c.type==="Z"){ path.closePath(); lx=sx0; ly=sy0; }
  }

  const sx=(x1-x0)/bw, sy=(y1-y0)/bh;
  ctx.save();
  ctx.globalAlpha=o.alpha??1;
  ctx.translate(x0,y0); ctx.scale(sx,sy); ctx.translate(-b.x1,-b.y1);
  ctx.fillStyle=o.color||P.paper;
  ctx.fill(path);
  ctx.restore();
}

/* The forehead the brow sits on: a large head shape rising from below. */
function foreheadShape(cx, topY, rx, ry, o={}){
  ctx.save();
  ctx.globalAlpha=o.alpha??1;
  ctx.fillStyle=o.color||"#e8b98a";
  ctx.beginPath();
  ctx.ellipse(cx, topY+ry, rx, ry, 0, 0, 7);
  ctx.fill();
  ctx.restore();
}

/* A face larger than the frame. Simple vocabulary — dot eyes, one stroked
   mouth — but the feature spacing is set for a HEAD, not copied from the
   25px characters, where the same ratios collapse into one shape. */
function bigFace(cx, topY, rx, ry, o={}){
  const a=o.alpha??1;
  ctx.save();
  ctx.globalAlpha=a;

  // the head
  ctx.fillStyle=o.skin||P.warm;
  ctx.beginPath();
  ctx.ellipse(cx, topY+ry, rx, ry, 0, 0, 7);
  ctx.fill();

  const ink=o.ink||P.ink;
  const cy=topY+ry;

  // eyes: set well down the head, and far enough apart to read as a face
  const eyeY=topY+ry*0.52;
  const eyeDX=rx*0.30;
  const er=Math.max(3, rx*0.038);
  ctx.fillStyle=ink;
  ctx.beginPath(); ctx.arc(cx-eyeDX, eyeY, er, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+eyeDX, eyeY, er, 0, 7); ctx.fill();

  // mouth: a SMIRK — mostly flat, with one corner lifted.
  // Scene 10 magnifies this line until it fills the frame and pans along it,
  // so its VERTICAL extent has to be governed by the frame's height, not by
  // rx. rx tracks width alone, so on a wide screen the corner's rise and the
  // stroke both grew without any more headroom to grow into, and the band
  // left the top of the frame. `mq` is the mouth's quantum: the smaller of
  // the two dimensions, so the shape holds at any aspect ratio.
  const mouthY=topY+ry*0.78;
  const mw=rx*0.34;
  const mq=Math.min(rx, ry*0.85);
  ctx.strokeStyle=ink;
  ctx.lineWidth=Math.max(3, mq*0.022);
  ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(cx-mw, mouthY);
  // flat through most of its run, then a small rise at the right corner
  ctx.bezierCurveTo(cx-mw*0.2, mouthY+mq*0.012,
                    cx+mw*0.45, mouthY+mq*0.004,
                    cx+mw,      mouthY-mq*0.055);
  ctx.stroke();

  ctx.restore();
  return {cy, eyeY, mouthY, mw, mq};
}

/* A band of sweat across the forehead that FOLLOWS the skull's curve, drawn
   as the region between two concentric arcs of the head ellipse. `wipe` 0..1
   clears it from left to right, as if being wiped away. */
function sweatBand(cx, topY, rx, ry, o={}){
  const yc=topY+ry;
  // Sits just under the crown and spans the whole head. It is NOT inset by
  // the frame padding — the sweat belongs to the skull, not the layout box.
  const r0=0.93, r1=0.74;
  const x0=cx-rx*r0;
  const x1=cx+rx*r0;
  const wipe=clamp(o.wipe??0,0,1);

  ctx.save();
  ctx.globalAlpha=o.alpha??1;
  // The text sweeps right-to-left, so the sweat clears behind it: keep only
  // the part to the LEFT of the leading edge.
  if(wipe>0){
    const edge=x1-(x1-x0)*wipe;
    ctx.beginPath();
    ctx.rect(x0-(o.frameW||cx*2), 0, (edge-x0)+(o.frameW||cx*2), (o.frameH||yc*2));
    ctx.clip();
  }
  // the band: the area between two scaled copies of the head ellipse
  ctx.beginPath();
  ctx.ellipse(cx, yc, rx*r0, ry*r0, 0, Math.PI, 0);
  ctx.ellipse(cx, yc, rx*r1, ry*r1, 0, 0, Math.PI, true);
  ctx.closePath();
  const g=ctx.createLinearGradient(0, topY+ry*(1-r0), 0, topY+ry*(1-r1));
  g.addColorStop(0,   "rgba(255,255,255,0.00)");
  g.addColorStop(0.5, "rgba(214,238,250,0.60)");
  g.addColorStop(1,   "rgba(255,255,255,0.00)");
  ctx.fillStyle=g;
  ctx.fill();
  ctx.restore();

  // the band's mid-line, for laying type along
  const my=topY+ry*(1-(r0+r1)/2);
  return {x0,x1, y0:topY+ry*(1-r0), y1:topY+ry*(1-r1), my};
}

/* A rail of words travelling at constant speed, with each word POSITIONED so
   that its centre crosses a target x at its own timestamp. The spacing is
   solved from the timings rather than being even, so uneven lyrics still land
   on the beat. */
function syncedRail(words, font, px, speedPxPerSec, targetX, t, o={}){
  if(!font || !words.length) return;
  // x(t) of a word placed at rail-offset d:  targetX + d - speed*(t - t0ref)
  // we want x = targetX at t = word.s  =>  d = speed*(word.s - t0ref)
  const t0ref=o.ref??words[0].s;

  // Words sung close together collide at this speed. Shrinking the type to fit
  // the tightest pair makes everything unreadable, so instead NUDGE only the
  // offending pair apart along the rail: one word drifts slightly off its beat
  // rather than all four becoming illegible.
  const size=px;
  const gapWanted=(o.minGap??0.22)*size;
  const offs=words.map(wd=>speedPxPerSec*(wd.s-t0ref));
  for(let pass=0; pass<4; pass++){
    for(let i=0;i<words.length-1;i++){
      const halfA=font.getAdvanceWidth(words[i].text,size)/2;
      const halfB=font.getAdvanceWidth(words[i+1].text,size)/2;
      const need=halfA+halfB+gapWanted;
      const have=offs[i+1]-offs[i];
      if(have<need){
        const push=(need-have)/2;
        offs[i]   -= push;
        offs[i+1] += push;
      }
    }
  }

  ctx.save();
  ctx.globalAlpha=o.alpha??1;
  words.forEach((wd,idx)=>{
    const d=offs[idx];
    const wWidth=font.getAdvanceWidth(wd.text,size);
    const x=targetX + d - speedPxPerSec*(t-t0ref) - wWidth/2;
    if(x>(o.clipX1??1e9)+wWidth || x+wWidth<(o.clipX0??-1e9)-wWidth) return;
    const p=font.getPath(wd.text, x, o.baselineY, size);
    const path=new Path2D(p.toPathData(2));
    if(o.towel){
      towelText(path, x, o.baselineY, wWidth, size, o);
    } else {
      ctx.fillStyle=o.color||P.paper;
      ctx.fill(path);
    }
  });
  ctx.restore();
  return size;
}

/* Fill a glyph path so it reads like terry towelling: a soft base colour,
   a fuzzy halo of short fibres around the edge, and a little loop texture
   across the face. */
function towelText(path, x, baselineY, wWidth, size, o={}){
  const col=o.color||"#eaf4fb";
  const edge=o.edgeColor||"#bcd9ea";

  // 1. the furry edge: many slightly offset copies, faint, building a halo
  ctx.save();
  ctx.globalAlpha=(o.alpha??1)*0.10;
  ctx.strokeStyle=edge;
  ctx.lineJoin="round"; ctx.lineCap="round";
  for(let i=0;i<7;i++){
    ctx.lineWidth=size*(0.035+i*0.018);
    ctx.stroke(path);
  }
  ctx.restore();

  // 2. the body of the cloth
  ctx.save();
  ctx.globalAlpha=o.alpha??1;
  ctx.fillStyle=col;
  ctx.fill(path);
  ctx.restore();

  // 3. loop texture inside the letterforms
  ctx.save();
  ctx.globalAlpha=(o.alpha??1)*0.30;
  ctx.clip(path);
  ctx.strokeStyle=edge;
  ctx.lineWidth=Math.max(1, size*0.018);
  ctx.lineCap="round";
  const step=size*0.085;
  let seed=Math.floor(x*0.37)|0;
  const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return (seed>>9)/0x3fffff; };
  for(let yy=baselineY-size*1.05; yy<baselineY+size*0.25; yy+=step){
    for(let xx=x-size*0.2; xx<x+wWidth+size*0.2; xx+=step){
      const r=step*(0.18+rnd()*0.16);
      ctx.beginPath();
      ctx.arc(xx+rnd()*step*0.5, yy+rnd()*step*0.5, r, 0.2, 2.6);
      ctx.stroke();
    }
  }
  ctx.restore();
}

/* Text set along an arbitrary curve. The path is sampled into a polyline so
   each glyph can be placed at the right arc-length and rotated to the local
   tangent — the same technique signwriters use for curved lettering. */
function makePathSampler(fn, n){
  const pts=[];
  let len=0;
  let prev=fn(0);
  pts.push({x:prev.x, y:prev.y, s:0});
  for(let i=1;i<=n;i++){
    const p=fn(i/n);
    len+=Math.hypot(p.x-prev.x, p.y-prev.y);
    pts.push({x:p.x, y:p.y, s:len});
    prev=p;
  }
  return {
    length: len,
    at(s){
      const t2=clamp(s,0,len);
      let lo=0, hi=pts.length-1;
      while(lo<hi-1){ const mid=(lo+hi)>>1; if(pts[mid].s<=t2) lo=mid; else hi=mid; }
      const a=pts[lo], b=pts[Math.min(lo+1,pts.length-1)];
      const f=(b.s-a.s)>0 ? (t2-a.s)/(b.s-a.s) : 0;
      return { x:lerp(a.x,b.x,f), y:lerp(a.y,b.y,f),
               ang:Math.atan2(b.y-a.y, b.x-a.x) };
    }
  };
}

/* Draw a string along a sampler, starting at arc-length s0. */
function textOnPath(txt, font, px, sampler, s0, o={}){
  if(!font) return s0;
  let s=s0;
  ctx.save();
  ctx.globalAlpha=o.alpha??1;
  ctx.fillStyle=o.color||P.ink;
  // `stretch` widens each glyph along the path without making it taller, so a
  // line of type can be made to span a path longer than it naturally runs.
  const st=o.stretch??1;
  for(const ch of txt){
    const adv=font.getAdvanceWidth(ch,px)*st;
    const q=sampler.at(s+adv/2);
    ctx.save();
    ctx.translate(q.x, q.y);
    ctx.rotate(q.ang);
    if(st!==1) ctx.scale(st,1);
    const p=font.getPath(ch, -adv/(2*st), (o.offsetY??0), px);
    ctx.fill(new Path2D(p.toPathData(2)));
    ctx.restore();
    s+=adv*(o.tracking??1);
  }
  ctx.restore();
  return s;
}

/* A word set INSIDE an arrow badge: a rounded block with a point on one end,
   the way the BACK / TOP / END emoji are drawn, but built from the same font
   and palette as the rest of the piece so it reads as type rather than as a
   pasted-in system glyph (which would also render differently per platform).
   `dir` is "left", "up" or "right". Returns the badge's box. */
/* ---------- burning type ----------
   The classic heat-buffer fire: a low-resolution grid where each cell takes
   the average of the three cells below it plus the one two below, divided by
   slightly more than four so heat is lost as it rises. The standard version
   seeds the bottom row with noise; here the TEXT is the fuel -- the glyphs
   are rasterised into the buffer and reseeded every frame, so flames climb
   off the letterforms themselves.

   It runs at ~240x135 and is scaled up with smoothing off. At full canvas
   resolution this is ~8M operations a frame and will not hold 60fps.
   Reference: the heat-propagation method described at slicker.me. */
const FIRE={ w:240, h:135, buf:null, cvs:null, img:null, fuel:null, seed:12345 };
function fireInit(){
  if(FIRE.buf) return;
  FIRE.buf=new Float32Array(FIRE.w*FIRE.h);
  FIRE.fuel=new Float32Array(FIRE.w*FIRE.h);
  FIRE.cvs=document.createElement("canvas");
  FIRE.cvs.width=FIRE.w; FIRE.cvs.height=FIRE.h;
  FIRE.img=FIRE.cvs.getContext("2d").createImageData(FIRE.w,FIRE.h);
}
/* Rasterise a path into the fuel map: every cell the shape covers becomes a
   heat source, so flames rise from the glyphs rather than from the floor. */
function fireFuelFromPath(drawFn){
  fireInit();
  const c=FIRE.cvs, g=c.getContext("2d");
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,FIRE.w,FIRE.h);
  g.save();
  drawFn(g, FIRE.w, FIRE.h);
  g.restore();
  const d=g.getImageData(0,0,FIRE.w,FIRE.h).data;
  const W=FIRE.w, H=FIRE.h;
  // Only the TOP EDGE of the shape burns. Seeding every pixel of every glyph
  // set the whole letter alight at once and the flames merged into one solid
  // slab; lighting just the upper rim gives a separate tongue per stroke.
  for(let i=0,n=W*H;i<n;i++) FIRE.fuel[i]=0;
  // Every cell gets its OWN fuel load, from a fixed hash of its position:
  // a uniform rim burned as one even wall, where real fuel is patchy. The
  // value is stable per cell, so the pattern does not strobe between frames.
  const hash=(x,y)=>{
    let v=(x*73856093)^(y*19349663);
    v=(v^(v>>>13))*1274126177;
    return ((v^(v>>>16))>>>0)/4294967295;
  };
  // Fuel varies in PATCHES, not per cell. A per-cell hash averages out over
  // the rim and burns as one even line; banding it into runs several cells
  // wide gives whole stretches that are rich and whole stretches that are
  // nearly bare, which is what opens gaps between the tongues.
  // Two bands at different widths are combined so the pattern does not
  // repeat visibly.
  const band=(x,sc)=>hash(Math.floor(x/sc), 7);
  for(let x=0;x<W;x++){
    const p1=band(x,7), p2=band(x,3);
    // most of the rim is lean; the rich patches are the minority
    // Lean stretches stay LIT, just low. Driving them to a quarter of an
    // already-small value put whole sections of the rim out altogether, so
    // the fire went patchy-dark rather than patchy-tall. A floor keeps every
    // part of the letter burning; the variation is in how high it reaches.
    let load=Math.pow(p1*0.70+p2*0.30, 1.5);
    load=0.34+0.66*load;
    // Only the FIRST entry into the glyph counts as the rim. The scan used to
    // reset on every gap, so a column passing through a counter -- the hole in
    // R, O, A, E -- treated the solid below it as a fresh top edge and lit a
    // flame inside the letter. That was the stray tongue under the R.
    let run=0, seen=false;
    for(let y=0;y<H;y++){
      const a=d[(y*W+x)*4+3]/255;
      if(a>0.5){
        run++;
        const nz=load*(0.70+0.60*hash(x,y));
        if(run<=2 && !seen) FIRE.fuel[y*W+x]=nz;  // the rim, unevenly fuelled
        else FIRE.fuel[y*W+x]=0.10*nz;            // the body smoulders faintly
        if(run>2) seen=true;
      } else {
        if(run>0) seen=true;                      // past the first stroke
        run=0;
      }
    }
  }
}
function fireStep(intensity){
  fireInit();
  const W=FIRE.w, H=FIRE.h, b=FIRE.buf, f=FIRE.fuel;
  // reseed from the fuel, with noise so the flame flickers
  let s=FIRE.seed;
  const rnd=()=>{ s=(s*1664525+1013904223)&0x7fffffff; return s/0x7fffffff; };
  for(let i=0,n=W*H;i<n;i++){
    // Most cells burn LOW; a few flare hot and throw the occasional peak.
    // Fuelling every cell at roughly the same heat gave one even wall of
    // flame with no silhouette.
    // The tongue silhouette comes from SPARSE fuel, not from the propagation:
    // most cells stay unlit on any given frame, and the few that catch burn
    // hot. Lighting the whole rim every frame gave a continuous sheet of
    // flame with no gaps for tongues to form between.
    if(f[i]>0.02){
      const u=rnd();
      if(u<0.42) b[i]=Math.max(b[i], (0.9+1.5*rnd())*intensity*(0.35+0.65*f[i]));
      else if(u<0.60) b[i]=Math.max(b[i], 0.22*intensity*f[i]);
    }
  }
  // propagate UP the buffer (row 0 is the top of the canvas, so heat moves
  // toward lower y). Columns CLAMP at the edges rather than wrapping: the
  // textbook version wraps with %W, which carried heat off one side and back
  // in the other -- visible as a stray flame under the last letter.
  // A per-cell drift and jitter break the flame into separate tongues
  // instead of one smooth slab.
  // A flame is a TEARDROP: wide and hot at its base, narrowing as it rises.
  // Averaging neighbours uniformly spreads heat sideways as fast as it climbs,
  // so the column stayed as wide at the top as at the bottom. Two changes fix
  // the shape: the sideways share shrinks with height (so the tip draws in),
  // and cooling grows with height (so the tip dies out).
  for(let y=0;y<H-2;y++){
    const row=y*W, r1=(y+1)*W, r2=(y+2)*W;
    // `up` is 0 at the flame's base (bottom of the buffer) and 1 at the top
    const up=1-(y/(H-2));
    // A flame tongue is CONCAVE: it pinches in fast just above the fuel, then
    // runs with near-vertical sides and closes only at the tip. `up*up` gave
    // the opposite -- a convex dome that held 93% of its width to mid-height
    // and then collapsed. `up^0.55` drops to ~54% by mid-height and stays
    // thin, which is the tongue silhouette.
    // `spread` is the SIDEWAYS weight in the average, not the flame's width.
    // Lowering it keeps heat in its own column, so the columns rise
    // independently and the mass reads as a solid wall. Keeping it high lets
    // neighbouring columns bleed into each other, which is what rounds a
    // tongue off and lets the gaps between tongues open up.
    const spread=lerp(0.85, 1.35, up);
    const cool=lerp(1.010, 1.070, Math.pow(up,1.6));
    for(let x=0;x<W;x++){
      const l=x>0?x-1:0, r=x<W-1?x+1:W-1;
      const n=rnd();
      const wl=spread*(0.75+0.5*n), wr=spread*(1.25-0.5*n);
      const tot=wl+1.25+wr+0.55;
      b[row+x]=(b[r1+l]*wl + b[r1+x]*1.25 + b[r1+r]*wr + b[r2+x]*0.55)
               /(tot*cool) * (0.97+0.06*rnd());
    }
  }
  FIRE.seed=s;
}
/* Map heat to flame colour and blit, scaled to the given box. */
/* A blackbody-like ramp, built once: deep red through orange and amber to a
   pale yellow core. The previous version stepped between four hand-written
   bands, which produced a flat orange slab and a hard edge where it jumped to
   yellow. 256 interpolated entries instead. */
let FIRE_LUT=null;
function fireLUT(){
  if(FIRE_LUT) return FIRE_LUT;
  const stops=[[0.00,0,0,0,0],[0.10,60,8,2,90],[0.26,150,28,4,190],
               [0.45,226,78,8,240],[0.62,248,140,24,255],[0.78,255,196,70,255],
               [0.90,255,232,150,255],[1.00,255,250,225,255]];
  FIRE_LUT=new Uint8ClampedArray(256*4);
  for(let i=0;i<256;i++){
    const v=i/255;
    let a=stops[0], bb=stops[stops.length-1];
    for(let k=0;k<stops.length-1;k++){
      if(v>=stops[k][0] && v<=stops[k+1][0]){ a=stops[k]; bb=stops[k+1]; break; }
    }
    const f=(bb[0]-a[0])>0 ? (v-a[0])/(bb[0]-a[0]) : 0;
    FIRE_LUT[i*4]  =a[1]+(bb[1]-a[1])*f;
    FIRE_LUT[i*4+1]=a[2]+(bb[2]-a[2])*f;
    FIRE_LUT[i*4+2]=a[3]+(bb[3]-a[3])*f;
    FIRE_LUT[i*4+3]=a[4]+(bb[4]-a[4])*f;
  }
  return FIRE_LUT;
}
function fireDraw(x0,y0,bw,bh,o={}){
  fireInit();
  const W=FIRE.w, H=FIRE.h, b=FIRE.buf, px=FIRE.img.data;
  const L=fireLUT();
  for(let i=0,n=W*H;i<n;i++){
    const idx=Math.min(255, (b[i]*255)|0)*4;
    const j=i*4;
    px[j]=L[idx]; px[j+1]=L[idx+1]; px[j+2]=L[idx+2]; px[j+3]=L[idx+3];
  }
  const g=FIRE.cvs.getContext("2d");
  g.setTransform(1,0,0,1,0,0);
  g.putImageData(FIRE.img,0,0);
  ctx.save();
  ctx.globalAlpha=o.alpha??1;
  ctx.globalCompositeOperation=o.blend||"lighter";
  ctx.imageSmoothingEnabled=(o.smooth!==false);
  ctx.drawImage(FIRE.cvs, x0, y0, bw, bh);
  ctx.restore();
}

/* ---------- the tetris board inside the house ---------- */
/* The house's body is a 10x6 grid of square cells. Everything about the board
   -- cell size, origin, the house outline itself -- is derived from one place
   so the falling pieces, the settled blocks and the house can never drift
   apart. The body's height is snapped to a whole number of cells, so pieces
   land flush with the floor instead of half a cell short. */
/* 32 x 12. The board has to spell "WHEN I" / "COME HOME" in 3x5 pixel
   letters, which needs 32 columns and 11 rows -- so the grid is sized by the
   TEXT, and the house is then sized so its cells stay big enough to read as
   tetris blocks (a 10x6 board made the letters impossible; a 32-column board
   at the old house width made 20px confetti). */
const TET={ COLS:32, ROWS:12 };
function tetBoard(w,h){
  const HW=Math.min(w*0.80, h*1.35);
  const cell=HW/TET.COLS;
  const bodyH=cell*TET.ROWS;              // snapped to whole cells
  const roofH=HW*0.30;
  const HH=bodyH+roofH;
  const cx=w*0.5, cy=h*0.50;
  const top=cy-HH/2;                      // the ridge
  const x0=cx-HW/2, y0=top+roofH;         // top-left of the body
  return {cell, cols:TET.COLS, rows:TET.ROWS, HW, HH, roofH, bodyH,
          cx, cy, top, x0, y0,
          cellX:(c)=>x0+c*cell, cellY:(r)=>y0+r*cell};
}

/* The pull-back that ends scene 14 and carries into scene 15.
   Scene 14 finishes already zoomed out, so the spiral can open at a radius
   that clears the roof instead of starting tight around a full-size house.
   Both scenes read this, so the handover cannot drift. */
function tetPullback(t){
  return lerp(1, 0.52, easeIO(inv(t, 47.60, 48.52)));
}

/* The house outline: ridge, two eaves, the body's sides and floor. */
function tetHousePath(B){
  const p=new Path2D();
  p.moveTo(B.cx, B.top);
  p.lineTo(B.x0+B.HW, B.y0);
  p.lineTo(B.x0+B.HW, B.y0+B.bodyH);
  p.lineTo(B.x0, B.y0+B.bodyH);
  p.lineTo(B.x0, B.y0);
  p.closePath();
  return p;
}

/* Where a piece rests, and the cell box it occupies. */
function tetPieceBox(pc){
  let x0=1e9,x1=-1,y0=1e9,y1=-1;
  for(const [c,r] of pc.c){
    if(c<x0)x0=c; if(c>x1)x1=c; if(r<y0)y0=r; if(r>y1)y1=r;
  }
  return {x0,x1,y0,y1,w:x1-x0+1,h:y1-y0+1};
}

/* The seven tetrominoes, as cell offsets. */
const TET_SHAPES={

  T:[[0,0],[1,0],[2,0],[1,1]],

// Pure white on pure black: 21:1, the maximum any two colours can reach.
// The board is a message first and a texture second.

function tetBlock(x, y, cell, col, o={}){

  // seam is needed and nothing shows through from behind.

  const X=x+g, Y=y+g;
  ctx.save();
  ctx.globalAlpha=o.alpha??1;
  ctx.fillStyle=col;
  ctx.fillRect(X, Y, s, s);
