const HOUSE = {vis:0, x:0, y:0, s:1, door:0, light:0};
function drawHouse(t){
  if(HOUSE.vis<=0.002) return;
  const {x,y,s}=HOUSE, a=HOUSE.vis;
  ctx.save(); ctx.globalAlpha=a; ctx.translate(x,y); ctx.scale(s,s);
  const Wd=150*S, Hd=108*S, roof=64*S;
  // warm interior glow
  if(HOUSE.light>0){
    const g=ctx.createRadialGradient(0,-Hd*0.2,2,0,-Hd*0.2,Wd*1.5);
    g.addColorStop(0,`rgba(255,181,99,${0.40*HOUSE.light})`);
    g.addColorStop(1,"rgba(255,181,99,0)");
    ctx.fillStyle=g; ctx.fillRect(-Wd*1.6,-Hd*1.9,Wd*3.2,Hd*3.2);
  }
  ctx.lineWidth=Math.max(1.6,3.1*S); ctx.lineJoin="round"; ctx.lineCap="round";
  ctx.strokeStyle=P.paper;
  // walls
  ctx.beginPath(); ctx.moveTo(-Wd/2,0); ctx.lineTo(-Wd/2,-Hd); ctx.lineTo(Wd/2,-Hd); ctx.lineTo(Wd/2,0);
  ctx.stroke();
  // roof
  ctx.beginPath(); ctx.moveTo(-Wd/2-13*S,-Hd); ctx.lineTo(0,-Hd-roof); ctx.lineTo(Wd/2+13*S,-Hd); ctx.stroke();
  // window (warm)
  const ww=38*S;
  ctx.fillStyle=`rgba(255,181,99,${0.30+0.55*HOUSE.light})`;
  ctx.fillRect(-Wd/2+20*S,-Hd+22*S,ww,ww*0.78);
  ctx.strokeRect(-Wd/2+20*S,-Hd+22*S,ww,ww*0.78);
  // door — opens as door->1
  const dw=42*S, dh=62*S, dx=Wd/2-dw-20*S;
  ctx.save();
  ctx.translate(dx,0);
  ctx.fillStyle=P.ink; ctx.fillRect(0,-dh,dw,dh);
  ctx.save(); ctx.transform(1-0.92*HOUSE.door,0,0,1,0,0);
  ctx.fillStyle=`rgba(255,181,99,${0.2+0.5*HOUSE.light})`;
  ctx.fillRect(0,-dh,dw,dh); ctx.strokeRect(0,-dh,dw,dh);
  ctx.restore();
  ctx.restore();
  // ground line
  ctx.beginPath(); ctx.moveTo(-Wd*0.95,0); ctx.lineTo(Wd*0.95,0); ctx.stroke();
  ctx.restore();
}

/* ---------- reusable type helpers ---------- */
/* progressive word reveal with per-word style callback */
function revealLine(line, t, o={}){
  let ws=wordsOf(line); if(!ws.length) return null;
  // skipped words are drawn elsewhere, so drop them from the layout entirely —
  // otherwise they still consume x-advance and push the block sideways
  if(o.skip) ws=ws.filter(q=>!o.skip.includes(q.w));
  if(!ws.length) return null;
  const px=(o.size||64)*S;
  const L=layout(ws,px,{weight:o.weight,face:o.face,italic:o.italic},o.gap??0.3);
  const cx=o.cx!==undefined?o.cx:w/2, cy=o.cy!==undefined?o.cy:h/2;
  let x = o.align==="left" ? cx : cx-L.total/2;
  const out=[];
  ctx.textBaseline="alphabetic";
  for(let i=0;i<ws.length;i++){
    const o2=ws[i];
    const a=inv(t,o2.s,o2.s+(o.fade??0.14));
    const cxw=x+L.widths[i]/2;
    out.push({word:o2,x,cx:cxw,wd:L.widths[i],a,i});
    if(a>0 && o.draw!==false){
      ctx.save();
      const rise=(1-easeOut(a))*(o.rise??18)*S;
      ctx.globalAlpha=clamp(a,0,1)*(o.alpha??1);
      ctx.fillStyle=o.color||P.paper;
      if(o.glow) shadow(o.glow,o.glowSize||18);
      setFont(px,{weight:o.weight,face:o.face,italic:o.italic});
      ctx.fillText(o2.w, x, cy+rise);
      noShadow();
      ctx.restore();
    }
    x+=L.widths[i]+L.sp;
  }
  return {items:out, L, cx, cy, px};
}

/* draw a single word freely */
function drawWord(txt,x,y,px,o={}){
  ctx.save();
  setFont(px,{weight:o.weight??600,face:o.face||SANS,italic:o.italic});
  ctx.textAlign=o.align||"center"; ctx.textBaseline=o.baseline||"middle";
  ctx.globalAlpha=o.alpha??1; ctx.fillStyle=o.color||P.paper;
  if(o.glow) shadow(o.glow,o.glowSize||20);
  if(o.rot){ ctx.translate(x,y); ctx.rotate(o.rot); ctx.fillText(txt,0,0); }
  else ctx.fillText(txt,x,y);
  noShadow(); ctx.restore();
  setFont(px,{weight:o.weight??600,face:o.face||SANS,italic:o.italic});
  return ctx.measureText(txt).width;
}

/* letter-spaced draw (for the "Long" stretch) */
function drawSpaced(txt,cx,y,px,sp,o={}){
  setFont(px,{weight:o.weight??600,face:o.face||SANS});
  const chs=[...txt]; let tot=0;
  const ws=chs.map(c=>{const m=ctx.measureText(c).width; tot+=m; return m;});
  tot+=sp*(chs.length-1);
  let x=cx-tot/2;
  ctx.save(); ctx.globalAlpha=o.alpha??1; ctx.fillStyle=o.color||P.paper;
  ctx.textAlign="left"; ctx.textBaseline="middle";
  if(o.glow) shadow(o.glow,16);
  for(let i=0;i<chs.length;i++){ ctx.fillText(chs[i],x,y); x+=ws[i]+sp; }
  noShadow(); ctx.restore();
  return tot;
}

/* shatter a word into falling shards */
function shatter(txt,cx,cy,px,p,o={}){
  if(p<=0) return;
  setFont(px,{weight:o.weight??800,face:o.face||SANS});
  const chs=[...txt]; let tot=0;
  const wds=chs.map(c=>{const m=ctx.measureText(c).width; tot+=m; return m;});
  let x=cx-tot/2;
  ctx.save(); ctx.textAlign="left"; ctx.textBaseline="middle";
  for(let i=0;i<chs.length;i++){
    const seed=(i*2654435761)%1000/1000;
    const dy=easeIn(p)*(60+seed*160)*S;
    const rot=(seed-0.5)*p*2.2;
    const a=(1-p)*(o.alpha??1);
    if(a>0.002){
      ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=o.color||P.paper;
      ctx.translate(x+wds[i]/2, cy+dy); ctx.rotate(rot);
      ctx.fillText(chs[i], -wds[i]/2, 0); ctx.restore();
    }
    x+=wds[i];
  }
  ctx.restore();
}

/* strike-through line */
function strike(cx,cy,wd,p,color){
  if(p<=0)return;
  ctx.save(); ctx.strokeStyle=color||P.hot; ctx.lineWidth=Math.max(2,5*S); ctx.lineCap="round";
  ctx.globalAlpha=clamp(p*2,0,1);
  ctx.beginPath(); ctx.moveTo(cx-wd/2,cy); ctx.lineTo(cx-wd/2+wd*easeOut(clamp(p*1.6,0,1)),cy); ctx.stroke();
  ctx.restore();
}

/* ---------- handwriting: real glyph outlines, revealed under a pen ---------- */
/* Canvas text can't be stroke-animated, so we parse the font outline with
   opentype.js and sweep a clip mask across it in writing order. That reveals
   the INK (not the contour), which is what a pen actually leaves behind. */
const HW={font:null, ready:false, paths:new Map()};
/* a blocky outline font for the extruded 3D words in scene 3 */
const BLOCK={font:null, ready:false};
(function loadBlockFont(){
  const TTF="https://fonts.gstatic.com/s/archivo/v25/k3k6o8UDI-1M0wlSV9XAw6lQkqWY8Q82sJaRE-NWIDdgffTTtDRp8A.ttf";
  const go=()=>fetch(TTF).then(r=>r.arrayBuffer()).then(b=>{
    try{ BLOCK.font=window.opentype.parse(b); BLOCK.ready=true; }catch(e){}
  }).catch(()=>{});
  const tick=()=>{ if(window.opentype) go(); else setTimeout(tick,120); };
  tick();
})();
(function loadHandFont(){
  const SRC="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js";
  const TTF="https://fonts.gstatic.com/s/dancingscript/v29/If2cXTr6YS-zF4S-kcSWSVi_sxjsohD9F50Ruu7BMSoHTQ.ttf";
  const go=()=>fetch(TTF).then(r=>r.arrayBuffer()).then(b=>{
    try{ HW.font=window.opentype.parse(b); HW.ready=true; }catch(e){}
  }).catch(()=>{});
  if(window.opentype) return go();
  const sc=document.createElement("script");
  sc.src=SRC; sc.onload=go; sc.onerror=()=>{};
  document.head.appendChild(sc);
})();

/* cached Path2D + metrics + per-column ink extents for one string at one size.
   The column map lets the nib ride the actual stroke instead of a flat sweep. */
function handPath(txt,px){
  const key=txt+"@"+Math.round(px);
  if(HW.paths.has(key)) return HW.paths.get(key);
  if(!HW.ready) return null;
  const p=HW.font.getPath(txt,0,0,px);
  const bb=p.getBoundingBox();
  const rec={p2d:new Path2D(p.toPathData(2)), x1:bb.x1, x2:bb.x2, y1:bb.y1, y2:bb.y2,
             width:HW.font.getAdvanceWidth(txt,px)};

  // flatten the outline to points, then record min/max ink y per x-column
  const pts=[];
  let cx=0,cy=0,sx=0,sy=0;
  for(const c of p.commands){
    if(c.type==="M"){ cx=sx=c.x; cy=sy=c.y; pts.push(cx,cy); }
    else if(c.type==="L"){ cx=c.x; cy=c.y; pts.push(cx,cy); }
    else if(c.type==="Q"){
      for(let i=1;i<=8;i++){ const u=i/8,v=1-u;
        pts.push(v*v*cx+2*v*u*c.x1+u*u*c.x, v*v*cy+2*v*u*c.y1+u*u*c.y); }
      cx=c.x; cy=c.y;
    } else if(c.type==="C"){
      for(let i=1;i<=10;i++){ const u=i/10,v=1-u;
        pts.push(v*v*v*cx+3*v*v*u*c.x1+3*v*u*u*c.x2+u*u*u*c.x,
                 v*v*v*cy+3*v*v*u*c.y1+3*v*u*u*c.y2+u*u*u*c.y); }
      cx=c.x; cy=c.y;
    } else if(c.type==="Z"){ cx=sx; cy=sy; }
  }
  const STEP=Math.max(1,px*0.012);
  const cols=new Map();
  for(let i=0;i<pts.length;i+=2){
    const k=Math.round(pts[i]/STEP), y=pts[i+1];
    const e=cols.get(k);
    if(!e) cols.set(k,[y,y]);
    else { if(y<e[0])e[0]=y; if(y>e[1])e[1]=y; }
  }
  rec.cols=cols; rec.step=STEP;
  HW.paths.set(key,rec);
  return rec;
}

/* where is the pen tip at reveal-x? top of the ink in that column,
   searching outward a little so gaps between letters don't drop the nib */
function nibY(rec,x){
  const k=Math.round(x/rec.step);
  for(let d=0;d<=6;d++){
    const a=rec.cols.get(k-d), b=rec.cols.get(k+d);
    const e=a||b;
    if(e) return e[0]+(e[1]-e[0])*0.30;   // sit just inside the stroke
  }
  return null;
}

/* Draw `txt` as if written by a pen. prog 0..1 sweeps the reveal.
   Falls back to a plain fade if the font hasn't arrived yet. */
function drawHandwritten(txt,cx,baseY,px,prog,o={}){
  const rec=handPath(txt,px);
  const alpha=o.alpha??1;
  if(!rec){                                     // graceful fallback
    drawWord(txt,cx,baseY,px,{...o,alpha:alpha*clamp(prog*1.5,0,1),face:DISPLAY});
    return;
  }
  const x0 = o.align==="left" ? cx : cx-rec.width/2;
  const p=clamp(prog,0,1);
  // reveal edge sweeps across the inked bounds, slightly past each end
  const pad=px*0.16;
  const edge=lerp(rec.x1-pad, rec.x2+pad, p);

  ctx.save();
  ctx.translate(x0,baseY);
  // 1) clip to everything written so far
  ctx.beginPath();
  ctx.rect(rec.x1-pad*2, rec.y1-px, (edge-(rec.x1-pad*2)), (rec.y2-rec.y1)+px*2);
  ctx.clip();
  // 2) fill the glyph outline inside that clip  -> ink appears
  ctx.globalAlpha=alpha;
  ctx.fillStyle=o.color||P.paper;
  if(o.glow) shadow(o.glow,o.glowSize||14);
  ctx.fill(rec.p2d);
  noShadow();
  ctx.restore();

  // 3) the nib: sits ON the stroke being drawn, following the ink up and down
  if(o.nib!==false && p>0.002 && p<0.999){
    const ny=nibY(rec,edge);
    if(ny!==null){
      ctx.save();
      ctx.translate(x0,baseY);
      const r=px*0.17;
      ctx.globalAlpha=alpha;
      const g=ctx.createRadialGradient(edge,ny,0,edge,ny,r*1.9);
      g.addColorStop(0,"rgba(255,240,205,1)");
      g.addColorStop(0.35,"rgba(255,196,120,.75)");
      g.addColorStop(1,"rgba(255,181,99,0)");
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(edge,ny,r*1.9,0,7); ctx.fill();
      // bright core
      ctx.globalAlpha=alpha*0.95;
      ctx.fillStyle="rgba(255,248,230,.95)";
      ctx.beginPath(); ctx.arc(edge,ny,r*0.42,0,7); ctx.fill();
      ctx.restore();
    }
  }
}

/* Where does the pen leave the page? The last inked column of the string,
   at the vertical position of that column's ink — i.e. the tip of the final
   stroke. Used to continue the stroke beyond the word. */
function handTail(txt,px,originX,baseY){
  const rec=handPath(txt,px);
  if(!rec) return null;
  const x=rec.x2;
  const ny=nibY(rec,x);
  // how thick is the stroke where it ends? sample a few columns back from the
  // tip (the very last column tapers to nothing) and take the ink extent
  let thick=Infinity;
  for(let d=2; d<=14; d++){
    const e=rec.cols.get(Math.round(x/rec.step)-d);
    if(e) thick=Math.min(thick, e[1]-e[0]);
  }
  if(!isFinite(thick)) thick=px*0.045;
  return {x:originX+x, y:baseY+(ny===null?0:ny), w:thick};
}

/* A sinuous ribbon from a to b, bulging through the upper area, drawn with a
   travelling head. Returns the current head position so callers can hit things. */
function penTrail(a,b,prog,o={}){
  const p=clamp(prog,0,1);
  // control points arc the stroke up and to the right before diving at the target
  const c1={x:lerp(a.x,b.x,0.30)+ (o.bowX??0), y:a.y-(o.lift??0.42)*Math.abs(b.x-a.x)};
  const c2={x:lerp(a.x,b.x,0.72), y:a.y-(o.lift2??0.30)*Math.abs(b.x-a.x)};
  const at=u=>{
    const v=1-u;
    return {
      x: v*v*v*a.x + 3*v*v*u*c1.x + 3*v*u*u*c2.x + u*u*u*b.x,
      y: v*v*v*a.y + 3*v*v*u*c1.y + 3*v*u*u*c2.y + u*u*u*b.y
    };
  };
  if(p>0.001){
    ctx.save();
    ctx.strokeStyle=o.color||P.paper;
    ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.globalAlpha=o.alpha??1;
    if(o.glow) shadow(o.glow,o.glowSize||14);
    // Starts at the pen's own stroke width where it leaves the "e", then
    // thins along its flight so the leading tip is just a fine glowing point.
    const N=56, upto=Math.max(1,Math.round(N*p));
    const w0=(o.w0??6.0)*S, w1=(o.w1??1.1)*S;
    for(let i=0;i<upto;i++){
      const u0=i/N, u1=(i+1)/N;
      const q0=at(u0), q1=at(u1);
      const along=i/N;                          // 0 at the "e" .. 1 at the target
      ctx.lineWidth=Math.max(0.5, lerp(w0,w1,easeOut(along)));
      ctx.globalAlpha=(o.alpha??1)*lerp(0.95,0.75,along);
      ctx.beginPath(); ctx.moveTo(q0.x,q0.y); ctx.lineTo(q1.x,q1.y); ctx.stroke();
    }
    noShadow();
    ctx.restore();
  }
  return at(p);
}

/* firework burst at (x,y); k = 0..1 */
function burst(x,y,k,o={}){
  if(k<=0||k>=1) return;
  const N=o.n??26;
  ctx.save();
  for(let i=0;i<N;i++){
    const sd=(i*2654435761)%1000/1000;
    const ang=(i/N)*Math.PI*2 + sd*0.5;
    const spd=(0.55+sd*0.75)*(o.r??150)*S;
    const d=easeOut(k)*spd;
    const px2=x+Math.cos(ang)*d, py2=y+Math.sin(ang)*d + k*k*(o.g??90)*S;
    const a=(1-k)*(1-k);
    ctx.globalAlpha=a;
    ctx.fillStyle = sd>0.6?P.warm : sd>0.3?P.hot : P.paper;
    const r=Math.max(0.8,(o.size??3.2)*S*(0.4+sd*0.9)*(1-k*0.5));
    ctx.beginPath(); ctx.arc(px2,py2,r,0,7); ctx.fill();
  }
  // flash
  if(k<0.35){
    const f=1-k/0.35;
    const g=ctx.createRadialGradient(x,y,0,x,y,(o.r??150)*S*0.7*f);
    g.addColorStop(0,`rgba(255,240,205,${0.55*f})`);
    g.addColorStop(1,"rgba(255,181,99,0)");
    ctx.globalAlpha=1; ctx.fillStyle=g;
    ctx.fillRect(x-(o.r??150)*S,y-(o.r??150)*S,(o.r??150)*S*2,(o.r??150)*S*2);
  }
  ctx.restore();
}

/* ---------- portal ---------- */
/* A ring with a RECTANGULAR cross-section, lying flat and seen from above:
   outer radius Ro, inner radius Ri, wall height H (taller than it is thick).
   Floating in space, so the visible curved surface is the OUTER wall across
   the front arc. "AND NO" is stamped on that wall and follows its curvature —
   each glyph is scaled by cos(theta), which is the foreshortening of a
   cylindrical surface, so letters squeeze to nothing at the silhouette edges.
   No 3D library: a fixed-camera ring is cheap to project by hand. */
function drawPortal(cx,cy,R,open,_spin,o={}){
  if(open<=0.001) return;
  const k=easeOut(clamp(open,0,1));
  const sq=o.squash??0.30;            // vertical squash = viewing angle
  const Ro=Math.max(R*k,1);
  const thick=Ro*(o.thick??0.17);     // wall thickness (Ro-Ri)
  const Ri=Math.max(Ro-thick,1);
  const H=Ro*(o.height??0.30);        // wall height: taller than thick

  const exT=x=>Math.cos(x)*Ro, eyT=x=>Math.sin(x)*Ro*sq;        // outer, top
  const exI=x=>Math.cos(x)*Ri, eyI=x=>Math.sin(x)*Ri*sq;        // inner, top

  ctx.save();
  ctx.translate(cx,cy);

  // ---- the hole: what shows through the ring ----
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0,0,Ri,Ri*sq,0,0,7); ctx.clip();
  const vg=ctx.createRadialGradient(0,0,0,0,0,Ri);
  vg.addColorStop(0.00,`rgba(255,250,240,${0.92*k})`);  // a way through
  vg.addColorStop(0.34,`rgba(255,198,138,${0.30*k})`);
  vg.addColorStop(0.72,`rgba(40,22,34,${0.92*k})`);
  vg.addColorStop(1.00,`rgba(12,8,16,${0.98*k})`);
  ctx.fillStyle=vg; ctx.fillRect(-Ro,-Ro,Ro*2,Ro*2);
  ctx.restore();

  // ---- far inner wall (seen through the hole, upper arc) ----
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(exI(Math.PI), eyI(Math.PI));
  for(let th=Math.PI; th<=Math.PI*2; th+=0.06) ctx.lineTo(exI(th), eyI(th));
  for(let th=Math.PI*2; th>=Math.PI; th-=0.06) ctx.lineTo(exI(th), eyI(th)+H);
  ctx.closePath();
  ctx.fillStyle=`rgba(62,42,34,${0.9*k})`;
  ctx.fill();
  ctx.restore();

  // ---- top annular face ----
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0,0,Ro,Ro*sq,0,0,7);
  ctx.ellipse(0,0,Ri,Ri*sq,0,0,7,true);
  const tg=ctx.createLinearGradient(0,-Ro*sq,0,Ro*sq);
  tg.addColorStop(0,`rgba(226,178,126,${0.95*k})`);
  tg.addColorStop(0.5,`rgba(255,226,186,${0.98*k})`);
  tg.addColorStop(1,`rgba(198,146,98,${0.95*k})`);
  ctx.fillStyle=tg; ctx.fill("evenodd");
  ctx.restore();

  // ---- the OUTER curved wall, front arc (theta 0..PI) ----
  ctx.save();
  ctx.beginPath();
  const E=0.001;                       // close exactly on the silhouette
  ctx.moveTo(exT(E), eyT(E));
  for(let th=E; th<=Math.PI-E; th+=0.03) ctx.lineTo(exT(th), eyT(th));
  ctx.lineTo(exT(Math.PI-E), eyT(Math.PI-E));
  ctx.lineTo(exT(Math.PI-E), eyT(Math.PI-E)+H);
  for(let th=Math.PI-E; th>=E; th-=0.03) ctx.lineTo(exT(th), eyT(th)+H);
  ctx.lineTo(exT(E), eyT(E)+H);
  ctx.closePath();
  // shade across the wall: brightest where it faces us (theta = PI/2)
  const wg=ctx.createLinearGradient(-Ro,0,Ro,0);
  wg.addColorStop(0.00,`rgba(96,62,44,${0.98*k})`);
  wg.addColorStop(0.22,`rgba(176,118,76,${0.98*k})`);
  wg.addColorStop(0.50,`rgba(240,186,132,${0.98*k})`);
  wg.addColorStop(0.78,`rgba(176,118,76,${0.98*k})`);
  wg.addColorStop(1.00,`rgba(96,62,44,${0.98*k})`);
  ctx.fillStyle=wg; ctx.fill();
  // a bright lip where the wall meets the top face
  ctx.lineWidth=Math.max(1,Ro*0.012);
  ctx.strokeStyle=`rgba(255,238,206,${0.85*k})`;
  ctx.beginPath();
  ctx.moveTo(exT(0.001), eyT(0.001));
  for(let th=0.001; th<=Math.PI-0.001; th+=0.03) ctx.lineTo(exT(th), eyT(th));
  ctx.stroke();
  ctx.restore();

  // ---- "AND NO" stamped on the outer wall ----
  // Each glyph is rendered once to an offscreen tile, then redrawn as a strip
  // of thin vertical slices. Every slice is placed at its own angle around the
  // ring, so the letterform genuinely BENDS with the surface instead of being
  // a flat sprite that only narrows. This is the cylindrical warp a 3D engine
  // would do with a textured mesh — here it is ~20 slices per glyph.
  {
    const txt=(o.text||"AND NO").toUpperCase();
    const chars=[...txt];
    const px=Math.max(10,H*0.60);
    const span=o.span??(Math.PI*0.84);
    const mid=Math.PI/2;
    const n=Math.max(1,chars.length-1);
    const step=span/n;

    if(!HW.tile){ HW.tile=document.createElement("canvas"); HW.tctx=HW.tile.getContext("2d"); }
    const tile=HW.tile, tctx=HW.tctx;

    for(let i=0;i<chars.length;i++){
      const ch=chars[i];
      if(ch===" ") continue;
      const thC=mid + span/2 - i*step;          // this glyph's centre angle
      if(Math.sin(thC)<=0.06) continue;         // past the silhouette

      // draw the glyph once, upright, into a tile
      setFont(px,{weight:700,face:MONO});
      const gw=Math.ceil(ctx.measureText(ch).width)+4;
      const gh=Math.ceil(px*1.5);
      tile.width=gw; tile.height=gh;
      tctx.clearRect(0,0,gw,gh);
      tctx.font=`700 ${px}px ${MONO}`;
      tctx.textAlign="center"; tctx.textBaseline="middle";
      tctx.fillStyle="#fff";
      tctx.fillText(ch, gw/2, gh/2);

      // angular half-width this glyph occupies on the ring surface
      const halfArc=(gw/2)/Ro;
      const SL=18;                              // slices per glyph
      for(let sIdx=0;sIdx<SL;sIdx++){
        const u0=sIdx/SL, u1=(sIdx+1)/SL;
        const a0=thC+halfArc-(u0*2*halfArc);    // left..right across the glyph
        const a1=thC+halfArc-(u1*2*halfArc);
        const f0=Math.sin(a0), f1=Math.sin(a1);
        if(f0<=0.02 && f1<=0.02) continue;
        const x0=exT(a0), x1=exT(a1);
        const y0=eyT(a0), y1=eyT(a1);
        const sw=gw/SL;
        const dw=Math.abs(x1-x0);
        if(dw<0.05) continue;
        const dx=Math.min(x0,x1);
        // vertical position follows the wall top at this angle
        const dyTop=Math.min(y0,y1)+H*0.20;
        const dh=H*0.62;
        const shade=0.55+0.45*Math.max(f0,f1);  // lit where it faces us
        // dark stamped letter, with a lit bevel just above it
        ctx.save();
        ctx.globalAlpha=k*0.30*shade;
        ctx.globalCompositeOperation="source-over";
        ctx.drawImage(tile, sIdx*sw,0,sw,gh, dx, dyTop-H*0.045, dw, dh);
        ctx.restore();
        ctx.save();
        ctx.globalAlpha=k*(0.72+0.2*shade);
        ctx.drawImage(tile, sIdx*sw,0,sw,gh, dx, dyTop, dw, dh);
        ctx.globalCompositeOperation="source-atop";
        ctx.fillStyle=`rgba(46,24,12,1)`;
        ctx.fillRect(dx,dyTop,dw,dh);
        ctx.restore();
      }
    }
  }

  // ---- light from the hole: a contained glow, clipped to the opening ----
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0,0,Ri,Ri*sq,0,0,7); ctx.clip();
  const sh=ctx.createRadialGradient(0,0,0,0,0,Ri);
  sh.addColorStop(0,`rgba(255,246,226,${0.55*k})`);
  sh.addColorStop(1,"rgba(255,206,150,0)");
  ctx.fillStyle=sh; ctx.fillRect(-Ro,-Ro,Ro*2,Ro*2);
  ctx.restore();

  ctx.restore();
}

/* ---------- 3D portal layer (three.js) ---------- */
/* The ring and the two teens live in a real 3D scene on a WebGL canvas behind
   the 2D one. That is what lets the ring's front wall OCCLUDE them as they
   fall through the hole — impossible with 2D compositing. */
const GL={ready:false, active:false};
window.GL=GL;                      // exposed for debugging the 2D->3D splice
(function initGL(){
  const cv=document.getElementById("gl");
  if(!cv || typeof THREE==="undefined") return;
  const rnd=new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true});
  rnd.setClearColor(0x000000,0);
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(38,16/9,0.1,100);
  cam.position.set(0,2.35,5.4); cam.lookAt(0,0,0);

  function wallTexture(){
    const c=document.createElement("canvas");
    c.width=2048; c.height=256;
    const x=c.getContext("2d");
    x.fillStyle="#caa06f"; x.fillRect(0,0,c.width,c.height);
    for(let i=0;i<900;i++){
      x.globalAlpha=0.03+Math.random()*0.05;
      x.fillStyle=Math.random()>.5?"#fff":"#6b4a2a";
      x.fillRect(Math.random()*c.width, Math.random()*c.height, 40+Math.random()*180, 1);
    }
    x.globalAlpha=1;
    const txt="AND NO";
    const band=c.width*0.26;           // tighter arc keeps "NO" on screen
    let fs=190;
    x.font=`700 ${fs}px "Space Mono", monospace`;
    while(x.measureText(txt).width>band && fs>20){ fs-=4; x.font=`700 ${fs}px "Space Mono", monospace`; }
    x.textAlign="center"; x.textBaseline="middle";
    x.fillStyle="rgba(255,240,214,.5)"; x.fillText(txt,c.width*0.5,c.height/2-5);
    x.fillStyle="#32200f";             x.fillText(txt,c.width*0.5,c.height/2);
    const tex=new THREE.CanvasTexture(c);
    tex.wrapS=THREE.RepeatWrapping; tex.anisotropy=8;
    if(THREE.SRGBColorSpace) tex.colorSpace=THREE.SRGBColorSpace;
    return tex;
  }

  const Ro=1.35, Ri=1.12, Hh=0.46;    // smaller: the phrase must fit the front

  const grp=new THREE.Group(); scene.add(grp);
  const wallMat =new THREE.MeshStandardMaterial({map:wallTexture(),metalness:0.55,roughness:0.42,side:THREE.DoubleSide});
  const plainMat=new THREE.MeshStandardMaterial({color:0xe8c79a,metalness:0.6,roughness:0.35,side:THREE.DoubleSide});
  grp.add(new THREE.Mesh(new THREE.CylinderGeometry(Ro,Ro,Hh,160,1,true), wallMat));
  grp.add(new THREE.Mesh(new THREE.CylinderGeometry(Ri,Ri,Hh,160,1,true), plainMat));
  for(const sgn of [1,-1]){
    const r=new THREE.Mesh(new THREE.RingGeometry(Ri,Ro,160), plainMat);
    r.rotation.x=-Math.PI/2*sgn; r.position.y=sgn*Hh/2; grp.add(r);
  }
  // UV centre sits at -Z, so PI brings the phrase to the front. The ring is
  // positioned right of frame, so only its left arc is visible: an extra
  // clockwise turn swings "AND NO" into that visible portion.
  // --- the event horizon: a rippling iridescent pool filling the opening ---
  // A shader gives the Stargate look: concentric waves from a moving centre,
  // with colour shifting across the surface and a bright caustic at the rim.
  const irisMat=new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
    uniforms:{ uT:{value:0}, uOpen:{value:0} },
    vertexShader:`
      varying vec2 vUv;
      void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      precision highp float;
      varying vec2 vUv;
      uniform float uT, uOpen;
      // cheap value noise
      float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      float n(vec2 p){
        vec2 i=floor(p), f=fract(p);
        f=f*f*(3.0-2.0*f);
        return mix(mix(h(i),h(i+vec2(1,0)),f.x),
                   mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y);
      }
      void main(){
        vec2 p=(vUv-0.5)*2.0;
        float r=length(p);
        if(r>1.0) discard;
        float a=atan(p.y,p.x);

        // drifting centre, so the ripples never look static
        vec2 c=vec2(sin(uT*0.37)*0.22, cos(uT*0.29)*0.18);
        float d=length(p-c);

        // concentric travelling waves + turbulence
        float waves=sin(d*16.0-uT*3.4)*0.5+0.5;
        float turb=n(p*3.2+vec2(uT*0.35,-uT*0.27));
        float surf=mix(waves,turb,0.45);

        // iridescent palette: teal -> blue -> violet, shifting with the surface
        vec3 c1=vec3(0.25,0.80,0.95);
        vec3 c2=vec3(0.15,0.35,0.95);
        vec3 c3=vec3(0.75,0.45,1.00);
        vec3 col=mix(c1,c2,surf);
        col=mix(col,c3,pow(turb,2.0)*0.55);

        // bright caustic ring near the edge + a hot core
        float rim=smoothstep(0.72,1.0,r);
        col+=vec3(0.65,0.85,1.0)*rim*0.85;
        col+=vec3(0.9,0.98,1.0)*pow(1.0-d,3.0)*0.35;

        // specular glints riding the wave crests
        col+=vec3(1.0)*pow(max(surf-0.72,0.0)*3.4,2.0)*0.5;

        float al=uOpen*(0.78+0.22*surf);
        al*=smoothstep(1.0,0.90,r);          // soften the outer edge
        gl_FragColor=vec4(col,al);
      }`
  });
  const iris=new THREE.Mesh(new THREE.CircleGeometry(Ri*0.995,96), irisMat);
  iris.rotation.x=-Math.PI/2;
  grp.add(iris);

  const RING_ROT=Math.PI-0.62;
  grp.rotation.y=RING_ROT;

  function faceTex(hex,bow){
    const c=document.createElement("canvas"); c.width=c.height=256;
    const x=c.getContext("2d");
    x.fillStyle=hex; x.fillRect(0,0,256,256);
    x.fillStyle="#17120c";
    x.beginPath(); x.arc(96,110,13,0,7); x.fill();
    x.beginPath(); x.arc(160,110,13,0,7); x.fill();
    x.lineWidth=11; x.strokeStyle="#17120c"; x.lineCap="round";
    x.beginPath(); x.arc(128,128,46,0.22*Math.PI,0.78*Math.PI); x.stroke();
    if(bow){
      x.fillStyle="#e8703f";
      x.beginPath(); x.ellipse(104,54,20,13,-0.5,0,7); x.fill();
      x.beginPath(); x.ellipse(152,54,20,13, 0.5,0,7); x.fill();
      x.beginPath(); x.arc(128,52,9,0,7); x.fill();
    }
    return new THREE.CanvasTexture(c);
  }
  // flat, unlit discs: visually identical to the 2D characters, but they live
  // in the depth buffer so the ring's front wall can hide them
  function discTex(hex,bow){
    const c=document.createElement("canvas"); c.width=c.height=256;
    const x=c.getContext("2d");
    x.clearRect(0,0,256,256);
    x.fillStyle=hex; x.beginPath(); x.arc(128,128,120,0,7); x.fill();
    x.fillStyle="#17120c";
    x.beginPath(); x.arc(96,112,13,0,7); x.fill();
    x.beginPath(); x.arc(160,112,13,0,7); x.fill();
    x.lineWidth=11; x.strokeStyle="#17120c"; x.lineCap="round";
    x.beginPath(); x.arc(128,130,44,0.22*Math.PI,0.78*Math.PI); x.stroke();
    if(bow){
      // derived from the same ratios as femaleMark() so the 2D and 3D bows
      // are identical; hand-typed values drifted apart before
      const R=120, cxx=128, cyy=128, bs=R*0.34;
      x.fillStyle=P.bow; x.strokeStyle="rgba(26,12,4,.75)";
      x.lineWidth=Math.max(1,R*0.055);
      const lobe=(dx,rot)=>{
        x.beginPath();
        x.ellipse(cxx+dx, cyy-R*0.92, bs*0.78, bs*0.50, rot, 0, 7);
        x.fill(); x.stroke();
      };
      lobe(-bs*1.15,-0.5); lobe(bs*1.15,0.5);
      x.beginPath(); x.arc(cxx, cyy-R*0.95, bs*0.34, 0, 7); x.fill(); x.stroke();
    }
    const tx=new THREE.CanvasTexture(c);
    tx.anisotropy=8;
    if(THREE.SRGBColorSpace) tx.colorSpace=THREE.SRGBColorSpace;  // else colours wash out
    return tx;
  }
  // alphaTest + no depth-write: without these the plane's transparent corners
  // occlude the pool behind them and render as black squares
  const mk=(hex,bow)=>new THREE.Mesh(
    new THREE.PlaneGeometry(0.62,0.62),
    new THREE.MeshBasicMaterial({map:discTex(hex,bow), transparent:true,
                                 alphaTest:0.5, depthWrite:false}));
  const male=mk("#7fc9a3",false), female=mk("#ffb563",true);
  scene.add(male,female);

  scene.add(new THREE.AmbientLight(0xffdcb0,0.55));
  const key=new THREE.DirectionalLight(0xfff0d8,1.5); key.position.set(2,4,3); scene.add(key);
  const rim=new THREE.PointLight(0xff8a3d,2.2,14); rim.position.set(-3,1.2,-2); scene.add(rim);
  const thru=new THREE.PointLight(0xfff6e2,3.0,10); thru.position.set(0,-1.4,0); scene.add(thru);

  // --- exact 2D <-> 3D alignment -------------------------------------
  // The ring stays at the world origin (constant apparent size) and the CAMERA
  // is shifted so the origin projects to a chosen screen point. Moving the ring
  // instead would change its depth, and so its size, as it moved across frame.
  const EYE0=new THREE.Vector3(0,2.35,5.4), TGT0=new THREE.Vector3(0,0,0);
  const FWD=new THREE.Vector3().subVectors(TGT0,EYE0);
  const DIST=FWD.length(); FWD.normalize();
  const RGT=new THREE.Vector3().crossVectors(FWD,new THREE.Vector3(0,1,0)).normalize();
  const UPV=new THREE.Vector3().crossVectors(RGT,FWD);
  const TY=Math.tan(THREE.MathUtils.degToRad(38)/2);

  let lastW=0,lastH=0;
  /* sx,sy: where the ring's centre should sit, in 0..1 screen coords */
  GL.render=function(openK, fallK, riseY, sx, sy){
    if(cv.clientWidth!==lastW||cv.clientHeight!==lastH){
      lastW=cv.clientWidth; lastH=cv.clientHeight;
      rnd.setPixelRatio(Math.min(devicePixelRatio||1,2));
      rnd.setSize(lastW,lastH,false);
      cam.aspect=lastW/Math.max(1,lastH); cam.updateProjectionMatrix();
    }
    // screen 0..1 -> ndc -1..1 (y flipped)
    const nx=(sx===undefined?0.5:sx)*2-1;
    const ny=-((sy===undefined?0.5:sy)*2-1);
    // Pan so that the world point (0, START_Y, 0) — where the discs sit —
    // projects to (sx,sy). The ring then falls naturally below them.
    const shift=new THREE.Vector3()
      .addScaledVector(RGT, -(nx*TY*cam.aspect*DIST))
      .addScaledVector(UPV, -(ny*TY*DIST));
    // The pan places the WORLD ORIGIN at (sx,sy). The discs sit START_Y above
    // it, so shift up by that much in world terms to put THEM on the target.
    const discLift=new THREE.Vector3(0,0.62,0);
    cam.position.copy(EYE0).add(shift).add(discLift);
    cam.lookAt(new THREE.Vector3().copy(TGT0).add(shift).add(discLift));

    const k=easeOut(clamp(openK,0,1));
    grp.scale.setScalar(Math.max(0.001,k));
    grp.visible=k>0.01;
    grp.position.set(0,0,0);
    grp.rotation.y=(GL.ringRot===undefined?RING_ROT:GL.ringRot);
    irisMat.uniforms.uT.value=(GL.clock===undefined?0:GL.clock);
    irisMat.uniforms.uOpen.value=k;
    // the pool lights the inside of the ring
    thru.color.setHex(0x8fd8ff);
    thru.intensity=3.4*k;

    const f=clamp(fallK,0,1);
    // Start exactly where the 2D pair stood (handed over by the caller as
    // startY in ring units), then accelerate down through the hole. Without
    // this the discs pop in from off-screen and the splice jumps.
    const y0=(GL.startY===undefined?0.95:GL.startY);
    const y=y0-(y0+2.6)*f*f;
    // The 2D layer is the source of truth: it hands over each character's
    // screen position and radius, and we solve for the world position that
    // projects exactly there, then scale the plane to match the radius.
    const T=GL.target;
    if(T && T.have){
      const W=cv.clientWidth, Hh2=cv.clientHeight;
      // world point on the discs' plane (z=0) that projects to a screen point
      // They must START ABOVE the ring, or they are already through it at the
      // moment of handover and the splice cannot be judged.
      const START_Y=0.62;                       // just above the rim (Hh/2=0.23)
      // world units per screen px at the ring's depth (z=0 plane)
      const depth0=Math.abs(EYE0.z);
      const uPerPx=(2*TY*DIST)/Hh2;
      const FILL=240/256;             // drawn circle vs plane width
      const half=((T.fx-T.mx)/2)*uPerPx;
      male.position.set(-half, START_Y, 0);
      female.position.set( half, START_Y, 0);
      male.scale.setScalar((T.mr*2*uPerPx)/(0.62*FILL));
      female.scale.setScalar((T.fr*2*uPerPx)/(0.62*FILL));
      // The ring stays at the origin at a fixed depth, so its size and shape
      // are constant. The discs are placed ON the ring's plane (z=0) and the
      // CAMERA is panned so they land on the required screen position — that
      // satisfies both constraints instead of trading one for the other.
      // now drop them: same acceleration, from where they were handed over
      const fallDrop=(f*f)*4.2;
      male.position.y   -= fallDrop;
      female.position.y -= fallDrop;
    } else {
      male.position.set(-0.40,y,0);  female.position.set(0.40,y,0);
    }
    male.quaternion.copy(cam.quaternion); female.quaternion.copy(cam.quaternion);
    male.visible=female.visible=(fallK>0);
    rnd.render(scene,cam);
  };
  /* Convert a vertical screen offset (in px, relative to the ring centre)
     into world units on the ring's plane, so the 2D handover is exact. */
  GL.yFromScreen=function(dyPx, canvasH){
    if(!canvasH) return 0;
    // at the ring plane the view height spans 2*TY*DIST world units
    const worldPerPx=(2*TY*DIST)/canvasH;
    return -dyPx*worldPerPx;
  };
  /* px -> world units at the ring plane (same scale on both axes) */
  GL.unitsPerPx=function(canvasH){
    return canvasH ? (2*TY*DIST)/canvasH : 0;
  };
  GL.setRingRot=function(r){ grp.rotation.y=r; };
  GL.camPos=function(){ return {x:+cam.position.x.toFixed(3),
                                y:+cam.position.y.toFixed(3),
                                z:+cam.position.z.toFixed(3)}; };
  /* Project a mesh's centre to screen pixels, so the 2D layer can be aligned
     to wherever the 3D actually renders. */
  function projectToScreen(obj){
    const v=obj.position.clone().project(cam);
    return { x:(v.x*0.5+0.5)*cv.clientWidth,
             y:(-v.y*0.5+0.5)*cv.clientHeight };
  }
  /* Where the discs will appear at the first fall frame, and how wide. */
  GL.canvasH=0;
  GL.landing=function(){
    GL.canvasH=cv.clientHeight;
    const m=projectToScreen(male), f=projectToScreen(female);
    // on-screen radius: project a point one disc-radius to the side
    const probe=male.position.clone(); probe.x+=0.31*(male.scale.x||1);
    const pv=probe.project(cam);
    const px=(pv.x*0.5+0.5)*cv.clientWidth;
    return { male:m, female:f, radiusPx:Math.abs(px-m.x) };
  };
  GL.basis=function(){ return {RGT:RGT.toArray().map(v=>+v.toFixed(3)),
                               UPV:UPV.toArray().map(v=>+v.toFixed(3)),
                               DIST:+DIST.toFixed(3), TY:+TY.toFixed(4),
                               aspect:+cam.aspect.toFixed(3)}; };
  GL.renderer=rnd;                   // shared by scene 3's desk
  GL.clear=function(){ rnd.clear(); grp.visible=false; male.visible=female.visible=false; rnd.render(scene,cam); };
  GL.ready=true;
})();

/* ---------- scene 3: the school desk (full 3D) ---------- */
/* An inclined desktop seen from behind the rolling spheres. Low-poly clutter
   (pencils, books, glasses) sits sparsely at the edges, some half off-screen.
   The lyric words stand on the desk as 3D letters and are destroyed on impact. */
const DESK={ready:false};
(function initDesk(){
  if(typeof THREE==="undefined") return;
  const cv=document.getElementById("gl");
  if(!cv) return;

  const scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0xe8dcc6, 34, 86);
  const cam=new THREE.PerspectiveCamera(46, 16/9, 0.1, 100);

  const INCLINE=THREE.MathUtils.degToRad(13);     // the desk's slope
  const world=new THREE.Group();
  world.rotation.x=INCLINE;
  scene.add(world);

  // ---- the desktop ----
  // Paper style: flat unlit-ish colours, no textures anywhere. Form reads
  // through silhouette and facet shading alone.
  function deskTexture(){
    const N=1024;
    const c=document.createElement("canvas"); c.width=c.height=N;
    const x=c.getContext("2d");
    x.fillStyle="#d9c4a3"; x.fillRect(0,0,N,N);

    // Every mark is drawn 9 times at tile offsets, so anything crossing an
    // edge reappears on the opposite side and the tile is seamless.
    const wrap=(fn)=>{
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
        x.save(); x.translate(dx*N, dy*N); fn(); x.restore();
      }
    };

    // soft worn patches
    for(let i=0;i<12;i++){
      const px=Math.random()*N, py=Math.random()*N;
      const r=70+Math.random()*150;
      const dark=Math.random()>0.5;
      wrap(()=>{
        const g2=x.createRadialGradient(px,py,0,px,py,r);
        g2.addColorStop(0, dark?"rgba(168,142,110,.26)":"rgba(238,225,202,.30)");
        g2.addColorStop(1, "rgba(217,196,163,0)");
        x.fillStyle=g2;
        x.beginPath(); x.arc(px,py,r,0,7); x.fill();
      });
    }
    // a few scratches and old ink marks
    x.lineCap="round";
    for(let i=0;i<18;i++){
      const sx=Math.random()*N, sy=Math.random()*N;
      const ex=sx+(Math.random()-0.5)*150, ey=sy+(Math.random()-0.5)*85;
      const al=0.09+Math.random()*0.14;
      const col=Math.random()>0.72?"#5d7fa8":"#9d7a52";
      const lw=0.8+Math.random()*1.5;
      wrap(()=>{
        x.globalAlpha=al; x.strokeStyle=col; x.lineWidth=lw;
        x.beginPath(); x.moveTo(sx,sy); x.lineTo(ex,ey); x.stroke();
      });
    }
    x.globalAlpha=1;
    const t=new THREE.CanvasTexture(c);
    t.wrapS=t.wrapT=THREE.RepeatWrapping;
    // repeat scaled to the plane's aspect (26 x 150) so marks stay square
    t.repeat.set(2, 2*(150/26));
    if(THREE.SRGBColorSpace) t.colorSpace=THREE.SRGBColorSpace;
    t.anisotropy=8;
    return t;
  }
  const desk=new THREE.Mesh(
    new THREE.PlaneGeometry(30,150),
    new THREE.MeshLambertMaterial({map:deskTexture()}));
  desk.rotation.x=-Math.PI/2;
  world.add(desk);

  // floor below the desk: catches any sightline that passes its side edges
  const floor=new THREE.Mesh(
    new THREE.PlaneGeometry(260,260),
    new THREE.MeshLambertMaterial({color:0x8b7f73}));
  floor.rotation.x=-Math.PI/2;
  floor.position.y=-7.5;
  world.add(floor);

  // the desk's side walls, so it has visible thickness from the edges
  for(const sx of [-15,15]){
    const side=new THREE.Mesh(
      new THREE.BoxGeometry(0.5,1.1,150),
      new THREE.MeshLambertMaterial({color:0xc2ab8a, flatShading:true}));

  // ---- lights ----
  // flat, even light: paper cut-outs, not a product render

  key.position.set(4,8,5); scene.add(key);

  // ---- the lyric words, as REAL extruded 3D letters ----
  // Glyph outlines come from opentype.js (already loaded for the handwriting),
  // are converted to THREE.Shape paths, then extruded into solid letters.
  function glyphShapes(ch, font, size){
    const p=font.getPath(ch,0,0,size);
    // Collect each closed contour as its own point list, then decide which are
    // outlines and which are holes by signed area (winding).
    const contours=[]; let cur=null;
    const push=(x,y)=>{ if(cur) cur.push(new THREE.Vector2(x,-y)); };
    let lx=0, ly=0;
    for(const c of p.commands){
      if(c.type==="M"){ if(cur&&cur.length>2) contours.push(cur); cur=[]; push(c.x,c.y); lx=c.x; ly=c.y; }
      else if(c.type==="L"){ push(c.x,c.y); lx=c.x; ly=c.y; }
      else if(c.type==="Q"){
        for(let i=1;i<=6;i++){ const u=i/6, v=1-u;
          push(v*v*lx+2*v*u*c.x1+u*u*c.x, v*v*ly+2*v*u*c.y1+u*u*c.y); }
        lx=c.x; ly=c.y;
      }
      else if(c.type==="C"){
        for(let i=1;i<=8;i++){ const u=i/8, v=1-u;
          push(v*v*v*lx+3*v*v*u*c.x1+3*v*u*u*c.x2+u*u*u*c.x,
               v*v*v*ly+3*v*v*u*c.y1+3*v*u*u*c.y2+u*u*u*c.y); }
        lx=c.x; ly=c.y;
      }
      else if(c.type==="Z"){ if(cur&&cur.length>2) contours.push(cur); cur=null; }
    }
    if(cur&&cur.length>2) contours.push(cur);
    if(!contours.length) return [];

    const area=v=>{ let s2=0;
      for(let i=0;i<v.length;i++){ const q=v[(i+1)%v.length];
        s2+=(v[i].x*q.y - q.x*v[i].y); } return s2/2; };
    // biggest absolute area is the outer contour; the rest are holes
    contours.sort((m,n)=>Math.abs(area(n))-Math.abs(area(m)));
    const shape=new THREE.Shape(contours[0]);
    for(let i=1;i<contours.length;i++) shape.holes.push(new THREE.Path(contours[i]));
    return [shape];
  }

  function makeWord(txt, zPos, hex){

    const {txt,hex}=g.userData.pending||{};

    const font=HW.font;
    const SIZE=100;                       // font units for the outline
    const WORLD=9.0;                      // target width on the desk
    const adv=font.getAdvanceWidth(txt,SIZE);
    const k=WORLD/adv;
    const matFront=new THREE.MeshLambertMaterial({color:hex, flatShading:true});
    const matSide =new THREE.MeshLambertMaterial({color:0xbfae92, flatShading:true});
