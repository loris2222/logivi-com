<style>
  /* Single committed look: a dark stage the type is lit on. Not theme-reactive by design. */
  :root{
    --ink:#07080c;          /* stage */
    --cold:#8fa3c4;         /* early, unresolved */
    --cold-dim:#38415a;
    --warm:#ffb563;         /* home, fire */
    --warm-hot:#ff7a3d;
    --paper:#f4efe6;        /* the type */
    --muted:#6b7793;
    color-scheme: dark;
  }
  html,body{height:100%}
  body{
    margin:0; background:var(--ink); color:var(--paper);
    font-family:"Archivo",system-ui,-apple-system,sans-serif;
    overflow:hidden;
  }
  #stage{position:fixed; inset:0; background:var(--ink)}
  canvas{display:block; width:100%; height:100%}

  /* ---- gate: audio needs a user gesture ---- */
  #gate{
    position:fixed; inset:0; z-index:20; display:grid; place-items:center;
    background:radial-gradient(130% 100% at 50% 40%, #121726 0%, var(--ink) 70%);
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
  }
  .g-in{text-align:center; max-width:34rem; display:flex; flex-direction:column; gap:1.6rem; align-items:center}
  .g-ttl{
    font-family:"Fraunces",Georgia,serif; font-weight:300; font-size:clamp(2.6rem,9vw,5.2rem);
    line-height:.95; letter-spacing:-.02em; margin:0; text-wrap:balance;
  }
  .g-ttl em{font-style:normal; font-weight:900; color:var(--warm)}
  .g-sub{margin:0; color:var(--muted); font-size:.95rem; letter-spacing:.14em; text-transform:uppercase}
  .g-btn{
    appearance:none; border:1px solid var(--warm); background:transparent; color:var(--warm);
    font-family:"Archivo",sans-serif; font-weight:600; font-size:1rem; letter-spacing:.1em;
    text-transform:uppercase; padding:.95rem 2.4rem; border-radius:999px; cursor:pointer;
    transition:background .25s,color .25s;
  }
  .g-btn:hover,.g-btn:focus-visible{background:var(--warm); color:var(--ink)}
  .g-btn:focus-visible{outline:2px solid var(--paper); outline-offset:3px}
  .g-note{margin:0; color:#505a70; font-size:.78rem}

  /* ---- transport ---- */
  #hud{
    position:fixed; left:0; right:0; bottom:0; z-index:15;
    display:flex; align-items:center; gap:.9rem;
    padding:.75rem max(16px,env(safe-area-inset-left,0px));
    padding-bottom:calc(.75rem + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to top,rgba(7,8,12,.92),rgba(7,8,12,0));
    opacity:0; transition:opacity .3s; pointer-events:none;
  }
  #hud.on{opacity:1; pointer-events:auto}
  #hud:hover,#hud:focus-within{opacity:1}
  .t-btn{
    appearance:none; border:0; background:none; color:var(--paper); cursor:pointer;
    font-size:1.1rem; line-height:1; padding:.4rem .5rem; border-radius:6px; min-width:2.2rem;
  }
  .t-btn:focus-visible{outline:2px solid var(--warm); outline-offset:2px}
  #scrub{flex:1; min-width:0; accent-color:var(--warm); cursor:pointer; height:4px}
  #time{
    font-variant-numeric:tabular-nums; font-size:.8rem; color:var(--muted);
    letter-spacing:.06em; white-space:nowrap;
  }
  #cap{
    position:fixed; left:50%; transform:translateX(-50%); bottom:3.6rem; z-index:14;
    color:var(--muted); font-size:.82rem; letter-spacing:.08em; text-align:center;
    padding:0 1rem; pointer-events:none; opacity:0; transition:opacity .3s;
    max-width:min(90vw,40rem);
  }
  #hud.on ~ #cap{opacity:1}
  @media (prefers-reduced-motion:reduce){ .g-btn{transition:none} }
</style>

  // timeline: appears 1.5s, rushes right-to-left (travelling back)
  const tl=inv(t,1.45,1.95), ret=inv(t,1.9,2.75);
  if(tl>0){
    const y=h*0.60;
    ctx.save(); ctx.globalAlpha=tl*(1-inv(t,2.78,3.1));
    ctx.strokeStyle=P.coldDim; ctx.lineWidth=Math.max(1,1.6*S);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
    // ticks stream rightward => camera moves left (into the past)
    const travel=easeIO(ret)*1.0;
    const gap=74*S;
    ctx.fillStyle=P.coldDim;
    for(let i=-2;i<w/gap+3;i++){
      const x=((i*gap + travel*w*1.9)%(w+gap*3))-gap;
      const big=(i%4===0);
      ctx.globalAlpha=tl*(1-inv(t,2.78,3.1))*(big?.9:.45);
      ctx.fillRect(x, y-(big?11:6)*S, Math.max(1,1.6*S), (big?22:12)*S);
    }
    ctx.restore();
  }
  // "Long ago," arrives after the rewind, stretching open
  const la=inv(t,2.28,2.52);
  if(la>0){
    const stretch=easeOut(inv(t,2.30,2.90));
    drawSpaced("Long", w/2-62*S, h*0.44, 56*S, stretch*22*S,
      {weight:300, face:DISPLAY, alpha:la, color:P.paper});
    const ag=inv(t,2.66,2.86);
    if(ag>0) drawWord("ago,", w/2+92*S, h*0.44, 56*S,
      {weight:300, face:DISPLAY, alpha:ag, color:P.paper});
  }
}

/* 2 ── 4.02-6.54  birth of the two characters from j(just) and i(playing) */
function s2(t){
  const R=revealLine(2,t,{size:44,weight:400,face:DISPLAY,cy:h*0.50,color:P.paper,fade:0.12,rise:12});
  if(!R) return;
  const fade=1-inv(t,7.05,7.45);
  if(fade<=0) return;
  ctx.save(); ctx.globalAlpha=fade;
  // locate the dotted glyphs
  const ij=R.items.find(o=>o.word.w==="just");
  const ip=R.items.find(o=>o.word.w==="playing");
  const dotY=R.cy-R.px*0.72;
  // male grows on "just"
  if(ij){
    const g=inv(t,4.68,5.30);
    CH.m.x=ij.x+R.px*0.075; CH.m.y=dotY;
    CH.m.r=lerp(3.5*S, 26*S, easeOut(g)); CH.m.vis=inv(t,4.68,4.86)*fade;
    CH.m.face=inv(t,4.95,5.35);
  }
  // female grows on "playing"
  if(ip){
    const g=inv(t,5.60,6.16);
    CH.f.x=ip.x+R.px*0.355; CH.f.y=dotY;
    CH.f.r=lerp(3.5*S, 25*S, easeOut(g)); CH.f.vis=inv(t,5.60,5.78)*fade;
    CH.f.face=inv(t,5.86,6.26);
  }
  // bounce once the line is complete (6.54+)
  const b=inv(t,6.45,7.05);
  if(b>0){
    const hop=Math.abs(Math.sin(b*Math.PI*2.6))*(1-b*0.45);
    CH.m.y=dotY-hop*34*S; CH.f.y=dotY-hop*34*S*0.82;
  }
  drawChar(CH.m,t,{color:P.cold});
  drawChar(CH.f,t,{color:P.warm}); femaleMark(CH.f);
  ctx.restore();
}

/* 3 ── 7.50-10.60  Worries/Sadness struck through & shattered BY the characters */
function s3(t){
  const beats=[
    {word:"Worries,", ws:7.50, no:8.50, cy:h*0.34},
    {word:"Sadness,", ws:9.44, no:10.46, cy:h*0.66}
  ];
  for(const b of beats){
    const app=inv(t,b.ws,b.ws+0.26);
    const kill=inv(t,b.no,b.no+0.55);
    if(app<=0) continue;
    const px=64*S;
    setFont(px,{weight:800,face:SANS});
    const wd=ctx.measureText(b.word).width;
    if(kill<0.12){
      drawWord(b.word,w/2,b.cy,px,{weight:800,alpha:app*(1-kill*6),color:P.cold});
    } else {
      shatter(b.word,w/2,b.cy,px,clamp((kill-0.12)/0.88,0,1),{weight:800,color:P.cold,alpha:app});
    }
    strike(w/2,b.cy,wd,inv(t,b.no-0.10,b.no+0.18),P.hot);
    // the "no"
    const nA=inv(t,b.no,b.no+0.18);
    if(nA>0) drawWord("no", w/2+wd/2+74*S, b.cy, px*0.86,
      {weight:800, alpha:nA*(1-inv(t,b.no+0.75,b.no+1.0)), color:P.hot, glow:P.hot, glowSize:20});
  }
  // characters steam across, causing the strikes
  const run1=inv(t,7.30,8.80), run2=inv(t,9.24,10.76);
  CH.m.vis=1; CH.f.vis=1; CH.m.r=26*S; CH.f.r=25*S; CH.m.face=1; CH.f.face=1;
  if(t<9.1){
    CH.m.x=lerp(-60*S,w+60*S,easeIO(run1)); CH.m.y=h*0.40;
    CH.f.x=CH.m.x-74*S; CH.f.y=h*0.40+6*S;
  } else {
    CH.m.x=lerp(-60*S,w+60*S,easeIO(run2)); CH.m.y=h*0.62;
    CH.f.x=CH.m.x-74*S; CH.f.y=h*0.62+6*S;
  }
  CH.m.roll=t*6; CH.f.roll=t*6;
  drawChar(CH.m,t,{color:P.cold}); drawChar(CH.f,t,{color:P.warm}); femaleMark(CH.f);
}

/* 4 ── 11.70-14.20  ski-jump ramp; characters roll down; "!" launches them apart */
function s4(t){
  const ws=wordsOf(5);
  // ramp curve: y = rampY(x)
  const x0=-0.05*w, x1=1.05*w;
  const rampY=(x)=>{ const u=clamp((x-x0)/(x1-x0),0,1);
    return h*0.30 + (h*0.46)*Math.pow(u,1.75) - (h*0.12)*Math.pow(u,6); };
  const px=34*S;
  // words laid along the ramp as it appears
  setFont(px,{weight:700,face:SANS});
  let tot=0; const wd=ws.map(o=>{const m=ctx.measureText(o.w).width+16*S; tot+=m; return m;});
  let acc=0;
  ctx.save();
  for(let i=0;i<ws.length;i++){
    const a=inv(t,ws[i].s,ws[i].s+0.10);
    const u=acc/tot; acc+=wd[i];
    const x=lerp(w*0.04,w*0.94,u), y=rampY(x);
    const dx=2*S, slope=(rampY(x+dx)-rampY(x-dx))/(2*dx);
    if(a>0){
      ctx.save(); ctx.globalAlpha=a; ctx.translate(x,y-20*S); ctx.rotate(Math.atan(slope));
      ctx.fillStyle = ws[i].w==="go!"?P.hot:P.paper;
      setFont(px,{weight:ws[i].w==="go!"?900:700,face:SANS});
      ctx.textAlign="left"; ctx.textBaseline="alphabetic";
      ctx.fillText(ws[i].w,0,0); ctx.restore();
    }
  }
  // ramp stroke
  ctx.globalAlpha=inv(t,11.70,12.1)*0.5;
  ctx.strokeStyle=P.coldDim; ctx.lineWidth=Math.max(1.4,2.4*S);
  ctx.beginPath();
  for(let x=w*0.02;x<=w*0.98;x+=8*S){ const y=rampY(x); x===w*0.02?ctx.moveTo(x,y):ctx.lineTo(x,y); }
  ctx.stroke(); ctx.restore();

  // characters roll down the ramp, then launch on "go!" (14.10)
  const roll=inv(t,11.95,14.05), launch=inv(t,14.10,15.5);
  CH.m.vis=1; CH.f.vis=1; CH.m.r=26*S; CH.f.r=25*S;
  if(launch<=0){
    const x=lerp(w*0.05,w*0.92,easeIn(roll));
    CH.m.x=x; CH.m.y=rampY(x)-26*S;
    CH.f.x=x-66*S; CH.f.y=rampY(x-66*S)-25*S;
    CH.m.roll=roll*22; CH.f.roll=roll*22;
  } else {
    // two separate arcs
    const L=launch, g=1200*S;
    const bx=w*0.92, by=rampY(w*0.92)-26*S;
    CH.m.x=bx+L*520*S;          CH.m.y=by-(L*560*S)+0.5*g*L*L;
    CH.f.x=bx+L*300*S;          CH.f.y=by-(L*760*S)+0.5*g*L*L*0.82;
    CH.m.roll+=0.5; CH.f.roll-=0.42;
    CH.m.vis=1-inv(t,15.0,15.5); CH.f.vis=CH.m.vis;
  }
  // the exclamation that launches them
  const ex=inv(t,14.10,14.22);
  if(ex>0 && launch<0.6){
    drawWord("!", w*0.955, rampY(w*0.955)-46*S, 86*S*(1+ex*0.3),
      {weight:900,color:P.hot,glow:P.hot,glowSize:30,alpha:ex*(1-inv(t,14.9,15.4))});
  }
  drawChar(CH.m,t,{color:P.cold}); drawChar(CH.f,t,{color:P.warm}); femaleMark(CH.f);
}

/* 5 ── 15.52-17.88  characters gone; "And so, you, do." alone; "do." holds 1.38s */
function s5(t){
  CH.m.vis=0; CH.f.vis=0;
  const R=revealLine(6,t,{size:58,weight:300,face:DISPLAY,cy:h*0.5,
    color:P.paper,fade:0.16,rise:14,alpha:1-inv(t,17.55,17.92)});
  // "do." swells on its 1.38s hold
  const d=inv(t,16.50,17.60);
  if(R&&d>0){
    const it=R.items.find(o=>o.word.w==="do.");
    if(it){
      ctx.save(); ctx.globalAlpha=(1-inv(t,17.55,17.92))*0.5*(1-d);
      drawWord("do.", it.cx, R.cy-R.px*0.33, R.px*(1+d*0.5),
        {weight:300,face:DISPLAY,color:P.warm,alpha:(1-d)*0.6,glow:P.warm,glowSize:26});
      ctx.restore();
    }

}

/* 6 ── 17.88-19.92  male alone on the i of "without"; the i stretches up = standing */
function s6(t){
  CH.f.vis=0;
  const R=revealLine(7,t,{size:46,weight:400,face:DISPLAY,cy:h*0.56,
    color:P.paper,fade:0.13,rise:10,alpha:1-inv(t,19.95,20.30)});
  if(!R) return;
  const it=R.items.find(o=>o.word.w==="without");
  if(!it) return;
  const stand=easeOut(inv(t,18.55,19.45));
  // redraw "without" with a stretched i-stem
  const dotX=it.x+R.px*0.30;
  const baseY=R.cy, topY=baseY-R.px*0.66-stand*86*S;
  ctx.save(); ctx.globalAlpha=1-inv(t,19.95,20.30);
  ctx.strokeStyle=P.cold; ctx.lineWidth=Math.max(2,R.px*0.085); ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(dotX,baseY-R.px*0.08); ctx.lineTo(dotX,topY+10*S); ctx.stroke();
  ctx.restore();
  CH.m.x=dotX; CH.m.y=topY; CH.m.r=lerp(12*S,27*S,stand);
  CH.m.vis=inv(t,18.40,18.62)*(1-inv(t,19.95,20.30)); CH.m.roll=0; CH.m.face=1;
  drawChar(CH.m,t,{color:P.cold});
}

/* 7 ── 20.30-22.02  he stays put, looks up then down on the rhythm */
function s7(t){
  CH.f.vis=0;
  const ws=wordsOf(8), px=54*S;
  const L=layout(ws,px,{weight:700,face:SANS},0.32);
  let x=w/2-L.total/2;
  ctx.save(); ctx.textBaseline="middle";
  for(let i=0;i<ws.length;i++){
    const a=inv(t,ws[i].s,ws[i].s+0.11)*(1-inv(t,22.05,22.35));
    const isUp=ws[i].w==="up,", isDn=ws[i].w==="down,";
    if(a>0){
      const off=isUp?-18*S:isDn?18*S:0;
      drawWord(ws[i].w, x+L.widths[i]/2, h*0.60+off, px,
        {weight:isUp||isDn?900:700, alpha:a, color:isUp||isDn?P.warm:P.paper});
    }
    x+=L.widths[i]+L.sp;
  }
  ctx.restore();
  // he looks up / down
  CH.m.x=w/2; CH.m.y=h*0.32; CH.m.r=30*S; CH.m.vis=1-inv(t,22.05,22.4); CH.m.roll=0;
  const up=inv(t,20.82,21.05)-inv(t,21.20,21.45);
  const dn=inv(t,21.66,21.88)-inv(t,22.0,22.2);
  CH.m.y=h*0.34 + (-10*S*up) + (14*S*dn);
  drawChar(CH.m,t,{color:P.cold, smile:1});
  // eye-line
  ctx.save(); ctx.globalAlpha=(up*0.5+dn*0.5)*(1-inv(t,22.05,22.4))*0.35;
  ctx.strokeStyle=P.warm; ctx.setLineDash([4*S,7*S]); ctx.lineWidth=Math.max(1,1.6*S);
  ctx.beginPath(); ctx.moveTo(w/2,CH.m.y);
  ctx.lineTo(w/2, up>dn? h*0.14 : h*0.74); ctx.stroke(); ctx.restore();
}

/* 8 ── 22.11-24.05  smear + actual sweat on him; "frown." curves down */
function s8(t){
  CH.f.vis=0;
  const ws=wordsOf(9), px=46*S;
  const L=layout(ws,px,{weight:700,face:SANS},0.3);
  let x=w/2-L.total/2;
  for(let i=0;i<ws.length;i++){
    const o=ws[i], a=inv(t,o.s,o.s+0.1)*(1-inv(t,24.05,24.35));
    if(a>0){
      if(o.w==="running"){            // smear
        for(let k=4;k>=0;k--){
          drawWord(o.w, x+L.widths[i]/2 - k*9*S, h*0.66, px,
            {weight:700, alpha:a*(k?0.10:1), color:P.paper});
        }
      } else if(o.w==="frown."){      // baseline curves into a frown
        setFont(px,{weight:800,face:SANS});
        const chs=[...o.w]; let tw=0; const cw=chs.map(c=>{const m=ctx.measureText(c).width;tw+=m;return m;});
        let cx2=x; const bend=easeOut(inv(t,23.52,24.0));
        ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=P.cold;
        ctx.textAlign="left"; ctx.textBaseline="middle";
        for(let k=0;k<chs.length;k++){
          const u=(cx2+cw[k]/2-x)/tw-0.5;
          const dy=bend*Math.pow(u*2,2)*-26*S + bend*13*S;
          ctx.save(); ctx.translate(cx2+cw[k]/2, h*0.66+dy); ctx.rotate(bend*u*0.55);
          ctx.fillText(chs[k],-cw[k]/2,0); ctx.restore();
          cx2+=cw[k];
        }
        ctx.restore();
      } else {
        drawWord(o.w, x+L.widths[i]/2, h*0.66, px, {weight:700, alpha:a, color:P.paper});
      }
    }
    x+=L.widths[i]+L.sp;
  }
  // him, sweating, frowning
  CH.m.x=w/2; CH.m.y=h*0.32; CH.m.r=30*S; CH.m.vis=1-inv(t,24.05,24.4); CH.m.roll=0;
  const shake=Math.sin(t*34)*2.2*S*inv(t,22.3,22.6);
  CH.m.x+=shake;
  drawChar(CH.m,t,{color:P.cold, smile:-1});
  // sweat droplets
  const sw=inv(t,22.40,24.0);
  if(sw>0){
    ctx.save();
    for(let k=0;k<4;k++){
      const ph=((t-22.4)*1.25+k*0.27)%1;
      if(ph<0.02) continue;
      const sx=CH.m.x+(k%2?1:-1)*(16+k*5)*S, sy=CH.m.y-10*S+ph*78*S;
      ctx.globalAlpha=(1-ph)*0.85*(1-inv(t,24.0,24.35));
      ctx.fillStyle=P.cold;
      ctx.beginPath(); ctx.ellipse(sx,sy,3.1*S,4.6*S,0,0,7); ctx.fill();
    }
    ctx.restore();
  }
}

/* 9 ── 24.07-25.03  reprise of "And so, you, do." harder */
function s9(t){
  CH.m.vis=0; CH.f.vis=0;
  const a=1-inv(t,25.55,26.35);
  revealLine(10,t,{size:62,weight:600,face:DISPLAY,cy:h*0.5,
    color:P.cold,fade:0.09,rise:6,alpha:a});
}

/* 10 ── 26.45-30.85  the mountain: text IS the terrain, both roll it together */
function s10(t){
  const ws=[...wordsOf(11),...wordsOf(12)];
  // terrain from the words: up then down
  const terrY=(x)=>{ const u=clamp(x/w,0,1);
    return h*0.62 - Math.sin(u*Math.PI)*h*0.30 + Math.sin(u*Math.PI*2)*h*0.035; };
  const px=30*S;
  setFont(px,{weight:700,face:SANS});
  let tot=0; const wd=ws.map(o=>{const m=ctx.measureText(o.w).width+15*S; tot+=m; return m;});
  let acc=0;
  const gone=1-inv(t,31.0,31.5);
  ctx.save();
  for(let i=0;i<ws.length;i++){
    const a=inv(t,ws[i].s,ws[i].s+0.1)*gone;
    const u=acc/tot; acc+=wd[i];
    const x=lerp(w*0.03,w*0.95,u), y=terrY(x);
    if(a>0){
      const dx=2*S, slope=(terrY(x+dx)-terrY(x-dx))/(2*dx);
      ctx.save(); ctx.globalAlpha=a; ctx.translate(x,y-13*S); ctx.rotate(Math.atan(slope));
      const hot = ws[i].w==="up,"||ws[i].w==="down"||ws[i].w==="found";
      ctx.fillStyle=hot?P.warm:P.paper;
      setFont(px,{weight:hot?900:700,face:SANS});
      ctx.textAlign="left"; ctx.textBaseline="alphabetic"; ctx.fillText(ws[i].w,0,0);
      ctx.restore();
    }
  }
  // terrain line
  ctx.globalAlpha=0.42*gone; ctx.strokeStyle=P.coldDim; ctx.lineWidth=Math.max(1.4,2.2*S);
  ctx.beginPath();
  for(let x=0;x<=w;x+=7*S){ const y=terrY(x); x===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
  ctx.stroke(); ctx.restore();

  // he starts alone; she appears on the i of "miles" (27.05) and they roll together
  const prog=inv(t,26.50,30.85);
  const stop=inv(t,30.31,30.85);
  const px2=lerp(w*0.03,w*0.95,easeIO(prog)*(1-stop*0.02));
  CH.m.x=px2; CH.m.y=terrY(px2)-27*S; CH.m.r=27*S; CH.m.vis=gone; CH.m.roll=prog*26;
  const fx=px2-62*S;
  CH.f.x=fx; CH.f.y=terrY(fx)-26*S; CH.f.r=26*S;
  CH.f.vis=inv(t,27.05,27.45)*gone; CH.f.roll=prog*26;
  drawChar(CH.m,t,{color:P.cold}); drawChar(CH.f,t,{color:P.warm}); femaleMark(CH.f);
}

/* 11 ── 30.91-33.67  flat roll, huge text passing, parallax heart behind "love." */
function s11(t){
  const gone=1-inv(t,33.70,34.0);
  const groundY=h*0.72;
  // heart starts growing under "you," (32.23) so it has ~1.4s
  const hb=inv(t,32.23,33.45);
  if(hb>0){
    ctx.save();
    ctx.globalAlpha=1;
    const hg=ctx.createRadialGradient(w*0.5,h*0.46,0,w*0.5,h*0.46,Math.min(w,h)*0.44);
    hg.addColorStop(0,`rgba(255,122,61,${0.30*hb*gone})`);
    hg.addColorStop(0.55,`rgba(255,122,61,${0.10*hb*gone})`);
    hg.addColorStop(1,"rgba(255,122,61,0)");
    ctx.fillStyle=hg; ctx.fillRect(0,0,w,h);
    ctx.globalAlpha=hb*0.17*gone;
    ctx.fillStyle=P.hot;
    const sc=lerp(0.35,1.15,easeOut(hb))*Math.min(w,h)*0.0026;
    const beat=1+0.05*Math.sin(t*7.5);
    ctx.translate(w*0.5,h*0.56); ctx.scale(sc*beat,sc*beat);
    ctx.beginPath();
    ctx.moveTo(0,52);
    ctx.bezierCurveTo(-78,-14,-50,-84,0,-44);
    ctx.bezierCurveTo(50,-84,78,-14,0,52);
    ctx.fill(); ctx.restore();
  }
  // giant words scroll right-to-left
  const ws=wordsOf(13), px=96*S;
  setFont(px,{weight:300,face:DISPLAY});
  let tot=0; const wd=ws.map(o=>{const m=ctx.measureText(o.w).width+40*S; tot+=m; return m;});
  const scroll=easeIO(inv(t,30.91,34.30));
  let x=w*1.02 - scroll*(tot+w*0.30);
  ctx.save(); ctx.textBaseline="middle"; ctx.textAlign="left";
  for(let i=0;i<ws.length;i++){
    const a=inv(t,ws[i].s-0.3,ws[i].s)*gone;
    if(a>0 && x<w+60*S && x+wd[i]>-60*S){
      const love=ws[i].w==="love.";
      ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=love?P.warm:P.paper;
      setFont(px,{weight:love?600:300,face:DISPLAY});
      if(love) shadow(P.warm,28);
      ctx.fillText(ws[i].w,x,h*0.44); noShadow(); ctx.restore();
    }
    x+=wd[i];
  }
  ctx.restore();
  // both roll flat along the ground
  CH.m.r=27*S; CH.f.r=26*S; CH.m.vis=gone; CH.f.vis=gone;
  const p=inv(t,30.91,33.67);
  CH.m.x=lerp(w*0.18,w*0.62,p); CH.m.y=groundY-27*S; CH.m.roll=p*20;
  CH.f.x=CH.m.x-62*S;           CH.f.y=groundY-26*S; CH.f.roll=p*20;
  ctx.save(); ctx.globalAlpha=0.35*gone; ctx.strokeStyle=P.coldDim;
  ctx.lineWidth=Math.max(1.3,2*S); ctx.beginPath();
  ctx.moveTo(0,groundY); ctx.lineTo(w,groundY); ctx.stroke(); ctx.restore();
  drawChar(CH.m,t,{color:P.cold}); drawChar(CH.f,t,{color:P.warm}); femaleMark(CH.f);
}

/* 12 ── 33.69-36.71  they roll into the house; house persists after */
function s12(t){
  const groundY=h*0.72;
  HOUSE.vis=inv(t,33.75,34.55); HOUSE.x=w*0.72; HOUSE.y=groundY; HOUSE.s=1;
  HOUSE.door=inv(t,34.25,34.9)-inv(t,35.55,36.1);
  HOUSE.light=inv(t,35.2,36.3);
  // "A place called home," rises above
  revealLine(14,t,{size:44,weight:300,face:DISPLAY,cy:h*0.30,
    color:P.paper,fade:0.16,rise:12,alpha:1-inv(t,36.75,37.3)});
  ctx.save(); ctx.globalAlpha=0.35; ctx.strokeStyle=P.coldDim;
  ctx.lineWidth=Math.max(1.3,2*S); ctx.beginPath();
  ctx.moveTo(0,groundY); ctx.lineTo(w,groundY); ctx.stroke(); ctx.restore();
  drawHouse(t);
  // roll in through the door, then vanish inside
  const p=inv(t,34.30,35.45);
  const doorX=HOUSE.x+ (150*S)/2 - 42*S - 20*S + 21*S;
  CH.m.r=27*S; CH.f.r=26*S;
  CH.m.x=lerp(w*0.30,doorX,easeIO(p)); CH.m.y=groundY-27*S; CH.m.roll=p*18;
  CH.f.x=CH.m.x-62*S; CH.f.y=groundY-26*S; CH.f.roll=p*18;
  const vis=(1-inv(t,35.1,35.5));
  CH.m.vis=vis; CH.f.vis=(1-inv(t,35.25,35.62));
  drawChar(CH.f,t,{color:P.warm}); femaleMark(CH.f);
  drawChar(CH.m,t,{color:P.cold});
}

/* 13 ── 37.39-44.73  past / best / last — depth, no characters. House stays faint. */
function s13(t){
  CH.m.vis=0; CH.f.vis=0;
  HOUSE.vis=0.20; HOUSE.x=w*0.5; HOUSE.y=h*0.99; HOUSE.s=0.8; HOUSE.light=0.22; HOUSE.door=0; drawHouse(t);
  const rows=[
    {l:15, key:"past", cy:h*0.34, mode:"recede"},
    {l:16, key:"best", cy:h*0.50, mode:"grow"},
    {l:17, key:"last", cy:h*0.66, mode:"hold"}
  ];
  for(const r of rows){
    const ws=wordsOf(r.l); if(!ws.length) continue;
    const out = 1-inv(t, r.l===17?44.60:ws[ws.length-1].e+1.4, r.l===17?45.10:ws[ws.length-1].e+2.0);
    if(out<=0) continue;
    const px=40*S;
    const L=layout(ws,px,{weight:400,face:DISPLAY},0.3);
    let x=w/2-L.total/2;
    for(let i=0;i<ws.length;i++){
      const o=ws[i], a=inv(t,o.s,o.s+0.13)*out;
      if(a<=0){ x+=L.widths[i]+L.sp; continue; }
      let sc=1, al=a, col=P.paper;
      if(o.w===r.key+"," || o.w===r.key){
        const k=inv(t,o.s,o.s+0.75);
        if(r.mode==="recede"){ sc=lerp(1,0.52,easeOut(k)); al=a*lerp(1,0.35,k); col=P.muted; }
        if(r.mode==="grow"){ sc=lerp(1,1.5,easeOut(k)); col=P.warm; }
        if(r.mode==="hold"){ sc=lerp(1,1.18,easeOut(k)); col=P.warm; }
      }
      ctx.save(); ctx.globalAlpha=al; ctx.translate(x+L.widths[i]/2, r.cy); ctx.scale(sc,sc);
      ctx.fillStyle=col; setFont(px,{weight:400,face:DISPLAY});
      ctx.textAlign="center"; ctx.textBaseline="middle";
      if(col===P.warm) shadow(P.warm,16);
      ctx.fillText(o.w,0,0); noShadow(); ctx.restore();
      x+=L.widths[i]+L.sp;
    }
  }
}

/* 14 ── 45.75-48.53  CHORUS — words fly INTO the house */
function s14(t){
  CH.m.vis=0; CH.f.vis=0;
  HOUSE.vis=1; HOUSE.x=w*0.5; HOUSE.y=h*0.78; HOUSE.s=1.05;
  HOUSE.light=0.55+0.45*env("rms",t); HOUSE.door=inv(t,45.6,46.1);

  for(const o of ws){

    if(a<=0) continue;
    const fly=inv(t,o.s+0.10,o.e+0.55);            // travel into the door
    const px=lerp(86,26,easeIn(fly))*S;
    const sx=w/2, sy=h*0.34;
    const dx=HOUSE.x, dy=HOUSE.y-52*S;

/* 15 ── 48.53-61.25  sustained chorus; characters return for "share with you" */
function s15(t){
  HOUSE.vis=1; HOUSE.x=w*0.5; HOUSE.y=h*1.02; HOUSE.s=0.78;
  HOUSE.light=0.5+0.5*env("rms",t); HOUSE.door=0.25; drawHouse(t);
  const rows=[{l:19,cy:h*0.20},{l:20,cy:h*0.34},{l:21,cy:h*0.48}];
  for(const r of rows){
    const ws=wordsOf(r.l); if(!ws.length) continue;
    const px=(r.l===20?36:42)*S;
    const L=layout(ws,px,{weight:400,face:DISPLAY},0.3);
    let x=w/2-L.total/2;
    for(let i=0;i<ws.length;i++){
      const o=ws[i];
      let a=inv(t,o.s,o.s+0.13)*(1-inv(t,61.05,61.75));
      if(a<=0){ x+=L.widths[i]+L.sp; continue; }
      let cx2=x+L.widths[i]/2, cy2=r.cy, sc=1, col=P.paper;
      if(o.w==="Laugh"){                               // scatter outward
        const k=inv(t,56.45,57.6);
        ctx.save(); ctx.globalAlpha=a;
        setFont(px,{weight:700,face:DISPLAY});
        const chs=[...o.w]; let tw=0; const cw=chs.map(c=>{const m=ctx.measureText(c).width;tw+=m;return m;});
        let lx=x; ctx.textAlign="left"; ctx.textBaseline="middle"; ctx.fillStyle=P.warm;
        for(let q=0;q<chs.length;q++){
          const sd=(q*9301+49297)%233280/233280;
          ctx.save(); ctx.globalAlpha=a*(1-k*0.55);
          ctx.translate(lx+cw[q]/2 + (sd-0.5)*k*14*S, cy2 - k*88*S - (sd)*k*26*S);
          ctx.rotate((sd-0.5)*k*0.7); ctx.fillText(chs[q],-cw[q]/2,0); ctx.restore();
          lx+=cw[q];
        }
        ctx.restore(); x+=L.widths[i]+L.sp; continue;
      }
      if(o.w==="share"){ col=P.warm; sc=1+0.18*inv(t,59.23,60.1); }
      if(o.w==="last,"||o.w==="last") col=P.warm;
      ctx.save(); ctx.globalAlpha=a; ctx.translate(cx2,cy2); ctx.scale(sc,sc);
      ctx.fillStyle=col; setFont(px,{weight:400,face:DISPLAY});
      ctx.textAlign="center"; ctx.textBaseline="middle";
      if(col===P.warm) shadow(P.warm,18);
      ctx.fillText(o.w,0,0); noShadow(); ctx.restore();
      x+=L.widths[i]+L.sp;
    }
  }
  // characters return on "share with you" (59.23-61.25)
  const ret=inv(t,59.23,59.9), fade=1-inv(t,61.1,61.8);
  if(ret>0){
    CH.m.r=26*S; CH.f.r=25*S; CH.m.vis=ret*fade; CH.f.vis=ret*fade;
    CH.m.roll=0; CH.f.roll=0;
    const close=inv(t,60.23,61.25);
    CH.m.x=lerp(w*0.34,w*0.455,easeOut(close)); CH.m.y=h*0.70;
    CH.f.x=lerp(w*0.66,w*0.545,easeOut(close)); CH.f.y=h*0.70;
    drawChar(CH.m,t,{color:P.cold,glow:P.warm});
    drawChar(CH.f,t,{color:P.warm,glow:P.warm}); femaleMark(CH.f);
  } else { CH.m.vis=0; CH.f.vis=0; }
}

function s17(t){

/* 18 ── 67.50-71.90  fire: i-dot is the flame; "waning" shrinks then catches */
function s18(t){
  CH.m.face=0; CH.f.face=0;
  const fire=inv(t,67.66,68.6);
  const fx=w/2, fy=h*0.52;
  // "fire" with its dot as flame
  if(fire>0){
    const px=92*S;
    setFont(px,{weight:900,face:DISPLAY});
    const flick=1+0.16*Math.sin(t*19)+0.1*env("mid",t);
    ctx.save(); ctx.globalAlpha=(1-inv(t,71.95,72.3));
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle=P.warm; shadow(P.hot, 40*flick);
    ctx.fillText("fire", fx, fy); noShadow();
    // flame on the i
    const g=ctx.createRadialGradient(fx+px*0.075, fy-px*0.46, 0, fx+px*0.075, fy-px*0.46, 34*S*flick);
    g.addColorStop(0,"rgba(255,235,170,.95)"); g.addColorStop(.5,"rgba(255,122,61,.6)");
    g.addColorStop(1,"rgba(255,122,61,0)");
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(fx+px*0.075, fy-px*0.46, 34*S*flick,0,7); ctx.fill();
    ctx.restore();
  }
  // "that burns us" small beneath
  for(const o of wordsOf(24)){
    if(o.w==="The"||o.w==="fire") continue;
    const a=inv(t,o.s,o.s+0.14)*(1-inv(t,71.95,72.3));
    if(a>0){
      const ws=wordsOf(24).filter(q=>q.w!=="The"&&q.w!=="fire");
      const idx=ws.indexOf(o), px=30*S;
      const L=layout(ws,px,{weight:400,face:DISPLAY},0.3);
      let x=w/2-L.total/2; for(let q=0;q<idx;q++) x+=L.widths[q]+L.sp;
      drawWord(o.w,x+L.widths[idx]/2,h*0.68,px,{weight:400,face:DISPLAY,alpha:a,color:P.muted});
    }
  }
  // "Isn't waning at all" — waning shrinks, then CATCHES and holds
  const ws2=wordsOf(25), px2=42*S;
  const L2=layout(ws2,px2,{weight:600,face:DISPLAY},0.3);
  let x2=w/2-L2.total/2;
  for(let i=0;i<ws2.length;i++){
    const o=ws2[i], a=inv(t,o.s,o.s+0.12)*(1-inv(t,71.95,72.35));
    if(a>0){
      let sc=1, col=P.paper;
      if(o.w==="waning"){
        const shrink=inv(t,70.42,70.95), katch=inv(t,70.95,71.3);
        sc=lerp(1,0.55,easeOut(shrink));
        sc=lerp(sc, 1.22, easeOut(katch)*back(clamp(katch,0,1)));
        col=katch>0.25?P.warm:P.muted;
      }
      if(o.w==="all") col=P.warm;
      ctx.save(); ctx.globalAlpha=a; ctx.translate(x2+L2.widths[i]/2,h*0.84); ctx.scale(sc,sc);
      ctx.fillStyle=col; setFont(px2,{weight:600,face:DISPLAY});
      ctx.textAlign="center"; ctx.textBaseline="middle";
      if(col===P.warm) shadow(P.warm,20);
      ctx.fillText(o.w,0,0); noShadow(); ctx.restore();
    }
    x2+=L2.widths[i]+L2.sp;
  }
  // the two flank the fire
  CH.m.r=24*S; CH.f.r=23*S;
  CH.m.vis=0.9*(1-inv(t,71.95,72.3)); CH.f.vis=CH.m.vis;
  CH.m.x=fx-128*S; CH.f.x=fx+128*S; CH.m.y=CH.f.y=fy+8*S;
  drawChar(CH.m,t,{color:P.cold,glow:P.hot});
  drawChar(CH.f,t,{color:P.warm,glow:P.hot});
}

/* ---------- director ---------- */
const CUES=[
  [0.00, 3.95, s1],[3.95, 7.45, s2],[7.45,11.60, s3],[11.60,15.50, s4],
  [15.50,17.86, s5],[17.86,20.28, s6],[20.28,22.08, s7],[22.08,24.05, s8],
  [24.05,26.40, s9],[26.40,30.88, s10],[30.88,33.70, s11],[33.70,37.35, s12],
  [37.35,45.70, s13],[45.70,48.52, s14],[48.52,61.22, s15],[61.22,63.90, s16],

  [80.46,90.00, s21]
];
function frame(t){
  background(t);
  reset();
  for(const [a,b,fn] of CUES){ if(t>=a && t<b){ fn(t); break; } }
  grain();
}

/* ---------- transport ---------- */
const gate=document.getElementById("gate"), hud=document.getElementById("hud");
const playB=document.getElementById("play"), scrub=document.getElementById("scrub");
const timeL=document.getElementById("time"), cap=document.getElementById("cap"), full=document.getElementById("full");
let seeking=false;
const fmt=s=>{s=Math.max(0,s|0);return `${(s/60)|0}:${String(s%60).padStart(2,"0")}`;};
function curLine(t){
  for(let i=LINES.length-1;i>=0;i--){
    const ws=W.filter(x=>x.l===i); if(!ws.length) continue;
    if(t>=ws[0].s-0.25 && t<=ws[ws.length-1].e+0.6) return LINES[i];
  }
  return "";
}
function loop(){
  const t=audio.currentTime||0;
  frame(t);
  if(!seeking){ scrub.value=t; }
  timeL.textContent=`${fmt(t)} / ${fmt(DUR)}`;
  cap.textContent=curLine(t);
  requestAnimationFrame(loop);
}
function audioFailed(msg){
  const g=document.getElementById("gate");
  g.hidden=false;
  const btn=document.getElementById("start");
  const note=g.querySelector(".g-note");
  btn.textContent="Retry";
  if(note) note.textContent=msg;
}
audio.addEventListener("error",()=>audioFailed("The audio could not be loaded. Check your connection and retry."));
document.getElementById("start").addEventListener("click",()=>{
  gate.hidden=true; hud.classList.add("on");
  audio.play().then(()=>{
    // if the clock never advances, the track did not decode
    const t0=audio.currentTime;
    setTimeout(()=>{
      if(!audio.paused && audio.currentTime===t0 && audio.readyState===0)
        audioFailed("The audio could not be played in this browser.");
    },2500);
  }).catch(()=>audioFailed("Playback was blocked. Tap Play to try again."));
});
playB.addEventListener("click",()=>{
  if(audio.paused){ audio.play(); playB.textContent="⏸"; }
  else { audio.pause(); playB.textContent="▶"; }
});
audio.addEventListener("play",()=>playB.textContent="⏸");
audio.addEventListener("pause",()=>playB.textContent="▶");
scrub.addEventListener("input",()=>{ seeking=true; audio.currentTime=+scrub.value; });
scrub.addEventListener("change",()=>{ seeking=false; });
full.addEventListener("click",()=>{
  const el=document.documentElement;
  if(!document.fullscreenElement) el.requestFullscreen?.().catch(()=>{});
  else document.exitFullscreen?.().catch(()=>{});
});
window.addEventListener("keydown",e=>{
  if(e.code==="Space"){ e.preventDefault(); audio.paused?audio.play():audio.pause(); }
  if(e.code==="ArrowLeft")  audio.currentTime=Math.max(0,audio.currentTime-2);
  if(e.code==="ArrowRight") audio.currentTime=Math.min(DUR,audio.currentTime+2);
});
frame(0);
loop();

})();

</script>
