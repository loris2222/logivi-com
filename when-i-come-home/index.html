  }
  const THEND=GLYPH.length ? GLYPH[GLYPH.length-1].th+0.05 : 1;
  // Linear in angle while the words are sung; scene 16 keeps the same rate
  // through the silence so the motion does not change at the cut.
  const RATE=THEND/(T1-T0);
  const spin=-RATE*Math.max(0,t-T0);
  const settle=easeIO(inv(t, T0, T0+0.9));
  const shift=spin*settle;
  return {words,N,strip,R0,GROW,k,KS,PITCH,PX0,radAt,GLYPH,THEND,spin,settle,shift};
}

function s15(t){
  CH.m.vis=0; CH.f.vis=0; HOUSE.vis=0;
  const font=BLOCK.ready?BLOCK.font:(HW.ready?HW.font:null);
  if(!font) return;

  const T0=48.52;
  const B=tetBoard(w,h);
  // The spiral's geometry and motion live in spiralField, which scene 16 also
  // reads, so the turn continues through the cut at the same rate instead of
  // each scene solving it separately.
  const F=spiralField(t, w, h, font);

  // --- the house, receding at the centre ---
  {
    const away=easeIO(inv(t, T0+0.15, T0+6.0));
    const sc=lerp(tetPullback(T0), 0.10, away);
    const al=clamp(1-inv(t, T0+3.2, T0+7.4), 0, 1);
    if(al>0.01){
      ctx.save();
      ctx.globalAlpha=al;
      ctx.translate(w*0.5, h*0.50);
      ctx.rotate(F.shift*0.35);
      ctx.scale(sc,sc);
      ctx.translate(-B.cx,-B.cy);
      ctx.fillStyle=P.warm;
      shadow(P.warm, B.HH*0.22);
      ctx.fill(tetHousePath(B));
      noShadow();
      ctx.save();
      ctx.clip(tetHousePath(B));
      for(const pc of TET_PLAN)
        for(const [c,r] of pc.c)
          tetBlock(B.cellX(c), B.cellY(r), B.cell, pc.k?TET_LETTER:TET_BG);
      ctx.restore();
      ctx.restore();
    }
  }

  // --- the letters ---
  for(const g of F.GLYPH){
    const o=F.words[g.i];
    const appear=inv(t, o.s-0.45, o.s-0.02);
    if(appear<=0) continue;
    const ang=F.shift + g.th;
    const R=F.radAt(g.th)*Math.exp(F.k*F.shift);
    const sz=F.PX0*(F.radAt(g.th)/F.R0)*Math.exp(F.k*F.shift);
    if(sz<3 || R>Math.max(w,h)*1.5) continue;
    const adv=font.getAdvanceWidth(g.ch, sz);
    const txt=F.strip(o.w);
    const warm=(txt==="LAST"||txt==="SHARE"||txt==="LAUGH");
    ctx.save();
    ctx.globalAlpha=appear;
    ctx.translate(w*0.5+Math.cos(ang-Math.PI/2)*R,
                  h*0.50+Math.sin(ang-Math.PI/2)*R);
    ctx.rotate(ang-F.PITCH);
    ctx.fillStyle=warm?P.warm:P.paper;
    const gp=font.getPath(g.ch, -adv/2, sz*0.36, sz);
    ctx.fill(new Path2D(gp.toPathData(2)));
    ctx.restore();
  }
}

function s16(t){
  HOUSE.vis=0;
  const font=BLOCK.ready?BLOCK.font:(HW.ready?HW.font:null);

  // --- the spiral carries on through the silence ---
  // There are no words here at all -- 2.7s between "you" and "Then" -- so the
  // field simply keeps revolving at the same rate and spins itself empty,
  // each letter leaving as it reaches the edge of the frame.
  if(font){
    const F=spiralField(t, w, h, font);
    // The spiral keeps travelling exactly as it was -- no extra outward push,
    // which would reverse the direction the whole scene has been moving in.
    // Instead the letters LEAVE IN ORDER, from the centre outward: the ones
    // that arrived first are at the heart of the spiral and go first, so the
    // field unwinds the way it was wound.
    const N_G=F.GLYPH.length;
    const gone=easeIO(inv(t, 61.30, 63.30))*N_G;
    for(let gi=0; gi<N_G; gi++){
      const g=F.GLYPH[gi];
      const ang=F.shift + g.th;
      const R=F.radAt(g.th)*Math.exp(F.k*F.shift);
      const sz=F.PX0*(F.radAt(g.th)/F.R0)*Math.exp(F.k*F.shift);
      if(sz<3 || R>Math.max(w,h)*1.6) continue;
      // each letter dissolves as the wave of departure reaches its index
      const al=clamp(1-(gone-gi), 0, 1);
      if(al<=0.01) continue;
      const adv=font.getAdvanceWidth(g.ch, sz);
      const txt=F.strip(F.words[g.i].w);
      const warm=(txt==="LAST"||txt==="SHARE"||txt==="LAUGH");
      ctx.save();
      ctx.globalAlpha=al;
      ctx.translate(w*0.5+Math.cos(ang-Math.PI/2)*R,
                    h*0.50+Math.sin(ang-Math.PI/2)*R);
      ctx.rotate(ang-F.PITCH);
      ctx.fillStyle=warm?P.warm:P.paper;
      const gp=font.getPath(g.ch, -adv/2, sz*0.36, sz);
      ctx.fill(new Path2D(gp.toPathData(2)));
      ctx.restore();
    }
  }

  // --- the two dots ---
  // They form at the centre the spiral has just vacated, breathing gently:
  // the pair the whole song has been about, alone in the quiet.
  const born=easeOut(inv(t, 62.30, 63.30));
  if(born>0){
    const br=0.80+0.20*Math.sin((t-62.30)*2.2);
    const a=born*(1-inv(t,63.70,63.90))*br;
    CH.m.r=9*S; CH.f.r=9*S; CH.m.face=0; CH.f.face=0;
    CH.m.roll=0; CH.f.roll=0;
    // they ease in toward each other as they appear
    const gap=lerp(w*0.14, w*0.035, born);
    CH.m.x=w*0.5-gap; CH.f.x=w*0.5+gap;
    CH.m.y=CH.f.y=h*0.50;
    CH.m.vis=a; CH.f.vis=a;
    drawChar(CH.m,t,{color:P.cold});
    drawChar(CH.f,t,{color:P.warm});
  } else {
    CH.m.vis=0; CH.f.vis=0;
  }
}

function s17(t){
  CH.m.face=0; CH.f.face=0;
  const o1=wordsOf(22), o2=wordsOf(23);
  const age=inv(t,64.39,65.3), warm=inv(t,65.75,66.9);
  for(const o of [...o1,...o2]){
    // gone before the dots collide at 67.45, so the flash lands on a clear
    // frame rather than over half-faded words
    const a=inv(t,o.s,o.s+0.2)*(1-inv(t,66.80,67.35));
    if(a<=0) continue;
    const old=["old,","you're","Then"].includes(o.w);
    // A whisper, so only a little larger than before -- and the two lines sit
    // further apart, clear of the dots holding the centre.
    const px=(old?lerp(52,46,age):lerp(46,57,warm))*S;
    const cy=old?h*0.26:h*0.74;
    const ws=old?o1:o2;
    const idx=ws.indexOf(o);
    const L=layout(ws,px,{weight:old?300:700,face:DISPLAY},0.3);
    let x=w/2-L.total/2; for(let q=0;q<idx;q++) x+=L.widths[q]+L.sp;
    drawWord(o.w, x+L.widths[idx]/2, cy, px,
      {weight:old?300:700, face:DISPLAY, alpha:a*(old?lerp(1,0.5,age):1),
       color:old?P.muted:(warm>0.4?P.warm:P.cold)});
  }
  // The dots stay exactly where scene 16 left them: same centre, same size,
  // same gap. They were at h*0.80 and 13*S, which jumped them down the frame
  // and made them grow at the cut.
  CH.m.r=9*S; CH.f.r=9*S; CH.m.roll=0; CH.f.roll=0;
  CH.m.vis=0.85; CH.f.vis=0.85;

  // --- the backstep and the smash ---
  // They draw apart to gather speed, then rush together and collide at the
  // cut into scene 18, where the impact becomes the flame of "the fire".
  const REST=w*0.035;
  const back=easeOut(inv(t, 66.35, 66.95));     // pull apart
  const rush=easeIn(inv(t, 66.95, 67.45));      // and close, fast
  const gap=lerp(lerp(REST, REST*3.4, back), 0, rush);
  // they grow a little as they bear down on each other
  const sz=lerp(1, 1.35, rush);
  CH.m.r=9*S*sz; CH.f.r=9*S*sz;
  CH.m.x=w*0.5-gap; CH.f.x=w*0.5+gap;
  CH.m.y=CH.f.y=h*0.50;
  drawChar(CH.m,t,{color:P.cold}); drawChar(CH.f,t,{color:P.warm});

  // the air compresses between them just before impact
  if(rush>0.55){
    const sp=inv(rush,0.55,1);
    ctx.save();
    ctx.globalAlpha=sp*0.5;
    ctx.fillStyle=P.warm;
    shadow(P.hot, 40*sp*S);
    ctx.beginPath();
    ctx.arc(w*0.5, h*0.50, 9*S*sz*sp*0.9, 0, 7);
    ctx.fill();
    noShadow();
    ctx.restore();
  }
}

/* 18 ── 67.50-71.90  fire: i-dot is the flame; "waning" shrinks then catches */
function s18(t){
  CH.m.vis=0; CH.f.vis=0; HOUSE.vis=0;
  const font=BLOCK.ready?BLOCK.font:(HW.ready?HW.font:null);
  if(!font) return;

  // --- the impact becomes the flame ---
  const burst=inv(t, 67.45, 67.95);
  if(burst<1){
    const b=1-burst;
    ctx.save();
    ctx.globalAlpha=b;
    const g=ctx.createRadialGradient(w*0.5, h*0.50, 0,
                                     w*0.5, h*0.50, Math.min(w,h)*(0.06+0.34*burst));
    g.addColorStop(0, "rgba(255,255,255,"+(0.95*b)+")");
    g.addColorStop(0.35, "rgba(255,196,92,"+(0.75*b)+")");
    g.addColorStop(1, "rgba(255,122,61,0)");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,w,h);
    ctx.restore();
  }

  // Two lines, each set edge to edge. The first sits high so its flames have
  // room to rise into the frame instead of being cut off at the top.
  const PADX=w*0.07;
  const L1="THE FIRE", L2="THAT BURNS US";
  // Each line is held to a height cap, then STRETCHED horizontally to fill
  // the width. Size alone cannot do both: on a 2560x1080 frame the cap left
  // the lines filling barely half the width, because a wide frame wants type
  // far taller than the layout allows.
  const AVAIL=w-PADX*2;
  const fitLine3=(txt,cap)=>{
    const px=Math.min(sizeForWidth(txt, font, AVAIL), h*cap);
    const b=inkBounds(txt, font, px);
    return {px, b, st:b.w>0 ? AVAIL/b.w : 1};
  };
  const F1=fitLine3(L1,0.26), F2=fitLine3(L2,0.20);
  const px1=F1.px, px2=F2.px, bA=F1.b, bB=F2.b;
  const st1=F1.st, st2=F2.st;
  const x1=w*0.5-(bA.w*st1)/2, y1=h*0.40+bA.h/2;
  const x2=w*0.5-(bB.w*st2)/2, y2=h*0.78+bB.h/2;

  // Each letter catches as its own word is sung.
  const mkLit=(txt, t0, t1)=>{
    const chars=[...txt];
    const n=chars.filter(c=>c!==" ").length;
    let ci=0;
    return chars.map(c=>{
      if(c===" ") return 0;
      const ts=lerp(t0, t1, ci/Math.max(1,n-1)); ci++;
      return inv(t, ts, ts+0.26);
    });
  };
  const lit1=mkLit(L1, 67.56, 68.55);
  // The second line arrives WORD by word, each on its own sung beat, rather
  // than letter by letter: it is not burning, so it has no reason to catch
  // one glyph at a time.
  const W2=[["THAT",68.14],["BURNS",68.42],["US",69.17]];
  const lit2=(()=>{
    const out=[]; let wi=0;
    for(const ch of L2){
      if(ch===" "){ out.push(0); wi++; continue; }
      const wd=W2[wi]||W2[W2.length-1];
      out.push(inv(t, wd[1], wd[1]+0.22));
    }
    return out;
  })();

  // Draw one glyph stretched about its own left edge, so the advance table
  // and the rendered width agree.
  const glyph=(g2,ch,xx,yy,px,st)=>{
    g2.save();
    g2.translate(xx,yy);
    g2.scale(st,1);
    g2.fill(new Path2D(font.getPath(ch,0,0,px).toPathData(2)));
    g2.restore();
  };
  const advOf=(txt,px,x0,st)=>{
    const a=[]; let x=x0;
    for(const c of txt){ a.push(x); x+=font.getAdvanceWidth(c,px)*st; }
    return a;
  };
  const adv1=advOf(L1,px1,x1-bA.x1*st1,st1), adv2=advOf(L2,px2,x2-bB.x1*st2,st2);

  // --- "ISN'T WANING AT ALL", interlaced between the two ---
  // It sits in the gap the other two leave, set smaller and in the fire's own
  // warm orange rather than the cold blue-white -- so the three lines read as
  // two voices, the cold statement and the warm answer running through it.
  const L3="ISN'T WANING AT ALL";
  const F3=fitLine3(L3,0.115);
  const px3=F3.px, bC=F3.b, st3=F3.st;
  const x3=w*0.5-(bC.w*st3)/2, y3=h*0.615+bC.h/2;
  const W3=[["ISN'T",70.02],["WANING",70.42],["AT",71.16],["ALL",71.46]];
  const lit3=(()=>{
    const out=[]; let wi=0;
    for(const ch of L3){
      if(ch===" "){ out.push(0); wi++; continue; }
      const wd=W3[Math.min(wi,W3.length-1)];
      out.push(inv(t, wd[1], wd[1]+0.22));
    }
    return out;
  })();
  const adv3=advOf(L3,px3,x3-bC.x1*st3,st3);

  // Only the first line burns -- "THE FIRE" is the thing on fire; the line
  // below it is plain type, so the fire box covers line 1 alone.
  const FY=y1-bA.h-h*0.30, FH=bA.h+h*0.34;
  const FX=w*0.5-(bA.w*st1*1.12)/2, FW=bA.w*st1*1.12;

  const fireOut=1-inv(t, 71.80, 72.03);
  if(lit1.some(v=>v>0) && fireOut>0.01){
    fireFuelFromPath((g,GW,GH)=>{
      const sx=GW/FW, sy=GH/FH;
      g.setTransform(sx,0,0,sy,0,0);
      g.translate(-FX,-FY);
      g.fillStyle="#fff";
      const put=(chars,lit,adv,px,yy,st)=>{
        for(let i2=0;i2<chars.length;i2++){
          if(lit[i2]<=0.02 || chars[i2]===" ") continue;
          g.globalAlpha=Math.min(1,lit[i2]);
          glyph(g, chars[i2], adv[i2], yy, px, st);
        }
      };
      put([...L1], lit1, adv1, px1, y1, st1);
    });
    const flick=0.84+0.16*Math.sin(t*11.3)+0.10*env("mid",t);
    fireStep(flick);
    fireDraw(FX, FY, FW, FH, {alpha:0.95*fireOut, blend:"lighter"});
  }

  // the letters, cold blue-white against their own fire
  {
    // Everything goes out together, fast, right at the end of the scene --
    // a hard cut rather than a lingering dissolve.
    const out=1-inv(t, 71.80, 72.03);
    const draw=(chars,lit,adv,px,yy,st)=>{
      for(let i2=0;i2<chars.length;i2++){
        if(chars[i2]===" ") continue;
        const a=Math.min(1,lit[i2])*out;
        if(a<=0.01) continue;
        ctx.save();
        ctx.globalAlpha=a;
        ctx.fillStyle="#bfe3ff";
        glyph(ctx, chars[i2], adv[i2], yy, px, st);
        ctx.restore();
      }
    };
    draw([...L1], lit1, adv1, px1, y1, st1);
    draw([...L2], lit2, adv2, px2, y2, st2);
    // the warm line, in the fire's colour
    for(let i2=0;i2<L3.length;i2++){
      if(L3[i2]===" ") continue;
      const a=Math.min(1,lit3[i2])*out;
      if(a<=0.01) continue;
      ctx.save();
      ctx.globalAlpha=a;
      ctx.fillStyle=P.warm;
      shadow(P.hot, px3*0.26);
      glyph(ctx, L3[i2], adv3[i2], y3, px3, st3);
      noShadow();
      ctx.restore();
    }
  }
}

function s19(t){
  CH.m.vis=0; CH.f.vis=0; HOUSE.vis=0;
  const font=BLOCK.ready?BLOCK.font:(HW.ready?HW.font:null);
  if(!font) return;

  // The house IS the line. WHEN is bent into the roof -- its tops follow the
  // two slopes while its baseline stays flat -- the I stands on the ridge as
  // a chimney, and COME HOME fills the body. The colours alternate so each
  // element reads against the one beside it: WHEN and HOME warm, I and COME
  // cold.
  const HW2=Math.min(w*0.74, h*0.92);
  const cx=w*0.5;
  const roofH=HW2*0.30, bodyH=HW2*0.46;
  const totalH=roofH+bodyH;
  const top=h*0.52-totalH/2;
  const eave=top+roofH;                     // where the roof meets the body
  const base=eave+bodyH;
  const L=cx-HW2/2, R=cx+HW2/2;

  const COLD="#bfe3ff", WARM=P.warm;

  // The door's span and the push into it are worked out up front, so the
  // transform can wrap the WHOLE house. Opening it only around the body left
  // the roof and chimney behind while the rest flew forward.
  const omSpan=(word)=>{
    const probe=100;
    const b=inkBounds(word, font, probe);
    let x=0, s0=null, s1=null;
    for(let i2=0;i2<word.length;i2++){
      const gb=font.getPath(word[i2], x, 0, probe).getBoundingBox();
      if(word[i2]==="O" && s0===null) s0=gb.x1;
      if(word[i2]==="M") s1=gb.x2;
      x+=font.getAdvanceWidth(word[i2], probe);
    }
    return [(s0-b.x1)/b.w, (s1-b.x1)/b.w];
  };
  const [u0c,u1c]=omSpan("COME"), [u0h,u1h]=omSpan("HOME");
  const dU0=Math.min(u0c,u0h), dU1=Math.max(u1c,u1h);
  const dx0=L+(R-L)*dU0, dx1=L+(R-L)*dU1;

  const swing=easeIO(inv(t, 75.10, 76.00));
  const dive=easeIO(inv(t, 75.55, 76.28));

  // --- the doorway becomes the next scene ---
  // From about 76.10 the magnified door covers the whole frame, so for the
  // last fifth of a second nothing of the house is visible and the screen is
  // simply the inside of the doorway. That window is used to warm the field
  // into what scene 20 opens on, so the cut at 76.28 changes nothing.
  const through=easeIO(inv(t, 75.95, 76.28));
  if(through>0){
    ctx.save();
    ctx.globalAlpha=through;
    const g=ctx.createRadialGradient(w*0.5, h*0.52, 0,
                                     w*0.5, h*0.52, Math.max(w,h)*0.78);
    g.addColorStop(0, "rgba(58,32,18,1)");
    g.addColorStop(0.55, "rgba(26,16,12,1)");
    g.addColorStop(1, P.ink);
    ctx.fillStyle=g;
    ctx.fillRect(0,0,w,h);
    ctx.restore();
  }

  ctx.save();
  if(dive>0){
    const dcx=(dx0+dx1)/2, dcy=eave+bodyH*0.5;
    const z=lerp(1, 9.0, dive);
    ctx.translate(lerp(dcx, w*0.5, dive), lerp(dcy, h*0.5, dive));
    ctx.scale(z,z);
    ctx.translate(-dcx,-dcy);
  }

  // --- the chimney: the I, standing on the roof's left slope ---
  {
    const a=inv(t, 72.60, 72.95);
    if(a>0){
      // On the RIGHT slope, with its base following the roof's angle: the
      // chimney is cut to sit on the pitch, not planted flat on it.
      const cw=HW2*0.085, chx=cx+HW2*0.26;
      const APEX=0.52;
      const slopeAt=(x)=>{
        const u=clamp((x-L)/HW2,0,1);
        return top+roofH*APEX*Math.abs(u-0.5)*2;
      };
      const bx0=chx-cw/2, bx1=chx+cw/2;
      const y0c=slopeAt(bx0), y1c=slopeAt(bx1);
      const chTop=Math.min(y0c,y1c)-HW2*0.20;
      bandWord("I", font, bx0, bx1,
               ()=>chTop,
               (u)=>lerp(y0c,y1c,u)+2,        // the base follows the pitch
               {color:COLD, alpha:a});
    }
  }

  // --- the roof: WHEN, bent to the gable ---
  {
    const a=inv(t, 72.10, 72.50);
    if(a>0){
      // The roof's PEAK is at the centre, so the band is tallest at the ends
      // and shortest in the middle. Running the slopes all the way to the
      // eave collapsed the band to zero height at u=0.5 and crushed the
      // middle letters flat; the apex is held back so every letter keeps at
      // least 55% of the band.
      // Canvas y grows DOWNWARD, so the ridge is the SMALLEST y and must sit
      // at the centre: |u-0.5|*2 is 0 in the middle and 1 at the ends.
      // Writing (1 - |u-0.5|*2) hangs the middle down instead and the roof
      // reads as a notch cut out of the word.
      const APEX=0.52;                       // how deep the slopes cut
      const topAt=(u)=>top+roofH*APEX*Math.abs(u-0.5)*2;
      bandWord("WHEN", font, L, R, topAt, ()=>eave,
               {color:WARM, alpha:a});
    }
  }

  // --- the body: COME over HOME ---
  // The OM of each word stacks into a two-panel door. Its span is taken from
  // the FONT -- the fraction of each word's ink box that O and M occupy --
  // rather than measured off the canvas, so it is exact at any frame size.
  {
    const half=bodyH/2;
    const a1=inv(t, 73.20, 73.75);
    const a2=inv(t, 74.18, 74.70);

    // Nothing is painted inside the doorway. Filling it with a dark panel
    // put a slightly different black against the scene's own background and
    // the join showed as a visible edge; the opening simply reveals what is
    // already behind the words.

    // the words, with the door panels cut out of them once they start moving
    const drawBody=()=>{
      if(a1>0) bandWord("COME", font, L, R, ()=>eave, ()=>eave+half,
                        {color:COLD, alpha:a1});
      if(a2>0) bandWord("HOME", font, L, R, ()=>eave+half, ()=>base,
                        {color:WARM, alpha:a2});
    };
    if(swing<=0){ drawBody(); }
    else {
      // everything outside the doorway stays put
      ctx.save();
      ctx.beginPath();
      ctx.rect(0,0,w,h);
      ctx.rect(dx1,eave,-(dx1-dx0),bodyH);     // reverse winding = a hole
      ctx.clip("evenodd");
      drawBody();
      ctx.restore();

      // the two panels swing out toward the viewer: each foreshortens about
      // its own hinge and brightens as it turns into the light
      const mid=(dx0+dx1)/2;
      for(const side of [-1,1]){
        const hinge=side<0?dx0:dx1;
        const px0=side<0?dx0:mid, px1=side<0?mid:dx1;
        ctx.save();
        ctx.translate(hinge, 0);
        ctx.scale(Math.max(0.02, 1-swing*0.92), 1);
        ctx.translate(-hinge, 0);
        ctx.beginPath();
        ctx.rect(px0, eave, px1-px0, bodyH);
        ctx.clip();
        drawBody();
        ctx.restore();
      }
    }
  }
  ctx.restore();
}

function s20(t){
  const ws=wordsOf(27);

  // No house here. Scene 19 ends by flying through its door, so we are
  // already inside -- drawing the building again put the thing we just
  // entered back on screen, small and sketchy, under the line.
  HOUSE.vis=0;

  // The resolution of the song, written out by hand in two lines rather than
  // set as display type: the same pen that opened the piece in scene 2 closes
  // it. Each line is drawn as it is sung, the nib sweeping along the ink.
  if(HW.ready){
    const PADX=w*0.10;
    // Each line is written in SEGMENTS so "you" and "home" -- what the song
    // has been reaching for -- keep their warm colour. drawHandwritten inks
    // one string in one colour, so the colour change has to be a seam in the
    // line, written in sequence as the pen reaches it.
    const px=Math.min(sizeForWidth("Where you are", HW.font, w-PADX*2), h*0.17);
    // Each segment is written across its OWN word's time, not a share of the
    // line's progress proportioned by width: a short word like "my" was being
    // stretched over 0.68s while "home" began writing 0.72s before it was
    // sung, because the split followed the letters rather than the voice.
    // Each word writes from its own beat to the NEXT word's beat, so the pen
    // never stops between words and never runs ahead of the voice. Fixed
    // short durations made every word a separate stab with dead air between;
    // splitting the line by glyph width instead let "home" start writing
    // three quarters of a second before it was sung.
    const span=(k,lead)=>{
      const i2=ws.findIndex(q=>q.w.replace(/[,.]/g,"").toLowerCase()===k);
      if(i2<0) return [null,0.4];
      const s0=ws[i2].s-(lead||0);
      const s1=(i2+1<ws.length)?ws[i2+1].s:80.30;
      return [s0, Math.max(0.28, s1-s0)];
    };
    const SW=span("where"), SY=span("you"), SA=span("are"),
          SM=(()=>{const a=span("my"); return [a[0], a[1]-0.30];})(),
          // "home" follows a word held for 1.4s, so the pen has been still
          // for a long beat before it. A short lead-in starts the stroke just
          // ahead of the word so the ink arrives WITH it rather than after.
          SH=span("home", 0.30);
    const LINES=[
      {cy:h*0.26, segs:[["Where ",P.paper,SW[0],SW[1]],
                        ["you ",  P.warm, SY[0],SY[1]],
                        ["are",   P.paper,SA[0],SA[1]]]},
      {cy:h*0.44, segs:[["my ",   P.paper,SM[0],SM[1]],
                        ["home",  P.warm, SH[0],SH[1]]]}
    ];
    for(const L of LINES){
      const widths=L.segs.map(([txt])=>HW.font.getAdvanceWidth(txt, px));
      const total=widths.reduce((a,b)=>a+b,0);
      let x=w*0.5-total/2;
      for(let i2=0;i2<L.segs.length;i2++){
        const [txt,col,t0,dur]=L.segs[i2];
        // a soft ease-out only: easeIO slowed the pen at the end of every
        // word, which read as a hitch between them
        const sp=(t0==null)?1:easeOut(inv(t, t0, t0+dur));
        if(sp>0){
          drawHandwritten(txt, x, L.cy, px, sp,
            {color:col, glow:(col===P.warm)?P.warm:null,
             glowSize:px*0.22, align:"left"});
        }
        x+=widths[i2];
      }
    }
  }

  // the two draw together beneath, large
  const close=inv(t,76.6,80.0);
  CH.m.r=46*S; CH.f.r=44*S; CH.m.face=1; CH.f.face=1; CH.m.roll=0; CH.f.roll=0;
  CH.m.vis=inv(t,76.4,76.9); CH.f.vis=CH.m.vis;
  CH.m.x=lerp(w*0.28,w*0.468,easeIO(close)); CH.m.y=h*0.72;
  CH.f.x=lerp(w*0.72,w*0.532,easeIO(close)); CH.f.y=h*0.72;
  drawChar(CH.m,t,{color:P.cold,glow:P.warm});
  drawChar(CH.f,t,{color:P.warm,glow:P.warm}); femaleMark(CH.f);
}

function s21(t){
  const k=easeIO(inv(t,80.46,89.6));

  // No house. Scene 20 has none either -- we are inside, and the outro is
  // just the two of them.
  HOUSE.vis=0;

  // Opens on exactly the state scene 20 ends in -- same size, same place --
  // and only then drifts. Starting at 28*S and h*0.64 jumped them smaller
  // and higher the moment the scene changed.
  CH.m.r=lerp(46,34,k)*S; CH.f.r=lerp(44,33,k)*S;
  CH.m.face=1; CH.f.face=1; CH.m.roll=0; CH.f.roll=0;
  CH.m.x=lerp(w*0.468,w*0.476,k); CH.f.x=lerp(w*0.532,w*0.524,k);
  CH.m.y=CH.f.y=lerp(h*0.72,h*0.56,k);

  // the pair clear the frame before the signature takes it
  const fade=1-inv(t,85.2,88.6);
  CH.m.vis=fade; CH.f.vis=fade;

  // warm halo around the pair
  if(fade>0){
    const g=ctx.createRadialGradient(w*0.5,CH.m.y,0,w*0.5,CH.m.y,300*S);
    g.addColorStop(0,`rgba(255,181,99,${0.22*fade})`);
    g.addColorStop(1,"rgba(255,181,99,0)");
    ctx.save(); ctx.fillStyle=g; ctx.fillRect(0,0,w,h); ctx.restore();
  }
  drawChar(CH.m,t,{color:P.cold,glow:P.warm});
  drawChar(CH.f,t,{color:P.warm,glow:P.warm}); femaleMark(CH.f);

  // --- the signature ---
  // Written small in the bottom right once the pair have settled, with no
  // nib glow: this is a hand signing off, not the pen performing. Then, as
  // the two fade out, it moves to the middle of the frame and grows -- the
  // last thing on screen, held to the end rather than faded with everything
  // else.
  if(HW.ready){
    const sp=easeOut(inv(t, 84.2, 87.0));
    if(sp>0){
      const txt="Love you, Loris";
      const take=easeIO(inv(t, 87.3, 89.0));      // its move to centre stage
      const px=Math.min(w,h)*lerp(0.052, 0.105, take);
      const wdt=HW.font.getAdvanceWidth(txt, px);
      const restX=w-w*0.07-wdt, restY=h*0.88;
      const midX=w*0.5-wdt/2,   midY=h*0.52;
      drawHandwritten(txt, lerp(restX,midX,take), lerp(restY,midY,take), px, sp,
        {color:P.paper, alpha:lerp(0.82,1,take), nib:false, align:"left"});
    }
  }
}

const CUES=[
  [0.00, 3.95, s1],[3.95, 7.45, s2],[7.45,11.60, s3],[11.60,15.50, s4],
  [15.50,17.86, s5],[17.86,20.28, s6],[20.28,22.08, s7],[22.08,24.05, s8],
  [24.05,26.45, s9],[26.45,30.88, s10],[30.88,33.70, s11],[33.70,37.35, s12],
  [37.35,45.70, s13],[45.70,48.52, s14],[48.52,61.22, s15],[61.22,63.90, s16],
  [63.90,67.45, s17],[67.45,72.05, s18],[72.05,76.28, s19],[76.28,80.46, s20],
  [80.46,90.00, s21]
];
const SCENE_NAMES=[
 "1 \u00b7 Did you know / timeline rewind","2 \u00b7 Birth of the two (j + i)","3 \u00b7 Worries / Sadness shattered",
 "4 \u00b7 Ski jump & launch","5 \u00b7 And so, you, do.","6 \u00b7 Standing on the i of 'without'",
 "7 \u00b7 Look up, look down","8 \u00b7 Sweat & frown","9 \u00b7 And so, you, do. (reprise)",
 "10 \u00b7 The mountain (together)","11 \u00b7 A place, you, love. (heart)","12 \u00b7 Into the house",
 "13 \u00b7 past / best / last","14 \u00b7 CHORUS \u2014 into the home","15 \u00b7 Sustained chorus + share with you",
 "16 \u00b7 THE HINGE (silence)","17 \u00b7 Then you're old / never cold","18 \u00b7 The fire / waning",
 "19 \u00b7 co-oome home","19.5 \u00b7 Where you are my home","20 \u00b7 Outro (instrumental)"
];

function frame(t){
  // the 3D layer only owns the frame during the portal shot; any other scene
  // must reset it or the 2D background stays transparent
  // the 3D layer owns 6.18-7.45 (portal), 7.45-11.60 (desk), 11.60-15.50 (hops)
  if(t<6.18 || t>15.50){
    if(GL.active){ GL.active=false; if(GL.ready) GL.clear(); }
    S2_DOCK.ready=false;           // re-probe on the next pass
  }
  background(t);
  reset();
  for(const [a,b,fn] of CUES){ if(t>=a && t<b){ fn(t); break; } }
  grain();
}

/* ---------- transport ---------- */
const PLAY_ICON='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.6l9 5.4-9 5.4z"/></svg>';
const PAUSE_ICON='<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="2.5" width="3.2" height="11" rx="1"/><rect x="9.3" y="2.5" width="3.2" height="11" rx="1"/></svg>';
const gate=document.getElementById("gate"), hud=document.getElementById("hud");
const playB=document.getElementById("play"), scrub=document.getElementById("scrub");
const timeL=document.getElementById("time"), cap=document.getElementById("cap"), full=document.getElementById("full");
let seeking=false;
const fmt=s=>{s=Math.max(0,s|0);return `${(s/60)|0}:${String(s%60).padStart(2,"0")}`;};
function curLine(t){
  for(let i=LINES.length-1;i>=0;i--){
    const ws=W.filter(x=>x.l===i); if(!ws.length) continue;
    if(t>=ws[0].s-0.25 && t<=ws[ws.length-1].e+0.6) return LINES[i];
  }
  return "";
}
let loopWrapAt=0;
function loop(){
  // __T pins the clock for frame capture; it always wins over the audio clock
  let t=(window.__T!==undefined && window.__T!==null) ? window.__T : (audio.currentTime||0);
  const R=(window.__T!==undefined && window.__T!==null) ? null : window.__LOOP;
  if(R){
    // a seek is async and "seeked" is not guaranteed to fire, so rate-limit
    // the wrap by wall clock instead of waiting on an event
    const now=performance.now();
    if((t>=R.b || t<R.a-0.25) && now-loopWrapAt>250){
      loopWrapAt=now;
      try{ audio.currentTime=R.a; }catch(_){}
    }
  }
  frame(t);
  if(!seeking){ scrub.value=t; }
  timeL.textContent=`${fmt(t)} / ${fmt(DUR)}`;
  // No subtitle track: this is a lyrics video, the words are the picture.
  if(cap) cap.textContent=curLine(t);
  requestAnimationFrame(loop);
}
function audioFailed(msg){
  const g=document.getElementById("gate");
  g.hidden=false;
  const btn=document.getElementById("start");
  const note=g.querySelector(".g-note");
  btn.textContent="Retry";
  if(note) note.textContent=msg;
}
audio.addEventListener("error",()=>audioFailed("The audio could not be loaded. Check your connection and retry."));
document.getElementById("start").addEventListener("click",()=>{
  gate.hidden=true; hud.classList.add("on");
  audio.play().then(()=>{
    // if the clock never advances, the track did not decode
    const t0=audio.currentTime;
    setTimeout(()=>{
      if(!audio.paused && audio.currentTime===t0 && audio.readyState===0)
        audioFailed("The audio could not be played in this browser.");
    },2500);
  }).catch(()=>audioFailed("Playback was blocked. Tap Play to try again."));
});
playB.addEventListener("click",()=>{
  if(audio.paused){ audio.play(); playB.innerHTML=PAUSE_ICON; }
  else { audio.pause(); playB.innerHTML=PLAY_ICON; }
});
audio.addEventListener("play",()=>playB.innerHTML=PAUSE_ICON);
audio.addEventListener("pause",()=>playB.innerHTML=PLAY_ICON);
scrub.addEventListener("input",()=>{ seeking=true; audio.currentTime=+scrub.value; });
scrub.addEventListener("change",()=>{ seeking=false; });
full.addEventListener("click",()=>{
  const el=document.documentElement;
  if(!document.fullscreenElement) el.requestFullscreen?.().catch(()=>{});
  else document.exitFullscreen?.().catch(()=>{});
});
window.addEventListener("keydown",e=>{
  if(e.code==="Space"){ e.preventDefault(); audio.paused?audio.play():audio.pause(); }
  if(e.code==="ArrowLeft")  audio.currentTime=Math.max(0,audio.currentTime-2);
  if(e.code==="ArrowRight") audio.currentTime=Math.min(DUR,audio.currentTime+2);
});
window.LAB={
  hideGate(){ const g=document.getElementById("gate");
    if(g){ g.hidden=true; g.style.display="none"; }
    const h=document.getElementById("hud"); if(h) h.style.display="none"; },
  cues:CUES.map((c,i)=>({i,a:c[0],b:c[1],name:SCENE_NAMES[i]||("scene "+(i+1))})),
  lines:LINES,
  wordsIn(a,b){ return W.filter(x=>x.e>a&&x.s<b).map(x=>({w:x.w,s:x.s,e:x.e,l:x.l})); },
  seek(t){ audio.currentTime=t; },
  pin(t){ window.__T=t; },          // freeze the clock for capture
  unpin(){ window.__T=undefined; }, // resume the audio clock
  // arms the range only; seeking is the caller's job so we never issue two
  // seeks in one tick (the browser cancels the first and the element stutters)
  setLoop(a,b){ window.__LOOP=(a==null)?null:{a,b}; },
  play(){ return audio.play(); },
  pause(){ audio.pause(); },
  get time(){ return audio.currentTime; },
  audio
};
window.dispatchEvent(new Event("lab-ready"));
frame(0);
loop();

})();

</script>
