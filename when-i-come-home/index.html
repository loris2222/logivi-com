  ctx.fillStyle="rgba(255,255,255,0.28)";
  ctx.beginPath();
  ctx.moveTo(X,Y); ctx.lineTo(X+s,Y); ctx.lineTo(X+s-s*0.16,Y+s*0.16);
  ctx.lineTo(X+s*0.16,Y+s*0.16); ctx.lineTo(X+s*0.16,Y+s-s*0.16);
  ctx.lineTo(X,Y+s); ctx.closePath(); ctx.fill();
  // bottom and right shade
  ctx.fillStyle="rgba(0,0,0,0.26)";
  ctx.beginPath();
  ctx.moveTo(X+s,Y); ctx.lineTo(X+s,Y+s); ctx.lineTo(X,Y+s);
  ctx.lineTo(X+s*0.16,Y+s-s*0.16); ctx.lineTo(X+s-s*0.16,Y+s-s*0.16);
  ctx.lineTo(X+s-s*0.16,Y+s*0.16); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* A word CUT OUT of an arrow: a fat, stubby arrow in `color` with the word
   punched through it, so the background shows through the letters.

   The knockout is composed on an offscreen buffer. `destination-out` drawn
   straight onto the main canvas erases whatever has already been painted
   there, so the letters come out as holes onto nothing and no text appears. */
let aw_buf=null;
function arrowWord(txt, font, cx, cy, boxW, boxH, dir, o={}){
  if(!font) return {w:boxW,h:boxH};
  const col=o.color||P.warm;

  if(!aw_buf) aw_buf=document.createElement("canvas");
  const CW=ctx.canvas.width, CH=ctx.canvas.height;
  if(aw_buf.width!==CW || aw_buf.height!==CH){ aw_buf.width=CW; aw_buf.height=CH; }
  const mainCtx=ctx;
  const bx=aw_buf.getContext("2d");
  bx.setTransform(1,0,0,1,0,0);
  bx.clearRect(0,0,CW,CH);
  ctx=bx;
  ctx.setTransform(mainCtx.getTransform());

  ctx.save();
  ctx.translate(cx,cy);
  if(dir==="left") ctx.scale(-1,1);
  // An UP arrow keeps the same box as a sideways one -- same width, slightly
  // taller -- and gets its point by squashing the triangle onto the top edge,
  // rather than by rotating the whole block (which would turn it into a tall
  // narrow column that no longer matched the row beside it).
  const up=(dir==="up");
  const L=boxW, H=boxH;
  const hw=L/2, hh=H/2;
  // Fat and stubby: the head takes nearly half the length and flares to the
  // full height, and the shaft is most of that height rather than a thin bar.
  // A rectangle with a triangle on its end -- no barbs, no flare. The
  // triangle spans the block's full height, so the silhouette is a plain
  // signpost shape rather than an arrowhead.
  const headL=L*0.34;
  const sh=hh;
  const r=sh*0.16;

  const p=new Path2D();
  if(up){
    // a squat triangle across the top, on a rectangle below it
    const headH=H*0.34;
    const topY=-hh, baseY=-hh+headH;
    p.moveTo(0, topY);                  // the point
    p.lineTo(hw, baseY);
    p.lineTo(hw, hh-r);
    p.quadraticCurveTo(hw,hh,hw-r,hh);
    p.lineTo(-hw+r, hh);
    p.quadraticCurveTo(-hw,hh,-hw,hh-r);
    p.lineTo(-hw, baseY);
    p.closePath();
  } else {
    p.moveTo(-hw+r, -sh);
    p.lineTo(hw-headL, -sh);
    p.lineTo(hw, 0);                    // the point
    p.lineTo(hw-headL, sh);
    p.lineTo(-hw+r, sh);
    p.quadraticCurveTo(-hw,sh,-hw,sh-r);
    p.lineTo(-hw, -sh+r);
    p.quadraticCurveTo(-hw,-sh,-hw+r,-sh);
    p.closePath();
  }
  ctx.fillStyle=col;
  if(o.glow) shadow(col, o.glow);
  ctx.fill(p);
  noShadow();

  // the word, knocked out and centred in the arrow's BODY (the shaft plus the
  // head's base), not in its bounding box -- centring on the box alone pushes
  // the text toward the point and leaves a dead tail behind it
  const bodyL=up?L:(L-headL*0.60);
  const bodyCx=up?0:(-hw+bodyL/2);
  const inset=bodyL*0.80;
  // No height cap. The caller names the size so a set of arrows share one,
  // and clamping to each arrow's own box is what kept making the up arrow's
  // word smaller than its neighbours'. The caller gives the box enough room.
  const px=o.px || sizeForWidth(txt,font,inset);
  const b=inkBounds(txt,font,px);
  ctx.save();
  if(dir==="left") ctx.scale(-1,1);
  const ux=(dir==="left")?-bodyCx:bodyCx;     // keep the word upright
  const cxw=up?0:ux, cyw=up?(H*0.34/2):0;     // sits in the rectangle below
  ctx.globalCompositeOperation="destination-out";
  const gp=font.getPath(txt, cxw-b.w/2-b.x1, cyw+b.h/2, px);
  ctx.fill(new Path2D(gp.toPathData(2)));
  ctx.restore();
  ctx.restore();

  ctx=mainCtx;
  ctx.save();
  ctx.globalAlpha=o.alpha??1;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(aw_buf,0,0);
  ctx.restore();
  return {w:boxW,h:boxH};
}

/* Total advance width a word list needs at a given size, including the gaps
   between words — used to size a path so the text actually fits on it. */
function sampler_probe_len(words, strip, font, px){
  if(!font) return 0;
  let total=0;
  for(const wd of words) total+=font.getAdvanceWidth(strip(wd.w)+"  ", px);
  return total;
}

/* ---------- background ---------- */
function background(t){
  // While the 3D portal is showing, the 2D layer must stay transparent so the
  // WebGL canvas behind it is visible.
  if(GL.active){ ctx.clearRect(0,0,w,h); return; }
  // base
  ctx.fillStyle=P.ink; ctx.fillRect(0,0,w,h);
  const warmth = clamp(
      inv(t,44.0,48.5)*0.55            // chorus warms
    - inv(t,61.0,63.0)*0.5             // hinge kills it
    + inv(t,65.5,68.5)*0.6             // fire returns
    + inv(t,72.0,76.0)*0.35, 0, 1);
  const bass=env("bass",t), rms=env("rms",t);
  const r = Math.max(w,h)*(0.75+0.25*bass);
  const g=ctx.createRadialGradient(w/2,h*0.46,0,w/2,h*0.46,r);
  const c1 = warmth>0.02
    ? `rgba(${Math.round(lerp(18,70,warmth))},${Math.round(lerp(22,38,warmth))},${Math.round(lerp(38,30,warmth))},1)`
    : `rgba(${Math.round(lerp(14,24,rms))},${Math.round(lerp(17,30,rms))},${Math.round(lerp(30,48,rms))},1)`;
  g.addColorStop(0,c1); g.addColorStop(1,P.ink);
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  // vignette
  const v=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*0.3,w/2,h/2,Math.max(w,h)*0.78);
  v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(0,0,0,.72)");
  ctx.fillStyle=v; ctx.fillRect(0,0,w,h);
}

/* film grain */
let grainC=null;
function grain(){
  if(!grainC){ grainC=document.createElement("canvas"); grainC.width=grainC.height=110;
    const g=grainC.getContext("2d"), d=g.createImageData(110,110);
    for(let i=0;i<d.data.length;i+=4){ const v=200+Math.random()*55;
      d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=10; }
    g.putImageData(d,0,0); }
  ctx.save(); ctx.globalAlpha=.5; ctx.globalCompositeOperation="overlay";
  const p=ctx.createPattern(grainC,"repeat");
  ctx.fillStyle=p; ctx.translate((Math.random()*40|0)-20,(Math.random()*40|0)-20);
  ctx.fillRect(-40,-40,w+80,h+80); ctx.restore();
}
window.__engineLoaded=true;
window.__parts={CH,HOUSE,P,S:()=>S};
/* ============ SCENES ============ */
/* Each returns nothing; draws for time t. Characters/house are shared state. */

function reset(){ CH.m.vis=0; CH.f.vis=0; CH.m.face=1; CH.f.face=1;
  CH.m.roll=0; CH.f.roll=0; HOUSE.vis=0; HOUSE.door=0; HOUSE.light=0; }

/* 1 ── 0.36-2.90  "Did you know," + timeline rewind to "Long ago," */
function s1(t){
  // ---- clock face: snaps in just before "Did" (0.36) ----
  const face=inv(t,0.16,0.30);
  const fade=1-inv(t,1.70,2.22);            // clear by the time the rail stops (2.25)
  const cx=w/2, cy=h*0.44, R=Math.min(w,h)*0.21;

  if(face>0 && fade>0){
    ctx.save();
    ctx.globalAlpha=face*fade;
    ctx.translate(cx,cy);
    const pop=lerp(1.18,1,easeOut(face));   // fast snap in
    ctx.scale(pop,pop);
    // rim
    ctx.strokeStyle=P.coldDim; ctx.lineWidth=Math.max(1.4,2.2*S);
    ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.stroke();
    // hour ticks
    for(let k=0;k<12;k++){
      const ang=k*Math.PI/6, big=(k%3===0);
      const r0=R*(big?0.84:0.90), r1=R*0.96;
      ctx.globalAlpha=face*fade*(big?0.85:0.42);
      ctx.lineWidth=Math.max(1,(big?2.4:1.4)*S);
      ctx.beginPath();
      ctx.moveTo(Math.sin(ang)*r0,-Math.cos(ang)*r0);
      ctx.lineTo(Math.sin(ang)*r1,-Math.cos(ang)*r1);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---- the words ARE the hands ----
  // minute hand: "Did you" starts at 15m (3 o'clock, pointing right)
  // hour hand:   "know,"  starts at 6h  (pointing down)
  // winding back: minute sweeps -turns, hour sweeps -turns/12 (true ratio)
  // never stops: accelerates away, still turning as it fades out
  const sp=Math.max(0,t-0.92);
  const turns = sp*sp*2.6;                                // minute hand revolutions
  const minAng = Math.PI/2      - turns*Math.PI*2;        // from 3 o'clock
  const hrAng  = Math.PI        - (turns/12)*Math.PI*2;   // from 6 o'clock

  function hand(txt, ang, len, px, o){
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(ang - Math.PI/2);    // 0 = pointing right
    ctx.globalAlpha=o.alpha; ctx.fillStyle=o.color;
    setFont(px,{weight:o.weight,face:DISPLAY});
    ctx.textAlign="left"; ctx.textBaseline="middle";
    if(o.glow) shadow(o.glow,14);
    ctx.fillText(txt, R*0.14, 0);
    noShadow();
    ctx.restore();
  }

  const aDid=inv(t,0.36,0.46), aKnow=inv(t,0.80,0.90);
  if(fade>0){
    if(aDid>0)  hand("Did you", minAng, R, 34*S,
                   {alpha:aDid*fade, color:P.paper, weight:400});
    if(aKnow>0) hand("know,",   hrAng,  R*0.62, 30*S,
                   {alpha:aKnow*fade, color:P.cold, weight:600});
    // hub
    if(aDid>0){
      ctx.save(); ctx.globalAlpha=aDid*fade; ctx.fillStyle=P.warm;
      ctx.beginPath(); ctx.arc(cx,cy,Math.max(2,3.4*S),0,7); ctx.fill(); ctx.restore();
    }
  }

  // ---- timeline: starts the instant the hands begin winding (0.92) ----
  const tl=inv(t,0.92,1.25);
  const tlY=h*0.60;
  const tlOut=1-inv(t,3.55,3.95);

  // One continuous rail. Each year is a fixed point in rail-space; we travel
  // LEFT along it (into the past), so the rail slides RIGHT past the camera.
  // Wide spacing => only ~2 years visible at a time.
  const YEAR_GAP=Math.max(w*0.46, 300*S);
  const YEARS=[2026,2023,2020,2017];              // every 3rd year: fewer, slower stops
  const LONG_AGO_SLOT=YEARS.length;               // one more stop past 2017

  // camera position measured in slots travelled back from 2026
  // Travel curve: constant speed, then a smootherstep decay to a full stop.
  // Integrating the velocity profile keeps BOTH position and velocity continuous,
  // so the rail never jumps speed at the join. Comes to rest ~2.25s, just
  // before "Long" is sung at 2.30.
  const _u=inv(t,0.90,2.42), _p=0.60;
  function _travelled(u){
    if(u<=_p) return u;
    const x=(u-_p)/(1-_p);
    // ∫(1 - smootherstep(x)) dx  over the decay segment
    const I=x - (x*x*x*x*(x*(x*1.0-3.0)+2.5));   // x - (x⁶/... ) expanded below
    return _p + (1-_p)*I;
  }
  const _norm=_travelled(1);
  const travel=(_travelled(_u)/_norm)*LONG_AGO_SLOT;
  const camX=k => w*0.5 + (travel-k)*YEAR_GAP;    // screen x of slot k

  if(tl>0 && tlOut>0){
    const A=tl*tlOut;
    ctx.save();
    // the rail
    ctx.strokeStyle=P.coldDim; ctx.lineWidth=Math.max(1,1.8*S);
    ctx.globalAlpha=A*0.8;
    ctx.beginPath(); ctx.moveTo(0,tlY); ctx.lineTo(w,tlY); ctx.stroke();

    // minor ticks, 4 per year span
    ctx.fillStyle=P.coldDim;
    const k0=Math.floor((travel - 1.5)*3), k1=Math.ceil((travel + 1.5)*3);
    for(let m=k0;m<=k1;m++){
      const x=camX(m/3);
      if(x<-30*S||x>w+30*S) continue;
      if(m%3===0) continue;
      ctx.globalAlpha=A*0.26;
      ctx.fillRect(x, tlY-6*S, Math.max(1,1.4*S), 12*S);
    }

    // year ticks + big labels, below the line
    setFont(44*S,{weight:600,face:SANS});
    ctx.textAlign="center"; ctx.textBaseline="top";
    for(let k=0;k<YEARS.length;k++){
      const x=camX(k);
      if(x<-200*S||x>w+200*S) continue;
      const edge=clamp(Math.min(x+120*S, w-x+120*S)/(w*0.22),0,1);
      ctx.globalAlpha=A*0.95*edge;
      ctx.fillStyle=P.coldDim;
      ctx.fillRect(x, tlY-15*S, Math.max(1.4,2.4*S), 30*S);
      ctx.globalAlpha=A*0.62*edge;
      ctx.fillStyle=P.muted;
      ctx.fillText(String(YEARS[k]), x, tlY+20*S);
    }

    // "Long ago," is a PLACE on the rail — always there, arrives by travelling
    const xLA=camX(LONG_AGO_SLOT);
    if(xLA>-w*0.6 && xLA<w*1.6){
      const edge=clamp(Math.min(xLA+160*S, w-xLA+160*S)/(w*0.22),0,1);
      ctx.globalAlpha=A*edge;
      ctx.fillStyle=P.warm;
      ctx.fillRect(xLA, tlY-17*S, Math.max(1.6,2.8*S), 34*S);
      setFont(52*S,{weight:300,face:DISPLAY});
      ctx.globalAlpha=A*edge;
      ctx.fillStyle=P.paper;
      ctx.fillText("Long ago,", xLA, tlY+18*S);
    }
    ctx.restore();
  }

}

/* 2 ── 4.02-6.54  birth of the two characters from j(just) and i(playing) */
/* The 3D pipeline is the constrained side (camera, projection, ring), so the
   2D layer is driven to MEET it rather than the other way round. S2_DOCK holds
   where the 3D discs will appear; the bounce path and the text line are then
   offset so the splice is seamless. */
const S2_DOCK={ready:false, mx:0,my:0,mr:0, fx:0,fy:0,fr:0};

function s2(t){
  // Three-line letter layout:
  //   L1  "There were"            hand-written, large, top-left
  //   L2  "just two teens playing" indented, the karaoke bounce line
  //   L3  "and no"                 lower still (the trampoline, later)
  // ---- fall timeline ----
  const T_FALL =6.54;    // "no" is sung; the floor gives way
  const T_WHITE=7.45;    // full white; scene 3 takes over
  const fallK=inv(t,T_FALL,T_WHITE);

  // The camera tracks the falling pair, so the written world rushes UPWARD
  // with the same acceleration they fall at.
  const G=1.0;
  const camRise=G*fallK*fallK*h*1.85;

  const fade=1;                       // the white-out ends the scene, not a fade
  ctx.save();
  ctx.translate(0,-camRise);

  // --- L1: the hand-written opening ---
  const hwPx=Math.min(w*0.085, h*0.155);
  const hwX=w*0.085, hwY=h*0.245;
  const prog=inv(t,3.92,4.78);
  if(prog>0){
    drawHandwritten("There were", hwX, hwY, hwPx, prog,
      {color:P.paper, alpha:fade, align:"left", glow:P.warm, glowSize:9});
  }

  // --- L2: "just two teens playing", indented under the opening ---
  const L2=["just","two","teens","playing"];
  const x2=hwX+w*0.075;                    // indent
  const avail2=w-x2-w*0.075;               // to the right margin
  // solve the type size so the line nearly fills its allocated width
  const px2=(()=>{
    const probe=100;
    setFont(probe,{weight:400,face:PLAY});
    const gap=ctx.measureText(" ").width*1.3;
    const wd=L2.reduce((s,q)=>s+ctx.measureText(q).width,0)+gap*(L2.length-1);
    return Math.min(avail2/wd*probe, h*0.17);   // cap so it can't overwhelm vertically
  })();
  const y2=h*0.50;
  setFont(px2,{weight:400,face:PLAY});
  const sp2=ctx.measureText(" ").width*1.3;
  const spans={};
  {
    let x=x2;
    for(const word of L2){
      const wd=ctx.measureText(word).width;
      spans[word]={x, wd, cx:x+wd/2};
      x+=wd+sp2;
    }
  }
  const IMPACT=6.16;                       // the pen reaches "playing"
  const blown=inv(t,IMPACT,IMPACT+0.05);   // 1 once it is destroyed
  ctx.save();
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  for(const word of L2){
    const o=W.find(q=>q.l===2&&q.w===word);
    const a2=inv(t,o.s,o.s+0.12)*fade;
    if(a2<=0) continue;
    if(word==="playing" && blown>=1) continue;   // gone after the hit
    ctx.globalAlpha=a2;
    ctx.fillStyle=P.paper;
    setFont(px2,{weight:400,face:PLAY});
    ctx.fillText(word, spans[word].x, y2);
  }
  ctx.restore();

  // --- L3: "and no" is not typed at all — it IS the portal below ---
  const px3=px2;
  const y3=h*0.74;

  // --- the pen stroke continues off the written line and strikes "playing" ---
  {
    const tail=handTail("There were", hwPx, hwX, hwY);
    if(tail){
      const target={x:spans["playing"].cx, y:y2-px2*0.34};
      // travels while "two"/"teens" are sung, lands exactly on IMPACT
      // leaves the page the instant the "e" is finished (4.78)
      const travel=inv(t,4.78,IMPACT);
      if(travel>0 && blown<1){
        const head=penTrail(tail,target,travel,
          {color:P.paper, alpha:fade*0.95,
           // leaves the "e" at the pen's own stroke weight, then tapers
           w0:(hwPx/S)*0.055, w1:0.5,
           lift:0.46, lift2:0.22});
        // the leading tip is the same glowing nib that wrote the line
        if(travel<1){
          ctx.save();
          ctx.globalAlpha=fade;
          const r=px2*0.085;
          const g2=ctx.createRadialGradient(head.x,head.y,0,head.x,head.y,r*2.1);
          g2.addColorStop(0,"rgba(255,244,215,1)");
          g2.addColorStop(0.4,"rgba(255,196,120,.7)");
          g2.addColorStop(1,"rgba(255,181,99,0)");
          ctx.fillStyle=g2;
          ctx.beginPath(); ctx.arc(head.x,head.y,r*2.1,0,7); ctx.fill();
          ctx.fillStyle="rgba(255,250,236,.95)";
          ctx.beginPath(); ctx.arc(head.x,head.y,r*0.5,0,7); ctx.fill();
          ctx.restore();
        }
      }
      // the explosion
      const k=inv(t,IMPACT,IMPACT+0.85);
      if(k>0&&k<1) burst(target.x,target.y,k,{n:34,r:190,size:3.4,g:120});
    }
  }

  // --- the karaoke bounce ---
  // He appears on "just" and hops word to word. She appears on "two" and
  // follows the same route one word behind, so they arrive on "playing"
  // side by side: his path ends left of centre, hers right of centre.
  // The 2D characters keep their own size and resting height; only the END of
  // the hop path is moved to meet where the 3D discs will appear.
  const R_M=px2*0.30, R_F=px2*0.285;
  const headY=y2-px2*0.72-R_M*0.55;
  const PAIR=R_M*1.05;                     // half the gap between them at rest

  const HOPS=[
    {w:"just",    t:4.68},
    {w:"two",     t:4.98},
    {w:"teens",   t:5.16},
    {w:"playing", t:5.60}
  ];

  // offs shifts the whole route sideways so the two settle beside each other
  function hopPos(now, offs, finalX){
    if(now<HOPS[0].t) return null;
    let i=0;
    while(i<HOPS.length-1 && now>=HOPS[i+1].t) i++;
    const cur=HOPS[i], nxt=HOPS[i+1];
    const isLast=(k)=>k===HOPS.length-1;
    const xAt=(k)=> isLast(k)&&finalX!==undefined ? finalX : spans[HOPS[k].w].cx+offs;
    const cx=xAt(i);
    if(!nxt){
      const k=now-cur.t;
      return {x:cx, y:headY-Math.abs(Math.sin(k*5.0))*7*S};
    }
    const u=clamp((now-cur.t)/(nxt.t-cur.t),0,1);
    const nx=xAt(i+1);
    return {x:lerp(cx,nx,u), y:headY-Math.sin(u*Math.PI)*46*S};
  }

  // he leads; she runs the same route delayed by one word-gap so the hops
  // alternate rather than move in lockstep
  const LAG=0.30;
  const pm=hopPos(t,     -PAIR);
  const pf=hopPos(t-LAG, +PAIR);

  if(pm){
    CH.m.x=pm.x; CH.m.y=pm.y; CH.m.r=R_M; CH.m.roll=0; CH.m.face=1;
    CH.m.vis=inv(t,4.68,4.80)*fade;
  } else CH.m.vis=0;

  if(pf){
    CH.f.x=pf.x; CH.f.y=pf.y; CH.f.r=R_F; CH.f.roll=0; CH.f.face=1;
    CH.f.vis=inv(t,4.98,5.10)*fade;        // she appears on "two"
  } else CH.f.vis=0;

  if(fallK<=0){
    if(CH.f.vis>0){ drawChar(CH.f,t,{color:P.warm}); femaleMark(CH.f); }
    if(CH.m.vis>0)  drawChar(CH.m,t,{color:P.male});
  }

  ctx.restore();                      // end camera transform

  // ---- the portal + the falling pair live in the 3D layer ----
  // They stay FLAT discs through the fall — identical to the 2D characters —
  // and only become true 3D in scene 3, once they are through.
  {
    const openK=inv(t,6.18,6.40);        // snaps open fast so "AND NO" reads
    GL.active = openK>0;
    if(GL.ready && GL.active){
      // the ring sits exactly under the pair, in screen coords, and rides the
      // same rising camera as the 2D layer so the two stay locked together
      // The 3D side renders at its own natural position; the 2D bounce has
      // already been driven to land there (see DOCK below), so no per-frame
      // reconciliation is needed. Place the ring under the docked pair.
      // Freeze the pair's live 2D geometry the frame before the fall, and tell
      // the 3D layer to reproduce it exactly. The 2D layout is what we have
      // approved, so it is the source of truth.
      if(fallK<=0 && CH.m.vis>0 && CH.f.vis>0){
        S2_DOCK.mx=CH.m.x; S2_DOCK.my=CH.m.y; S2_DOCK.mr=CH.m.r;
        S2_DOCK.fx=CH.f.x; S2_DOCK.fy=CH.f.y; S2_DOCK.fr=CH.f.r;
        S2_DOCK.ready=true;
      }
      const haveDock=S2_DOCK.ready;
      const midX=haveDock?(S2_DOCK.mx+S2_DOCK.fx)/2:spans["playing"].cx;
      const midY=haveDock?(S2_DOCK.my+S2_DOCK.fy)/2:headY;
      // aim the pan at the PAIR's own screen position; the ring sits below
      const sx=midX/w;
      const sy=midY/h;
      GL.target={ mx:S2_DOCK.mx, my:S2_DOCK.my, mr:S2_DOCK.mr,
                  fx:S2_DOCK.fx, fy:S2_DOCK.fy, fr:S2_DOCK.fr,
                  have:haveDock };
      GL.clock=t;                       // drive the iris shader
      GL.render(openK, fallK, 0, sx, sy);
    }
  }

  // ---- white-out into scene 3 ----
  const wh=inv(t,7.16,T_WHITE);
  if(wh>0){
    ctx.save();
    ctx.globalAlpha=easeIn(wh);
    ctx.fillStyle="#ffffff";
    ctx.fillRect(0,0,w,h);
    ctx.restore();
  }
}

/* 3 ── 7.50-10.60  Worries/Sadness struck through & shattered BY the characters */
function s3(t){
  // Scene 3 is fully 3D: the pair are now spheres rolling down a school desk.
  // The 2D layer only carries the "no" that punctuates each destruction.
  GL.active=true;
  if(GL.ready && GL.renderer) renderDesk(t, GL.renderer);

  // --- the 2D "no", spliced in as each word is destroyed ---
  const beats=[{at:8.50, cy:h*0.30}, {at:10.46, cy:h*0.30}];
  for(const b of beats){
    const a2=inv(t,b.at,b.at+0.14);
    const out=1-inv(t,b.at+0.62,b.at+0.95);
    if(a2<=0||out<=0) continue;
    const px=96*S;
    const pop=lerp(1.35,1.0,easeOut(a2));
    ctx.save();
    ctx.translate(w/2, b.cy);
    ctx.scale(pop,pop);
    ctx.globalAlpha=a2*out;
    ctx.fillStyle=P.hot;
    setFont(px,{weight:900,face:SANS});
    ctx.textAlign="center"; ctx.textBaseline="middle";
    shadow(P.hot, 26);
    ctx.fillText("no", 0, 0);
    noShadow();
    ctx.restore();
  }
}

/* 4 ── 11.70-14.20  ski-jump ramp; characters roll down; "!" launches them apart */
function s4(t){
  // Scene 4 is fully 3D: the pair bounce down the line, each hop solved from
  // the word timings so every landing is on the beat.
  GL.active=true;
  if(GL.ready && GL.renderer) renderHop(t, GL.renderer);
}

/* 5 ── 15.52-17.88  characters gone; "And so, you, do." alone; "do." holds 1.38s */
function s5(t){
  CH.m.vis=0; CH.f.vis=0;
  // Solve the type size so the line nearly fills the frame width, rather than
  // using a fixed value — it then stays correct at any viewport size.
  const ws=wordsOf(6);
  const px=(()=>{
    const probe=100;
    setFont(probe,{weight:300,face:DISPLAY});
    const gap=ctx.measureText(" ").width*1.3;
    const wd=ws.reduce((s,q)=>s+ctx.measureText(q.w).width,0)+gap*(ws.length-1);
    return Math.min((w*0.86)/wd*probe, h*0.30);
  })();
  const R=revealLine(6,t,{size:px/S,weight:300,face:DISPLAY,cy:h*0.52,
    color:P.paper,fade:0.16,rise:18,alpha:1-inv(t,17.55,17.92)});
  // "do." swells on its 1.38s hold — starting AFTER the word has landed.
  // Beginning at 16.50 overlapped the reveal, which read as early.
  const d=inv(t,16.80,17.75);
  if(R&&d>0){
    const it=R.items.find(o=>o.word.w==="do.");
    if(it){
      ctx.save(); ctx.globalAlpha=(1-inv(t,17.55,17.92))*0.5*(1-d);
      drawWord("do.", it.cx, R.cy-R.px*0.33, R.px*(1+d*0.5),
        {weight:300,face:DISPLAY,color:P.warm,alpha:(1-d)*0.6,glow:P.warm,glowSize:26});
      ctx.restore();
    }
  }
}

/* 6 ── 17.88-19.92  male alone on the i of "without"; the i stretches up = standing */
/* The YOU block is drawn by BOTH scene 6 and scene 7 and must not move at the
   cut, so its geometry is defined once here rather than in each scene. */
function youBlock(w,h){
  const PADX=w*0.065, PADY=h*0.075;
  const L=PADX, Rt=w-PADX, T=PADY, B=h-PADY;
  const H=B-T;
  const standW=w*0.13;
  const hYou=H*0.42;
  return {PADX,PADY,L,Rt,T,B,H,standW,hYou,
          yYou0:T, yYou1:T+hYou,
          youL:L, youR:Rt-standW};
}

function s6(t){
  // Purely typographic. Every element is STRETCHED to fill its box exactly —
  // glyphs distort rather than letterbox, so the frame is edge-to-edge full.
  CH.m.vis=0; CH.f.vis=0;
  const font=BLOCK.ready?BLOCK.font:(HW.ready?HW.font:null);
  if(!font) return;
  // Everything dissolves at the cut EXCEPT "YOU", which carries straight into
  // scene 7 — it is the word that opens the next line too.
  const out=1-inv(t,19.95,20.28);          // the rest fade away
  const youOut=1;                          // YOU persists
  if(out<=0 && youOut<=0) return;

  // the composition box: inset from the frame so the type has air around it
  const PADX=w*0.065, PADY=h*0.075;
  const L=PADX, Rt=w-PADX, T=PADY, B=h-PADY;
  const H=B-T;

  // three bands, stacked tight, summing to the full height
  const hYou=youBlock(w,h).hYou;
  const hWit=H*0.27;
  const hFur=H*0.29;
  const yYou0=T,              yYou1=yYou0+hYou;
  const yWit0=yYou1,          yWit1=yWit0+hWit;
  const yFur0=yWit1,          yFur1=B;

  // ---------- band 1: YOU filling the width, STAND as a column on the right
  const standW=w*0.13;                       // the column's share of the width
  const aYou=inv(t,17.88,18.06)*youOut;
  if(aYou>0){
    stretchInto("YOU", font, L, yYou0, Rt-standW, yYou1,
      {alpha:aYou, color:P.paper});
  }
  {
    // STAND: each letter rotated upright, the stack filling the band's height
    const word="STAND";
    const n=word.length;
    const cellH=hYou/n;                       // equal share per letter
    for(let i=0;i<n;i++){
      const ch=word[i];
      const ai=inv(t, 18.02+i*0.055, 18.02+i*0.055+0.09)*out;
      if(ai<=0) continue;
      // build UPWARD from the bottom of the band
      const cy1=yYou1-i*cellH, cy0=cy1-cellH;
      ctx.save();
      // rotate about the cell centre, then stretch to fill it
      const cx=(Rt-standW)+standW/2, cyc=(cy0+cy1)/2;
      ctx.translate(cx,cyc);
      ctx.rotate(-Math.PI/2);
      // after rotating, the cell's width/height swap
      stretchInto(ch, font, -cellH/2, -standW/2, cellH/2, standW/2,
        {alpha:ai, color:P.warm});
      ctx.restore();
    }
  }

  // ---------- band 2: WITHOUT, edge to edge ----------
  const aW=inv(t,18.40,18.62)*out;
  if(aW>0){
    stretchInto("WITHOUT", font, L, yWit0, Rt, yWit1,
      {alpha:aW, color:P.cold});
  }

  // ---------- band 3: FURTHER + ADO, one run, two colours ----------
  const aF=inv(t,19.00,19.24)*out;
  const aA=inv(t,19.60,19.84)*out;
  if(aF>0){
    stretchRun(
      [{text:"FURTHER", alpha:aF, color:P.muted},
       {text:"ADO",     alpha:aA, color:P.hot}],
      font, L, yFur0, Rt, yFur1);
  }
}

/* 7 ── 20.30-22.02  he stays put, looks up then down on the rhythm */
function s7(t){
  // "YOU" carries over from scene 6 and becomes the face. Colour does the
  // character switching: green for him, warm for her, each wiping in from the
  // left across the word as it is sung.
  CH.m.vis=0; CH.f.vis=0;
  const font=BLOCK.ready?BLOCK.font:(HW.ready?HW.font:null);
  if(!font) return;
  // Scene 7 does not fade: scene 8's panel falls over it, so it must still be
  // on screen at the cut. `out` is kept so the scene can also be drawn by s8.
  const out=1;

  const PADX=w*0.065, PADY=h*0.075;
  const L=PADX, Rt=w-PADX, T=PADY, B=h-PADY;
  const H=B-T;

  // YOU sits where scene 6 left it: the top band, minus the STAND column
  const YB=youBlock(w,h);
  const standW=YB.standW;
  const yYou0=YB.yYou0, yYou1=YB.yYou1;
  const youL=YB.youL, youR=YB.youR;
  const youW=youR-youL;                    // the width the lines below match

  // --- the colour wipes: left-to-right as each "you" is sung ---
  const wipeM=inv(t,20.30,20.62);          // green, on "You"
  const wipeF=inv(t,21.23,21.58);          // warm,  on "you"

  // base word
  ctx.save(); ctx.globalAlpha=out;
  stretchInto("YOU", font, youL, yYou0, youR, yYou1, {color:P.paper});
  ctx.restore();

  // male green, wiping in
  if(wipeM>0){
    ctx.save();
    ctx.globalAlpha=out;
    ctx.beginPath();
    ctx.rect(youL, yYou0-H, (youR-youL)*easeOut(wipeM), H*3);
    ctx.clip();
    stretchInto("YOU", font, youL, yYou0, youR, yYou1, {color:P.male});
    ctx.restore();
  }
  // female warm, wiping in over the top
  if(wipeF>0){
    ctx.save();
    ctx.globalAlpha=out;
    ctx.beginPath();
    ctx.rect(youL, yYou0-H, (youR-youL)*easeOut(wipeF), H*3);
    ctx.clip();
    stretchInto("YOU", font, youL, yYou0, youR, yYou1, {color:P.warm});
    ctx.restore();
  }

  // --- the O becomes the character: its counter FILLS with their colour as
  // --- the wipe passes, and the face sits dark on that fill ---
  const oBox=stretchedCharBox("YOU", 1, font, youL, yYou0, youR, yYou1);
  if(oBox){
    // Inset matched to the counter of this weight: the previous 20/18% left a
    // visible ring of background around the fill.
    const inner={
      x0:oBox.x0+oBox.w*0.165, x1:oBox.x1-oBox.w*0.165,
      y0:oBox.y0+oBox.h*0.145, y1:oBox.y1-oBox.h*0.145,
      get cx(){return (this.x0+this.x1)/2;}, get cy(){return (this.y0+this.y1)/2;},
      get w(){return this.x1-this.x0;},     get h(){return this.y1-this.y0;}
    };
    // fill the counter, clipped by the SAME wipe that colours the word, so the
    // head fills in step with the letters
    const fillHead=(wipe,col)=>{
      if(wipe<=0) return;
      ctx.save();
      ctx.globalAlpha=out;
      ctx.beginPath();
      ctx.rect(youL, yYou0-H, (youR-youL)*easeOut(wipe), H*3);
      ctx.clip();
      ctx.fillStyle=col;
      ctx.beginPath();
      // a touch of overfill so the ellipse meets the counter curve cleanly
      ctx.ellipse(inner.cx, inner.cy, inner.w/2*1.035, inner.h/2*1.025, 0, 0, 7);
      ctx.fill();
      ctx.restore();
    };
    fillHead(wipeM, P.male);
    fillHead(wipeF, P.warm);

    // gaze: up on "up," then down on "down,"
    const up  =inv(t,20.82,21.00);
    const down=inv(t,21.66,21.88);
    const gaze=-up + down*2;                  // -1 up .. +1 down
    // the face reads dark against the filled head
    const faceIn=Math.max(wipeM,wipeF)*out;
    if(faceIn>0.15){
      faceInCounter(inner, {gaze:clamp(gaze,-1,1), alpha:out, color:"#1a1410"});
    }
    // her bow appears on the O when she takes over
    if(wipeF>0.25){
      const bw=inner.w*0.52, by=oBox.y0-oBox.h*0.02;
      ctx.save();
      ctx.globalAlpha=out*inv(t,21.30,21.55);
      ctx.fillStyle=P.bow;
      ctx.strokeStyle="rgba(26,12,4,.75)";
      ctx.lineWidth=Math.max(1,bw*0.08);
      const lobe=(dx,rot)=>{
        ctx.beginPath();
        ctx.ellipse(inner.cx+dx, by, bw*0.30, bw*0.19, rot, 0, 7);
        ctx.fill(); ctx.stroke();
      };
      lobe(-bw*0.34,-0.5); lobe(bw*0.34,0.5);
      ctx.beginPath(); ctx.arc(inner.cx, by, bw*0.13, 0, 7); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  // --- LOOK UP and LOOK DOWN: two stacked lines, both persisting, each
  // --- matched to YOU's width so the block reads as one column ---
  {
    const gap=H*0.045;
    const bandTop=yYou1+gap;
    const lineH=(B-bandTop-gap)/2;
    const aUp  =inv(t,20.46,20.70)*out;
    const aDown=inv(t,21.41,21.66)*out;
    if(aUp>0){
      stretchInto("LOOK UP", font, youL, bandTop, youL+youW, bandTop+lineH,
        {alpha:aUp, color:P.paper});
    }
    if(aDown>0){
      const y2=bandTop+lineH+gap;
      stretchInto("LOOK DOWN", font, youL, y2, youL+youW, y2+lineH,
        {alpha:aDown, color:P.paper});
    }
  }
}

/* 8 ── 22.11-24.05  smear + actual sweat on him; "frown." curves down */
/* The face rises through the end of scene 8 and into scene 9, so its geometry
   and the stack's travel are defined once and read by both. */
function faceRise(t,w,h){
  const PADX=w*0.065, PADY=h*0.075;
  const T=PADY, B=h-PADY, H=B-T;
  // starts as the brow morph opens the arch, settles early in scene 9
  const k=easeOut(inv(t, 23.85, 25.05));
  // the head is larger than the frame: only part of it is ever seen
  const rx=w*0.78, ry=h*0.92;
  // Keeps climbing through scene 9 so the brows, eyes and finally the mouth
  // come into view, rather than stopping at the forehead.
  // Settles with the crown still inside the frame: the top of the head must
  // stay visible, so the rise stops rather than running off the top.
  const k2=easeOut(inv(t, 24.05, 25.60));
  const topY=lerp(B+h*0.10, T+h*0.045, Math.max(k, k2));
  // the whole word stack is pushed up by the same amount
  const push=(B+h*0.10-topY)*0.62;
  return {k, rx, ry, topY, push, cx:w*0.5, T,B,H,PADX,PADY};
}

/* The magnified mouth line that scenes 9 and 10 share.
   Zoom and framing are SOLVED from the frame rather than fixed, because the
   line's rise and thickness scale with the mouth's quantum: at 9.5x on a 16:9
   frame the rise alone exceeded the frame height. */
function mouthGeom(FR,w,h){
  const mx=FR.cx, my=FR.topY+FR.ry*0.78;
  const mw=FR.rx*0.34;
  const mq=Math.min(FR.rx, FR.ry*0.85);
  // vertical budget at zoom 1: rise + drop + stroke, plus sky above
  const rise=mq*0.055, drop=mq*0.004, band=mq*0.022;
  const budget=rise+drop+band*1.55;
  // fill 76% of the height with that budget, never magnifying past 9.5x
  const sc=Math.min(9.5, (h*0.76)/budget);
  const anchorY=band*sc*0.55 + rise*sc + band*sc*0.5;
  // the pan runs from the cut to the end of the line
  const t0=26.45, t1=30.85;
  // --- the descent ---
  // The mouth arrives at its right end still RISING (slope -0.178), with only
  // ~0.09h of sky left above it but 0.75h of room below. So the second path
  // honours that slope only briefly -- a short leading handle -- then commits
  // downward. That makes the turn sharp, which is what the lack of headroom
  // demands: a gentle arc would leave the frame before it came back.
  const endX=mw*sc, endY=-mq*0.055*sc;    // mouth end, relative to the anchor
  // The end tangent is 3*(P3-P2) of the mouth bezier. It is NOT a constant:
  // mw scales with width while mq is clamped by height, so the slope runs
  // from -0.18 on wide frames to -0.32 on narrow ones. Deriving it keeps the
  // join kink-free at every aspect ratio.
  const SLOPE=(3*(-mq*0.055 - mq*0.004)) / (3*(mw - mw*0.45));
  const RUN=w*1.2, DROP=h*0.50;
  const D0={x:endX,         y:endY},
        D1={x:endX+RUN*0.10, y:endY+SLOPE*RUN*0.10},
        D2={x:endX+RUN*0.55, y:endY+DROP},
        D3={x:endX+RUN,      y:endY+DROP};
  const descent=(u)=>{
    const v=1-u;
    return { x: v*v*v*D0.x + 3*v*v*u*D1.x + 3*v*u*u*D2.x + u*u*u*D3.x,
             y: v*v*v*D0.y + 3*v*v*u*D1.y + 3*v*u*u*D2.y + u*u*u*D3.y };
  };
  // --- the flat tail ---
  // The descent lands flat (D2 and D3 share a y), so the line carries straight
  // on at that height. At the end of the pan the descent would otherwise stop
  // dead centre, leaving bare orange to the right; the tail runs a full width
  // past it so the band still crosses the whole frame and reads as continuing
  // off-screen, which is what scene 11 cuts away from.
  const TAIL=w*1.0;
  const D4={x:D3.x+TAIL, y:D3.y};

  // Where the line sits once scene 10's pan has finished: the flat tail, at
  // the descent's landing height. Scene 11 continues from exactly this, so
  // the two scenes share one number rather than each guessing it.
  const restY=anchorY+(-mq*0.055*sc)+h*0.50;

  // --- the zoom out, which STRADDLES the cut at 30.88 ---
  // It begins while scene 10 is still running and finishes inside scene 11,
  // so the camera never changes behaviour at the cut itself: by the time the
  // scene changes the move is already underway and simply continues.
  // Two stages. The first straddles the cut so the camera never changes
  // behaviour there. The second keeps pulling back through scene 11, because
  // the pan's glide carries the line far enough left that "A PLACE YOU" would
  // otherwise slide off the frame; widening the view brings it back in and
  // still leaves the heart room to its right.
  const ZOOM_A=30.30, ZOOM_B=31.90, ZOOM_TO=0.62;
  // The second stage starts AT the cut rather than waiting for the first to
  // finish, so the view is already widening while the glide is still carrying
  // the line left. Starting it later let the "A" clip the left edge mid-scene
  // before the zoom caught up and pulled it back.
  const ZOOM_B2=30.88, ZOOM_C=33.20, ZOOM_END=0.38;
  const zoomOut=(tt)=>lerp(1, ZOOM_TO, easeIO(inv(tt, ZOOM_A, ZOOM_B)))
                     +(ZOOM_END-ZOOM_TO)*easeIO(inv(tt, ZOOM_B2, ZOOM_C));

  // the pan runs to the end of the DESCENT; the tail is what covers the frame
  const span=D3.x;          // default; s10 overrides it with the lyric's length
  // LINEAR in time, after a short ease off the cut. An easeIO across the whole
  // scene made the scroll crawl at both ends and race through the middle, so
  // words laid out evenly bunched up at the start and overlapped at the end.
  // A brief ramp keeps the cut from jolting without distorting the spacing.
  const EASE=0.35, DUR=t1-t0;
  const vel=span/(DUR-EASE/2);
  // The pan eases in off the cut, runs at constant speed, then GLIDES to a
  // stop across the next cut. Stopping dead at the end of scene 10 made the
  // motion break visibly at 30.88; the glide carries the same velocity into
  // scene 11 and decelerates there, which also pulls the path far enough left
  // to bring the extension and the heart into frame.
  // 2.4s. Long enough that the path clears a space to the right of
  // "A PLACE YOU" for the heart (at 1.6s they overlapped by ~90px and the
  // heart fell off a wide frame), short enough that the "A" never leaves the
  // left edge. Paired with a zoom whose second stage starts at the cut, the
  // text now keeps ~87px of clearance from the left edge for the whole scene
  // instead of grazing it.
  const GLIDE=2.4;
  const panOf=(SPAN)=>{
    const v=SPAN/(DUR-EASE/2);
    return (tt)=>{
      const dt=clamp(tt-t0, 0, DUR+GLIDE);
      if(dt<EASE) return v*dt*dt/(2*EASE);
      if(dt<=DUR) return v*(EASE/2+(dt-EASE));
      // decelerate linearly from v to 0 over GLIDE seconds
      const g=clamp((dt-DUR)/GLIDE,0,1);
      return v*(EASE/2+(DUR-EASE)) + v*GLIDE*(g-g*g/2);
    };
  };
  const pan=panOf(span);
  // Where the heart comes to rest at the end of scene 11, so scene 12 can
  // pick the path up from its right edge without re-deriving any of it.
  const heartR=(tipX,panNow,z)=>{
    const R=Math.min(w,h)*0.15;
    return {R:R*z, cx:(tipX+R*0.98-panNow-w*0.5)*z+w*0.5};
  };
  return {mx,my,mw,mq,sc,anchorY,pan,panOf,band:band*sc,restY,zoomOut,heartR,
          endX,endY,D0,D1,D2,D3,D4,descent};
}

function s8(t){
  // Opens on scene 7's end state. "SWEAT" falls in carrying a panel, then the
  // rest of the line cascades up from BEHIND it, each word rising into its own
  // band until the frame is full. Sweat drips run inside the letterforms,
  // starting with SWEAT since it has been there longest.
  CH.m.vis=0; CH.f.vis=0;
  const font=BLOCK.ready?BLOCK.font:(HW.ready?HW.font:null);
  if(!font) return;

  const PADX=w*0.065, PADY=h*0.075;
  const L=PADX, Rt=w-PADX, T=PADY, B=h-PADY;
  const H=B-T;

  // --- the previous scene, still underneath until the panel covers it ---
  const drop=inv(t,22.11,22.52);
  if(drop<1) s8_under(t);

  if(drop<=0) return;
  const e=easeOut(drop);
  const edgeY=lerp(-h*0.08, B, e);

  // the panel that wipes the old frame away
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,w,edgeY); ctx.clip();
  ctx.fillStyle=P.ink; ctx.fillRect(0,0,w,h);
  ctx.restore();

  // --- the face, rising into the arch the brow morph opens ---
  const FR=faceRise(t,w,h);
  if(FR.k>0){
    foreheadShape(FR.cx, FR.topY, FR.rx, FR.ry, {color:P.warm, alpha:1});
    // the sweat is already there as the forehead appears, so scene 9 can
    // carry on with the same band rather than introducing a new one
    sweatBand(FR.cx, FR.topY, FR.rx, FR.ry,
      {alpha:1, frameW:w, frameH:h, wipe:0});
  }

  // --- the six bands, filling the padded box exactly ---
  const WORDS=[
    {txt:"SWEAT",   at:22.11, col:P.cold},
    {txt:"RUNNING", at:22.50, col:P.paper},
    {txt:"DOWN",    at:22.82, col:P.cold},
    {txt:"ON",      at:23.18, col:P.paper},
    {txt:"YOUR",    at:23.30, col:P.cold},
    {txt:"FROWN",   at:23.52, col:P.paper}
  ];
  const n=WORDS.length;
  const bandH=H/n;

  // Every word FALLS from above, emerging from behind the one already in
  // place. Painting bottom-first means each new word slides out from under
  // its predecessor rather than over it.
  for(let i=n-1;i>=0;i--){
    const W2=WORDS[i];
    // The stack sits in its own bands until the forehead arrives, then rides
    // its leading edge up and out — the same anchor scene 9 uses, so the two
    // agree across the cue boundary.
    const restY1=T+(i+1)*bandH;
    const rideY1=FR.topY-(n-1-i)*bandH;
    const y1=(FR.k>0) ? Math.min(restY1, rideY1) : restY1;
    const y0=y1-bandH;
    const fall=i===0 ? drop : inv(t, W2.at, W2.at+0.30);
    if(fall<=0) continue;
    const k=easeOut(fall);
    // drops into place from one band ABOVE, hidden behind the word up there
    const off=-(1-k)*bandH;
    const dripP=clamp((t-(W2.at+0.12))/1.5, 0, 1);
    // No clip needed: because this word is painted BEFORE the one above it,
    // its predecessor is drawn over the top and hides it until it descends
    // clear. That is what makes it read as emerging from behind.
    if(i===n-1){
      // FROWN's lower edge bows upward into a brow, cueing the face that
      // rises in the next scene
      // FROWN lands first (it arrives at 23.52), THEN morphs — so the brow
      // reads as a change of shape rather than how the word flew in.
      const bow=inv(t,23.82,24.05)*0.42;
      if(bow>0){
        browWord(W2.txt, font, L, y0+off, Rt, y1+off, bow,
          {color:W2.col, alpha:1});
      } else {
        drippingWord(W2.txt, font, L, y0+off, Rt, y1+off,
          {color:W2.col, alpha:1, drip:dripP, seedOffset:i*37, dripN:14});
      }
    } else {
      drippingWord(W2.txt, font, L, y0+off, Rt, y1+off,
        {color:W2.col, alpha:1, drip:dripP, seedOffset:i*37, dripN:14});
    }
  }
}

/* 9 ── 24.07-25.03  reprise of "And so, you, do." harder */
function s9(t){
  // The face keeps rising out of scene 8, revealing a strained expression.
  // The line is written on a band of sweat across the forehead.
  CH.m.vis=0; CH.f.vis=0;
  const font=BLOCK.ready?BLOCK.font:(HW.ready?HW.font:null);
  if(!font) return;

  const FR=faceRise(t,w,h);
  const PADX=w*0.065, PADY=h*0.075;
  const L=PADX, Rt=w-PADX, T=PADY, B=h-PADY, H=B-T;

  // --- the push into the mouth line, which becomes scene 10's path ---
  const zoom=inv(t,26.00,26.45);
  ctx.save();
  if(zoom>0){
    const k=easeIO(zoom);
    // the mouth sits at ry*0.78 below the crown; magnify about that point.
    // Scene 10 continues this exact framing, so both read it from mouthGeom.
    const G=mouthGeom(FR,w,h);
    const mx=G.mx, my=G.my;
    const sc=lerp(1, G.sc, k);
    // Frame the mouth LOW: its right corner rises ~295px on screen at full
    // magnification, so anchoring at mid-height leaves the band pinned to the
    // top of the frame by the end of scene 10's pan. h*0.64 keeps ~118px of
    // sky above the band at its highest. Scene 10 uses the same anchor, so
    // the cut at 26.45 stays seamless.
    // The pivot is eased ALONG WITH the scale. Translating to the mouth at
    // full strength while the scale was still 1 snapped the face up by ~370px
    // the instant the push began -- a jump before any magnification. Easing
    // the destination from the mouth's own position to the frame's anchor
    // makes the transform the identity at k=0, so the move starts from
    // nothing.
    const dstX=lerp(mx, w*0.5, k);
    const dstY=lerp(my, G.anchorY, k);
    ctx.translate(dstX, dstY);
    ctx.scale(sc,sc);
    ctx.translate(-mx, -my);
  }

  // the expression tightens as the line is sung
  const strain=inv(t,24.20,25.40);
  bigFace(FR.cx, FR.topY, FR.rx, FR.ry, {strain});

  // The line slides across the forehead and WIPES the sweat as it passes.
  // the sweat clears as the text sweeps past, so the wipe follows the same
  // travel — but from the right, since that is the direction of motion
  const wipe=easeIO(inv(t,24.07,25.90));
  const band=sweatBand(FR.cx, FR.topY, FR.rx, FR.ry,
                       {alpha:1, frameW:w, frameH:h, wipe});

  // --- the tail of scene 8's stack, still travelling up and out ---
  {
    const WORDS=[
      {txt:"SWEAT",   col:P.cold},{txt:"RUNNING",col:P.paper},
      {txt:"DOWN",    col:P.cold},{txt:"ON",     col:P.paper},
      {txt:"YOUR",    col:P.cold},{txt:"FROWN",  col:P.paper}
    ];
    const n=WORDS.length, bandH=H/n;
    // The stack sits ON the forehead's leading edge, so once that edge has
    // climbed past the top of the frame the words are gone entirely.
    const stackBottom=FR.topY;
    for(let i=n-1;i>=0;i--){
      const y1=stackBottom-(n-1-i)*bandH, y0=y1-bandH;
      if(y0>h || y1<0) continue;
      const W2=WORDS[i];
      if(i===n-1) browWord(W2.txt, font, L, y0, Rt, y1, 0.42, {color:W2.col});
      else drippingWord(W2.txt, font, L, y0, Rt, y1,
             {color:W2.col, drip:1, seedOffset:i*37, dripN:14});
    }
  }

  // --- the line travels right-to-left across the band, like the timeline ---
  // It is wider than the band, so the band acts as a viewport onto a moving
  // rail of type: it enters from the right and exits to the left.
  {
    const out=1-inv(t,26.42,26.45);
    if(out>0){
      // Each word is placed on the rail so its CENTRE crosses the middle of
      // the screen exactly when it is sung — the uneven lyric spacing is
      // solved for, not evened out.
      const src=wordsOf(10);
      const words=src.map(q=>({text:q.w.replace(/[,.]/g,"").toUpperCase(), s:q.s}));
      const bh=(band.y1-band.y0)*0.78;
      const px=bh*1.25;
      const speed=w*0.62;                    // px per second along the rail
      ctx.save();
      ctx.beginPath();
      ctx.rect(band.x0, band.y0-bh, band.x1-band.x0, (band.y1-band.y0)+bh*2);
      ctx.clip();
      // soft towelling blue-white rather than the flat brown
      syncedRail(words, font, px, speed, w*0.5, t,
        {alpha:out, towel:true,
         color:"#f2f8fc", edgeColor:"#a9cfe4",
         baselineY:band.my+bh*0.36,
         clipX0:band.x0, clipX1:band.x1, minGap:0.30});
      ctx.restore();
    }
  }
  ctx.restore();                 // end the zoom transform
}

/* 10 ── 26.45-30.85  the mountain: text IS the terrain, both roll it together */
let s10_buf=null;
/* The mountain: scene 10's path and its knocked-out lyric. Scene 11 keeps
   rendering BOTH -- the line continues off the left edge and some of scene
   10's words are still in frame at the cut -- and extends the path onward
   from its true end, so nothing is redrawn or re-placed across the cut. */
function mountainPath(G,w,h,font){
  const A={x:w*0.5-G.mw*G.sc,          y:G.anchorY},
        B={x:w*0.5-G.mw*0.2*G.sc,      y:G.anchorY+G.mq*0.012*G.sc},
        C={x:w*0.5+G.mw*0.45*G.sc,     y:G.anchorY+G.mq*0.004*G.sc},
        Dd={x:w*0.5+G.mw*G.sc,         y:G.anchorY-G.mq*0.055*G.sc};
  const E={x:w*0.5+G.D1.x, y:G.anchorY+G.D1.y},
        F={x:w*0.5+G.D2.x, y:G.anchorY+G.D2.y},
        Gg={x:w*0.5+G.D3.x, y:G.anchorY+G.D3.y},
        Hh={x:w*0.5+G.D4.x, y:G.anchorY+G.D4.y};
  const bez3=(P0,P1,P2,P3,u)=>{
    const v=1-u;
    return { x: v*v*v*P0.x+3*v*v*u*P1.x+3*v*u*u*P2.x+u*u*u*P3.x,
             y: v*v*v*P0.y+3*v*v*u*P1.y+3*v*u*u*P2.y+u*u*u*P3.y };
  };
  const L1=Dd.x-A.x, L2=Gg.x-Dd.x, L3=Hh.x-Gg.x, LT=L1+L2+L3;
  const curve=(u)=>{
    const d=u*LT;
    if(d<=L1) return bez3(A,B,C,Dd, d/L1);
    if(d<=L1+L2) return bez3(Dd,E,F,Gg, (d-L1)/L2);
    const f=(d-L1-L2)/L3;
    return { x: Gg.x+(Hh.x-Gg.x)*f, y: Gg.y+(Hh.y-Gg.y)*f };
  };
  const sampler=makePathSampler(curve, 1100);
  const BAND=G.band;
  const allWords=wordsOf(11).concat(wordsOf(12));
  const strip=(x)=>x.replace(/^['"]+|[.,!?;:'"]+$/g,"").toUpperCase();
  const PX=BAND*0.80;
  const SPACE=font.getAdvanceWidth(" ", PX)*0.9;
  const arcAtX=(X)=>{
    let lo=0, hi=sampler.length;
    for(let i=0;i<44;i++){
      const m=(lo+hi)/2;
      if(sampler.at(m).x < X) lo=m; else hi=m;
    }
    return (lo+hi)/2;
  };
  const startArc=arcAtX(w*0.30);
  const natural=allWords.reduce((acc,x)=>
        acc+font.getAdvanceWidth(strip(x.w), PX), 0) + SPACE*(allWords.length-1);
  const usable=(sampler.length-startArc)*0.94;
  const STRETCH=clamp(usable/Math.max(1,natural), 1, 1.5);
  const S=[];
  {
    let s0=startArc;
    for(let i=0;i<allWords.length;i++){
      S.push(s0);
      s0+=font.getAdvanceWidth(strip(allWords[i].w), PX)*STRETCH+SPACE*STRETCH;
    }
  }
  const lastEnd=S[S.length-1]
      +font.getAdvanceWidth(strip(allWords[allWords.length-1].w), PX)*STRETCH;
  const panSpan=Math.max(0, (lastEnd-startArc) - w*0.42);
  return {curve,sampler,BAND,PX,SPACE,STRETCH,S,allWords,strip,
          A,Dd,Gg,Hh,startArc,lastEnd,panSpan,
          panAt:(tt)=>G.panOf(panSpan)(tt)};
}

function s10(t){
  // The mouth line from scene 9, magnified, with a camera pan along it and
  // the lyric knocked OUT of the band, so the words read as orange holes in
  // the black. The path and layout come from mountainPath, which scene 11
  // also uses so the two cannot drift apart across the cut.
  CH.m.vis=0; CH.f.vis=0;
  const font=BLOCK.ready?BLOCK.font:(HW.ready?HW.font:null);
  if(!font) return;

  ctx.fillStyle=P.warm;
  ctx.fillRect(0,0,w,h);

  const FR=faceRise(t,w,h);
  const G=mouthGeom(FR,w,h);
  const M=mountainPath(G,w,h,font);
  const {curve,sampler,BAND,PX,S,allWords,strip,STRETCH}=M;
  const pan=M.panAt(t);

  // --- compose ---
  // The band is composed OFFSCREEN so the knocked-out text reveals the orange
  // cleanly. Punching directly on the main canvas erases to transparent and
  // leaves a dirty grey edge instead of a crisp hole.
  if(!s10_buf){ s10_buf=document.createElement("canvas"); }
  if(s10_buf.width!==ctx.canvas.width || s10_buf.height!==ctx.canvas.height){
    s10_buf.width=ctx.canvas.width; s10_buf.height=ctx.canvas.height;
  }
  const bx=s10_buf.getContext("2d");
  bx.setTransform(1,0,0,1,0,0);
  bx.clearRect(0,0,s10_buf.width,s10_buf.height);

  const mainCtx=ctx;
  ctx=bx;
  ctx.setTransform(mainCtx.getTransform());
  ctx.save();
  // The zoom out starts BEFORE the cut to scene 11 and continues through it,
  // so the move is already in progress when the scene changes and the camera
  // never appears to switch behaviour. It pulls back about the point the band
  // rests at, so the line stays put while the frame widens around it.
  const zo=G.zoomOut(t);
  if(zo!==1){
    ctx.translate(w*0.5, G.restY);
    ctx.scale(zo,zo);
    ctx.translate(-w*0.5, -G.restY);
  }
  ctx.translate(-pan,0);

  // 1. the band
  ctx.beginPath();
  const p0=curve(0);
  ctx.moveTo(p0.x,p0.y);
  for(let i=1;i<=600;i++){ const p=curve(i/600); ctx.lineTo(p.x,p.y); }
  ctx.strokeStyle=P.ink;
  ctx.lineWidth=BAND;
  ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.stroke();

  // 2. the words, cut OUT of it
  ctx.save();
  ctx.globalCompositeOperation="destination-out";
  for(let i=0;i<allWords.length;i++){
    if(t < allWords[i].s-0.08) continue;      // not sung yet
    textOnPath(strip(allWords[i].w), font, PX, sampler, S[i],
      {alpha:1, color:"#000", offsetY:PX*0.35, tracking:1.0, stretch:STRETCH});
  }
  ctx.restore();
  ctx.restore();

  ctx=mainCtx;
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(s10_buf,0,0);
  ctx.restore();
}

/* The line's screen y at a given path point, under the scene's zoom. */
function lineYOf(ap,G,zo){ return (ap.y-G.restY)*zo+G.restY; }

/* 11 ── 30.88-33.70  scene 10's line CONTINUES -- same geometry, same pan,
   still carrying whatever of its lyric is in frame -- and extends onward from
   its true end. "A place, you," is written above it; the line loops into a
   heart in place of "love." */
function s11(t){
  CH.m.vis=0; CH.f.vis=0;
  const font=BLOCK.ready?BLOCK.font:(HW.ready?HW.font:null);
  if(!font) return;

  ctx.fillStyle=P.warm;
  ctx.fillRect(0,0,w,h);

  const FR=faceRise(t,w,h);
  const G=mouthGeom(FR,w,h);
  const M=mountainPath(G,w,h,font);
  const {curve,sampler,BAND,PX,S,allWords,strip,STRETCH}=M;

  // The pan CONTINUES across the cut and glides to a stop here. Freezing it at
  // 30.88 broke the motion visibly -- scene 10 ends at full speed -- and left
  // the path's end off the right edge, so the extension and the heart drew
  // outside the frame. The glide both smooths the cut and carries the path
  // far enough left to bring them into view.
  const pan=M.panAt(t);
  const zo=G.zoomOut(t);

  // --- the extension ---
  // Drawn FORWARD from the path's true end, not from a fresh line: the tip
  // advances as the words are sung, so the terrain is being made.
  const tipS=sampler.length;
  const endPt=sampler.at(tipS);
  // The extension runs until its tip reaches a fixed SCREEN position, so the
  // heart lands in the same place at any frame width. Extending by a fixed
  // w*0.70 instead put the tip off the right edge on a wide frame, because
  // the path end is already further right there.
  const draw=easeIO(inv(t, 30.88, 32.86));
  const panEndT=M.panAt(32.86);
  const tipTargetPath=panEndT + w*0.62;     // where the tip should sit at "love."
  const tipX=lerp(endPt.x, Math.max(endPt.x+w*0.12, tipTargetPath), draw);

  // --- compose ---
  // Same offscreen knockout as scene 10, so the words stay orange holes in
  // the band rather than changing technique at the cut.
  if(!s10_buf){ s10_buf=document.createElement("canvas"); }
  if(s10_buf.width!==ctx.canvas.width || s10_buf.height!==ctx.canvas.height){
    s10_buf.width=ctx.canvas.width; s10_buf.height=ctx.canvas.height;
  }
  const bx=s10_buf.getContext("2d");
  bx.setTransform(1,0,0,1,0,0);
  bx.clearRect(0,0,s10_buf.width,s10_buf.height);

  const mainCtx=ctx;
  ctx=bx;
  ctx.setTransform(mainCtx.getTransform());
  ctx.save();
  if(zo!==1){
    ctx.translate(w*0.5, G.restY);
    ctx.scale(zo,zo);
    ctx.translate(-w*0.5, -G.restY);
  }
  ctx.translate(-pan,0);

  // 1. the band: scene 10's whole path, then the extension
  ctx.beginPath();
  const p0=curve(0);
  ctx.moveTo(p0.x,p0.y);
  for(let i=1;i<=600;i++){ const p=curve(i/600); ctx.lineTo(p.x,p.y); }
  ctx.lineTo(tipX, endPt.y);
  ctx.strokeStyle=P.ink;
  ctx.lineWidth=BAND;
  ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.stroke();

  // 2. scene 10's lyric, still knocked out of the band where it is in frame
  ctx.save();
  ctx.globalCompositeOperation="destination-out";
  for(let i=0;i<allWords.length;i++){
    textOnPath(strip(allWords[i].w), font, PX, sampler, S[i],
      {alpha:1, color:"#000", offsetY:PX*0.35, tracking:1.0, stretch:STRETCH});
  }
  ctx.restore();
  ctx.restore();

  ctx=mainCtx;
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(s10_buf,0,0);
  ctx.restore();

  // The heart is drawn on the MAIN canvas, after the band is composited: it is
  // red rather than knocked out, so it must not sit inside the buffer where
  // the lyric punches holes.
  const hb=inv(t, 32.86, 33.58);
  if(hb>0){
    const R=Math.min(w,h)*0.15;
    const hx=(tipX+R*0.98-pan-w*0.5)*zo+w*0.5;
    const hy=(endPt.y-R*0.10-G.restY)*zo+G.restY;
    ctx.save();
    ctx.translate(hx,hy);
    ctx.scale(R*zo/78, R*zo/78);
    ctx.strokeStyle=P.red;                 // a true red, not the orange `hot`
    ctx.lineWidth=BAND*(78/R);
    ctx.lineCap="round"; ctx.lineJoin="round";
    const hp=new Path2D();
    hp.moveTo(-78,-6);
    hp.bezierCurveTo(-78,-62,-14,-70, 0,-28);
    hp.bezierCurveTo( 14,-70, 78,-62, 78,-6);
    hp.bezierCurveTo( 78, 34, 20, 62,  0, 86);
    hp.bezierCurveTo(-20, 62,-78, 34,-78,-6);
    ctx.setLineDash([520*hb, 10000]);
    ctx.stroke(hp);
    ctx.restore();
  }

  // --- the new words, ON TOP of the line ---
  // Placed to the LEFT of where the heart will land, so the two never collide:
  // the heart grows from the tip, and the type is laid out ending before it.
  {
    const ws=wordsOf(13).filter(q=>q.w!=="love.");
    const TPX=BAND*zo*0.86;
    const widths=ws.map(q=>font.getAdvanceWidth(strip(q.w), TPX));
    const SP=font.getAdvanceWidth(" ", TPX)*1.1;
    const total=widths.reduce((a,b)=>a+b,0)+SP*(ws.length-1);
    // Anchored to the PATH, not to the advancing tip: the words sit at a fixed
    // arc position on the line and travel with it, so they do not creep right
    // as the extension draws. They are placed just after scene 10's last word
    // so the two lyrics never collide.
    const anchorS=M.lastEnd+SP*2;
    const ap=sampler.at(Math.min(anchorS, sampler.length));
    const sx=(ap.x-pan-w*0.5)*zo+w*0.5;
    let x=sx;
    const baseY=(ap.y-G.restY)*zo+G.restY - BAND*zo*0.78;
    // The words FALL INTO the line and fade as the scene closes, rather than
    // being cut off mid-frame: they drop the short distance onto the band and
    // are gone by 33.70, so the next scene opens on a clean line.
    const sink=easeIO(inv(t, 33.18, 33.66));
    const drop=sink*(baseY<0?0:(lineYOf(ap,G,zo)-baseY));
    for(let i=0;i<ws.length;i++){
      const a=inv(t, ws[i].s-0.12, ws[i].s+0.10)*(1-sink);
      if(a>0){
        ctx.save();
        ctx.globalAlpha=a;
        ctx.fillStyle=P.ink;
        const rise=(1-inv(t, ws[i].s-0.12, ws[i].s+0.10))*BAND*zo*0.35;
        const gp=font.getPath(strip(ws[i].w), x, baseY+rise+drop, TPX);
        ctx.fill(new Path2D(gp.toPathData(2)));
        ctx.restore();
      }
      x+=widths[i]+SP;
    }
  }
}

/* 12 ── 33.70-37.35  the path picks up from the right of the heart, carries on
   and draws a house -- outline and roof only -- while "A PLACE CALLED HOME"
   fills the left of the frame. */
function s12(t){
  CH.m.vis=0; CH.f.vis=0;
  HOUSE.vis=0;
  const font=BLOCK.ready?BLOCK.font:(HW.ready?HW.font:null);
  if(!font) return;

  ctx.fillStyle=P.warm;
  ctx.fillRect(0,0,w,h);

  const FR=faceRise(t,w,h);
  const G=mouthGeom(FR,w,h);
  const M=mountainPath(G,w,h,font);
  const {curve,sampler,BAND,PX,S,allWords,strip,STRETCH}=M;

  // Scene 11's end state, read rather than re-derived: its pan had stopped and
  // its zoom had settled, so both are simply held here.
  const panEnd=M.panAt(33.70);
  const zo=G.zoomOut(33.70);

  // This scene makes its OWN room by easing further left as it draws, which
  // is what gives the house space to the right of the heart and the text the
  // left of the frame. Scene 11 is untouched.
  const slide=easeIO(inv(t, 33.70, 35.60))*w*0.18;
  const pan=panEnd+slide;

  const endPt=sampler.at(sampler.length);
  const tipX=Math.max(endPt.x+w*0.12, M.panAt(32.86)+w*0.62);
  const HR=G.heartR(tipX, pan, zo);
  const lineY=(endPt.y-G.restY)*zo+G.restY;

  // --- the path, continuing from the right of the heart ---
  // It starts exactly where the heart's right edge sits and draws onward,
  // so the line reads as one continuous stroke through the whole sequence.
  const x0=HR.cx+HR.R*0.96;
  const draw=easeIO(inv(t, 33.70, 35.31));     // complete on "home,"
  const HOUSE_W=Math.min(w*0.30, (w-(x0+w*0.05))*0.85);
  const runTo=x0+w*0.05+HOUSE_W;
  const tip=lerp(x0, runTo, draw);

  const BW=BAND*zo;

    // door at full strength the instant `dive` went above zero snapped the
    // whole scene sideways (the house corner moved 200px in one frame) before
    // any magnification happened. Easing the centre from the frame's own
    // middle to the door's makes the transform the identity at dive=0, so the
    // move reads as one continuous push rather than a jump and then a zoom.
    // The door's centre must sit at a screen position that eases from where it
    // already is to the middle of the frame. Solving the translate from THAT
    // keeps the door locked under the camera for the whole move; interpolating
    // the pivot instead made the door swing out of frame and come back,
    // because the pivot moved linearly while the scale grew geometrically.

  const font=BLOCK.ready?BLOCK.font:(HW.ready?HW.font:null);

    {ws:wordsOf(16), cy:h*0.40, key:"best", dir:"up"},
    {ws:(ki>=0?l17.slice(0,ki+1):l17), cy:h*0.58, key:"last", dir:"right"},

    const kept=r.ws.filter(o=>o.w.replace(/[,.]/g,"")!==r.key);
    if(!kept.length) continue;
    const tx=kept.map(o=>o.w.replace(/[,.]/g,"")).join(" ").toUpperCase();
    ARROW_PX=Math.min(ARROW_PX,
      Math.min(sizeForWidth(tx, font, w-PADX*2-w*0.30), h*0.16));

  // Rather than cross-fade to a new drawing, the same four corners are moved:
  // the arrow's box grows to fill the frame and its proportions ease to a
  // house's, so one shape carries the cut.

  if(mo>0){
    const bh=ARROW_PX*2.35, bw=(w*0.30)*0.80;
    // where the BEST arrow sits at rest
    const r2=rows[1];
    const kept2=r2.ws.filter(o=>o.w.replace(/[,.]/g,"")!==r2.key);
    const txt2=kept2.map(o=>o.w.replace(/[,.]/g,"")).join(" ").toUpperCase();
    const px2=Math.min(sizeForWidth(txt2, font, w-PADX*2-w*0.30), h*0.16);
    const b2=inkBounds(txt2, font, px2);
    const x02=w*0.5-(b2.w+w*0.30)/2;
    const cx0=x02+b2.w+w*0.30*0.5, cy0=r2.cy-bh*0.34/2;

    // The house it becomes is tetBoard's house, not a separately computed one.
    // The board snaps its body to a whole number of cells, which makes it
    // ~5px taller than a free-form 1.02 ratio -- enough to jump at the cut if
    // the two were derived independently.
    const B=tetBoard(w,h);

    const cx1=B.cx, cy1=B.cy;

    const cx=lerp(cx0,cx1,mo), cy=lerp(cy0,cy1,mo);

    // the roof's share of the height grows from the arrow's squat triangle

    ctx.translate(cx,cy);
    const hw2=bw2/2, hh2=bh2/2, roofH=bh2*roofF;
    const r3=hh2*0.16*(1-mo);          // the rounding straightens out
    const p=new Path2D();
    p.moveTo(0,-hh2);
    p.lineTo(hw2,-hh2+roofH);
    p.lineTo(hw2,hh2-r3);
    p.quadraticCurveTo(hw2,hh2,hw2-r3,hh2);
    p.lineTo(-hw2+r3,hh2);
    p.quadraticCurveTo(-hw2,hh2,-hw2,hh2-r3);
    p.lineTo(-hw2,-hh2+roofH);
    p.closePath();
    ctx.fillStyle=P.warm;
    shadow(P.warm, bh2*0.22);
    ctx.fill(p);
    noShadow();

      const wa=1-easeIO(clamp(inv(t,45.05,45.40),0,1));

        ctx.save();

        ctx.globalCompositeOperation="destination-out";
        const gp=font.getPath("BEST", -bw3.w/2-bw3.x1,
                              bh2*roofF/2+bw3.h/2, ARROW_PX);
        ctx.fill(new Path2D(gp.toPathData(2)));
        ctx.restore();
      }
    }

    ctx.restore();
  }
}

  // with the house small at its centre.
  const pz=tetPullback(t);

  ctx.fill(tetHousePath(B));

  // 96 pieces land over the drop window, each starting above the roof and
  // falling to its solved resting place. They are staggered so the board
  // builds from the bottom up, and each one eases in rather than arriving at
  // a constant speed, so it reads as a drop rather than a slide.
  const T0=45.80, T1=47.95;

  // everything is clipped to the house, so pieces appear from behind the roof
  ctx.clip(tetHousePath(B));
  for(let i=0;i<N;i++){
    const pc=TET_PLAN[i];
    const t0=T0+i*STAGGER;
    const k=inv(t, t0, t0+FALL);
    if(k<=0) continue;
    const bx=tetPieceBox(pc);
    // Roof pieces have NEGATIVE rows -- they sit above the body, inside the
    // triangle -- so the resting position is computed from the row index
    // directly and the drop starts above the ridge either way.
    const restY=B.cellY(bx.y0);
    const fromY=B.top-B.cell*(bx.h+2);

  ctx.restore();

  // so type over the top would say it twice.
  ctx.restore();                 // end the pull-back
