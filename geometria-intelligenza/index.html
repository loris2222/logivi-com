<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La geometria dell'intelligenza</title>
<link rel="stylesheet" href="style.css?v=44">
</head>
<body>

<div id="lang-switch">
  <button data-lang="it" type="button">IT</button><button data-lang="en" type="button">EN</button>
</div>
<div id="deck"></div>
<div id="progress"></div>
<div id="slide-num"></div>
<div id="help"><div class="inner">
  <h3>Tastiera</h3>
  <table>
    <tr><td><kbd>&rarr;</kbd> <kbd>spazio</kbd></td><td>avanti</td></tr>
    <tr><td><kbd>&larr;</kbd></td><td>indietro</td></tr>
    <tr><td><kbd>f</kbd></td><td>schermo intero</td></tr>
    <tr><td><kbd>g</kbd></td><td>vai alla slide</td></tr>
    <tr><td><kbd>e</kbd></td><td>modifica il testo — solo in locale</td></tr>
    <tr><td><kbd>?</kbd></td><td>questo aiuto</td></tr>
  </table>
  <p style="margin-top:1em;color:var(--ink-faint);font-size:.85rem">
    La modifica del testo funziona solo aprendo il file in locale.
  </p>
  <p style="margin-top:1.2em;color:var(--ink-faint);font-size:.9rem">
    Ogni passo del grafico è una slide, così puoi fermarti mentre la classe discute.
  </p>
</div></div>

<script src="chart.js?v=44"></script>
<script src="slides.js?v=44"></script>
<script>
/* ============================================================
   deck runtime
   ============================================================ */
(function () {
  'use strict';

  const deck  = document.getElementById('deck');
  const bar   = document.getElementById('progress');
  const num   = document.getElementById('slide-num');
  const help  = document.getElementById('help');

  /* ---- lingua -------------------------------------------------
     Scelta salvata nel browser; altrimenti italiano. `window.LANG`
     e' letta anche da chart.js, che la usa per le etichette. */
  const LINGUE = ['it', 'en'];
  function linguaIniziale() {
    const q = new URLSearchParams(location.search).get('lang');
    if (LINGUE.indexOf(q) >= 0) return q;
    try {
      const sav = localStorage.getItem('lezione-ai-lingua');
      if (LINGUE.indexOf(sav) >= 0) return sav;
    } catch (e) {}
    return 'it';
  }
  window.LANG = linguaIniziale();

  // Prende una stringa o un oggetto {it, en}.
  const T = v => (v && typeof v === 'object' && !Array.isArray(v))
    ? (v[window.LANG] !== undefined ? v[window.LANG] : v.it)
    : v;

  let idx = 0;
  const N = SLIDES.length;

  // One persistent chart element per chartGroup, reparented as you navigate.
  const chartLayers = {};

  /* ============================================================
     MODALITÀ MODIFICA (tasto `e`)

     Serve a correggere il testo mentre provi la lezione: clicchi
     su una frase, la riscrivi, e vedi subito se sta ancora dentro
     la slide.

     Le modifiche NON finiscono nel sorgente da sole: restano nel
     localStorage del browser. Quando hai finito lo dici a Claude,
     che le rilegge e le riporta a mano in slides.js. Così il
     sorgente resta pulito e nessuno script lo riscrive a caso.

     Ogni modifica è salvata con una chiave stabile
     "<indice slide>|<percorso nel DOM>" così si può ritrovare
     esattamente il pezzo di testo da cambiare nel sorgente.
     ============================================================ */
  /* La modalita' modifica serve solo mentre si prova la lezione sul
     proprio computer. Sulla versione pubblicata non deve esistere:
     niente tasto `e`, niente badge, niente contenteditable. */
  const IN_LOCALE = ['localhost', '127.0.0.1', ''].indexOf(location.hostname) >= 0
                    || location.protocol === 'file:';
  const EDIT_KEY = 'lezione-ai-modifiche';
  let editMode = false;

  const loadEdits = () => {
    try { return JSON.parse(localStorage.getItem(EDIT_KEY) || '{}'); }
    catch (e) { return {}; }
  };
  const saveEdits = obj => {
    try { localStorage.setItem(EDIT_KEY, JSON.stringify(obj)); }
    catch (e) { console.warn('salvataggio non riuscito', e); }
  };

  // Percorso stabile di un nodo dentro la sua slide: la catena di
  // indici figlio. Non dipende dal testo, quindi regge anche dopo
  // che il testo è stato modificato.
  function nodePath(node, root) {
    const parts = [];
    let n = node;
    while (n && n !== root) {
      const p = n.parentNode;
      if (!p) break;
      parts.unshift(Array.prototype.indexOf.call(p.children, n));
      n = p;
    }
    return parts.join('.');
  }

  // Gli elementi che ha senso poter riscrivere: testo, non struttura.
  const EDITABLE = 'h1, h2, h3, p, li, .kicker, .big-statement, .tag, .hl, .src, .label, .hint, .t, .s, .sub, .chart-caption';

  function applyStoredEdits() {
    const edits = loadEdits();
    if (!Object.keys(edits).length) return 0;
    let applied = 0;
    slideEls.forEach((el, i) => {
      el.querySelectorAll(EDITABLE).forEach(n => {
        const key = i + '|' + nodePath(n, el);
        if (Object.prototype.hasOwnProperty.call(edits, key)) {
          n.innerHTML = edits[key].dopo;
          n.dataset.edited = '1';
          applied++;
        }
      });
    });
    return applied;
  }

  function setEditMode(on) {
    editMode = on;
    document.body.classList.toggle('editing', on);
    slideEls.forEach((el, i) => {
      el.querySelectorAll(EDITABLE).forEach(n => {
        if (on) {
          // Il testo di partenza serve per sapere, dopo, che cosa è
          // cambiato davvero rispetto al sorgente.
          if (!n.dataset.originale) n.dataset.originale = n.innerHTML;
          n.setAttribute('contenteditable', 'true');
          n.spellcheck = true;
        } else {
          n.removeAttribute('contenteditable');
        }
      });
    });
    if (!on) captureEdits();
    showEditBadge();
  }

  function captureEdits() {
    const edits = loadEdits();
    slideEls.forEach((el, i) => {
      el.querySelectorAll(EDITABLE).forEach(n => {
        if (!n.dataset.originale) return;
        const key = i + '|' + nodePath(n, el);
        const adesso = n.innerHTML.trim();
        const prima = n.dataset.originale.trim();
        if (adesso !== prima) {
          edits[key] = {
            slide: i + 1,
            prima: prima,
            dopo: adesso,
            quando: new Date().toISOString()
          };
          n.dataset.edited = '1';
        } else {
          delete edits[key];
          delete n.dataset.edited;
        }
      });
    });
    saveEdits(edits);
  }

  function showEditBadge() {
    let b = document.getElementById('edit-badge');
    const n = Object.keys(loadEdits()).length;
    if (!editMode && !n) { if (b) b.remove(); return; }
    if (!b) {
      b = document.createElement('div');
      b.id = 'edit-badge';
      document.body.appendChild(b);
    }
    const plur = n === 1 ? 'modifica' : 'modifiche';
    b.innerHTML = editMode
      ? `<b>MODIFICA</b> &nbsp;·&nbsp; ${n} ${plur} &nbsp;·&nbsp; <kbd>esc</kbd> per uscire`
      : `${n} ${plur} ${n === 1 ? 'non ancora riportata' : 'non ancora riportate'} nel sorgente`;
    b.className = editMode ? 'on' : 'off';
  }

  // Per Claude: stampa tutte le modifiche in un colpo solo.
  window.modifiche = () => {
    const e = loadEdits();
    console.log(JSON.stringify(e, null, 2));
    return e;
  };
  window.azzeraModifiche = () => {
    localStorage.removeItem(EDIT_KEY);
    location.reload();
  };

  // Build every slide up front; charts render lazily on show.
  SLIDES.forEach((s, i) => {
    const el = document.createElement('section');
    el.className = 'slide' + (s.cls ? ' ' + s.cls : '');
    el.dataset.i = i;
    el.innerHTML = T(typeof s.html === 'function' ? s.html() : (s.html || ''));
    deck.appendChild(el);
  });

  const slideEls = Array.from(deck.children);

  /* Safety net. The CSS scales type off vmin, which handles every resolution
     I could test -- but a projector in a room you have not seen can still
     surprise you (an unusual aspect ratio, a browser zoom left at 125%, a
     font that renders larger than the fallback stack expects).

     So after laying a slide out, measure it. If the content genuinely does
     not fit, shrink that slide's root font size until it does. Cheap, runs
     once per slide, and means nothing is ever cut off on the day. */
  function fit(el) {
    // Reset anything a previous fit applied.
    el.style.fontSize = '';
    el.style.removeProperty('--pad-y');
    el.style.removeProperty('--pad-x');
    if (el.scrollHeight <= el.clientHeight + 1) return;

    // Squeeze the frame first: padding and gaps are fixed-ish costs that
    // font scaling alone cannot recover on a very short viewport.
    el.style.setProperty('--pad-y', '1.5vh');
    el.style.setProperty('--pad-x', '3vw');

    let pct = 100;
    while (pct > 35 && el.scrollHeight > el.clientHeight + 1) {
      pct -= 4;
      el.style.fontSize = pct + '%';
    }
  }

  function show(i, dir) {
    i = Math.max(0, Math.min(N - 1, i));
    slideEls.forEach(e => e.classList.remove('active'));
    const el = slideEls[i];
    el.classList.add('active');
    idx = i;

    const s = SLIDES[i];

    // Chart slides render into ONE shared chart layer per chart group, which
    // physically moves between slides. Keeping the same SVG alive is what lets
    // objects glide to new positions instead of being destroyed and re-popped
    // -- the axis re-sort depends on it entirely.
    if (s.chart) {
      const host = el.querySelector('.chart');
      if (host) {
        const group = s.chartGroup || ('solo-' + i);
        let layer = chartLayers[group];
        if (!layer) {
          layer = document.createElement('div');
          layer.className = 'chart-layer';
          chartLayers[group] = layer;
        }
        // Move the group's layer into this slide's host, preserving its SVG.
        if (layer.parentNode !== host) {
          host.innerHTML = '';
          host.appendChild(layer);
        }
        const cfg = typeof s.chart === 'function' ? s.chart() : s.chart;
        if (cfg.mode === '3d') {
          // La slide che apre la terza dimensione: parte piatta e
          // si apre da sola, così si vede il passaggio 2D -> 3D.
          layer.innerHTML = '';
          if (cfg.animate === false) Chart.render3d(layer, cfg);
          else Chart.animate3d(layer, cfg);
        } else if (cfg.mode === 'parole') {
          // Lo step 2 non compare di colpo: le parole ci arrivano
          // scivolando, cosi' si vede la spinta che le avvicina.
          if (cfg.animate) {
            layer.innerHTML = '';
            Chart.animateWords(layer, cfg);
          } else {
            Chart.renderWords(layer, cfg);
          }
        } else {
          Chart.render(layer, cfg);
        }
      }
    }

    fit(el);

    bar.style.width = ((i + 1) / N * 100) + '%';
    num.textContent = (i + 1) + ' / ' + N;
    if (location.hash !== '#' + (i + 1)) {
      history.replaceState(null, '', '#' + (i + 1));
    }
  }

  // Charts must survive a resize.
  let rt;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      const s = SLIDES[idx];
      if (s.chart) {
        const layer = slideEls[idx].querySelector('.chart-layer');
        if (layer) {
          layer.innerHTML = '';   // full redraw at the new size
          const cfg = typeof s.chart === 'function' ? s.chart() : s.chart;
          // Dopo un resize il 3D si ridisegna già aperto: rigiocare
          // l'animazione in mezzo alla lezione distrarrebbe.
          if (cfg.mode === '3d') Chart.render3d(layer, Object.assign({}, cfg, { t: 1 }));
          else if (cfg.mode === 'parole') Chart.renderWords(layer, cfg);
          else Chart.render(layer, cfg);
        }
      }
      fit(slideEls[idx]);
    }, 150);
  });

  function next() { if (idx < N - 1) show(idx + 1, 1); }
  function prev() { if (idx > 0) show(idx - 1, -1); }

  document.addEventListener('keydown', e => {
    // In modalità modifica la tastiera serve a scrivere, non a
    // navigare: lascio passare solo Escape e ctrl/cmd+E.
    if (editMode) {
      const toggle = (e.key === 'e' || e.key === 'E') && (e.metaKey || e.ctrlKey);
      if (e.key === 'Escape' || toggle) { e.preventDefault(); setEditMode(false); }
      return;
    }
    if (help.classList.contains('show') && e.key !== '?') {
      help.classList.remove('show'); return;
    }
    switch (e.key) {
      case 'e': case 'E': if (IN_LOCALE) setEditMode(true); return;
      case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); next(); break;
      case 'ArrowLeft':  case 'PageUp':            e.preventDefault(); prev(); break;
      case 'Home': show(0, 1); break;
      case 'End':  show(N - 1, 1); break;
      case 'f': case 'F':
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
        break;
      case '?': help.classList.toggle('show'); break;
      case 'g': case 'G': {
        const t = prompt('Vai alla slide (1-' + N + '):');
        if (t) show(parseInt(t, 10) - 1, 1);
        break;
      }
    }
  });

  // click / tap to advance (right half) or go back (left quarter)
  document.addEventListener('click', e => {
    if (editMode) return;              // in modifica il click serve a scrivere
    if (e.target.closest('#help') || e.target.closest('#lang-switch')) return;
    if (e.target.closest('#edit-badge')) return;
    if (e.target.closest('a')) return; // i link devono poter essere cliccati
    if (e.clientX < window.innerWidth * 0.22) prev(); else next();
  });

  // Salva anche se chiudi la pagina con la modifica ancora attiva.
  window.addEventListener('beforeunload', () => { if (editMode) captureEdits(); });

  // Respond to hash changes (back/forward, or pasting #12 into the bar).
  window.addEventListener('hashchange', () => {
    const h = parseInt((location.hash || '#1').slice(1), 10);
    if (!isNaN(h) && h - 1 !== idx) show(h - 1, 1);
  });

  // Rimetti le modifiche salvate PRIMA di mostrare la prima slide,
  // così non si vede mai il testo vecchio per un istante.
  if (IN_LOCALE) {
    const n = applyStoredEdits();
    if (n) console.log(`[lezione] ${n} modifiche ripristinate dal browser. ` +
                       `Scrivi modifiche() per vederle tutte.`);
    showEditBadge();
  }

  function impostaLingua(l) {
    if (LINGUE.indexOf(l) < 0 || l === window.LANG) return;
    window.LANG = l;
    try { localStorage.setItem('lezione-ai-lingua', l); } catch (e) {}
    document.documentElement.lang = l;
    // ridisegno il testo di ogni slide e butto via i grafici, che
    // verranno ricostruiti nella lingua nuova al prossimo show()
    SLIDES.forEach((sl, i) => {
      slideEls[i].innerHTML = T(typeof sl.html === 'function' ? sl.html() : (sl.html || ''));
    });
    for (const k in chartLayers) delete chartLayers[k];
    aggiornaBottoni();
    show(idx, 1);
  }

  function aggiornaBottoni() {
    document.querySelectorAll('#lang-switch button').forEach(b => {
      b.classList.toggle('on', b.dataset.lang === window.LANG);
    });
  }
  document.getElementById('lang-switch').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) { e.stopPropagation(); impostaLingua(b.dataset.lang); }
  });
  aggiornaBottoni();
  document.documentElement.lang = window.LANG;

  const start = parseInt((location.hash || '#1').slice(1), 10);
  show(isNaN(start) ? 0 : start - 1, 1);
})();
</script>
</body>
</html>
